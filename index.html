  try { inp.setSelectionRange(pos, pos); } catch (e) { }
  inp.dispatchEvent(new Event('input', { bubbles: true }));
}
function npInsert(inp, t) { const [a, b] = npSel(inp); npSet(inp, inp.value.slice(0, a) + t + inp.value.slice(b), a + t.length); }
function npBackspace(inp) { let [a, b] = npSel(inp); if (a === b && a > 0) a--; npSet(inp, inp.value.slice(0, a) + inp.value.slice(b), a); }
// target() — qaysi maydonga yoziladi; actions — maxsus tugmalar (ok, qty, price, sum)
function bindNumpad(root, target, actions = {}) {
  if (!root) return;
  root.querySelectorAll('[data-np]').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault()); // kursor maydonda qolsin
    b.addEventListener('click', () => {
      const k = b.dataset.np, inp = target();
      if (actions[k]) return actions[k](inp);
      if (!inp) return;
      if (k === 'bs') npBackspace(inp);
      else if (k === 'clr') npSet(inp, '', 0);
      else if (k in NP_LABEL) return;
      else npInsert(inp, k);
    });
  });
}
// Oyna ichidagi oxirgi tanlangan maydon (yoʻq boʻlsa birinchisi)
function modalTarget(m) {
  let last = null;
  m.addEventListener('focusin', e => { if (e.target.matches('input:not([type=checkbox]):not([type=radio])')) last = e.target; });
  return () => (last && m.contains(last) ? last : m.querySelector('input.num, input[inputmode]'));
}

'use strict';
/* ===================== Telefon kamerasi bilan shtrix-kod oʻqish =====================
   Kassa, kirim, chiqim, inventarizatsiya, tovar kartasi, tovarlar roʻyxati, aksiya, analitika va mijoz doʻkoni —
   shtrix-kod yoziladigan har bir maydon yonida 📷 tugmasi. */
const CAM_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code'];
// Android'dagi Chrome (va Play Market ilovasi) — BarcodeDetector bor. iPhone/iPad (Safari) da yoʻq — kamera birinchi ochilganda
// ZXing asosidagi polyfill (jsDelivr) yuklanadi. Kompyuterda (sichqoncha) USB skaner bor — 📷 tugmasi chiqmaydi. Xavfsiz manzil (https) kerak
const CAM_POLY = 'https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js';
const camTouch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) || (typeof isIOS === 'function' && isIOS());
const camOk = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext && (window.BarcodeDetector || camTouch()));
let camPolyP = null;
function camPoly() {
  if (window.BarcodeDetector) return Promise.resolve(true);
  if (!camPolyP) camPolyP = new Promise(res => {
    const sc = document.createElement('script'); sc.src = CAM_POLY; sc.async = true; sc.crossOrigin = 'anonymous';
    sc.onload = () => res(!!window.BarcodeDetector); sc.onerror = () => { camPolyP = null; res(false); };
    document.head.appendChild(sc);
  });
  return camPolyP;
}
const camOpen = () => !!document.querySelector('.cam');

// onCode(kod, api) → { ok, text } (kamera oynasida koʻrinadi); api.close() — kamerani yopish.
// Bir xil kod qayta oʻqilishi uchun kamera undan biroz uzoqlashishi kerak
async function camScan(onCode, opts = {}) {
  if (!camOk()) { toast('Bu qurilmada kamera skaneri yoʻq (Android telefonda Chrome yoki ilova kerak)', 'bad'); return null; }
  if (!window.BarcodeDetector && !(await camPoly())) { toast('Kamera skaneri yuklanmadi — internetni tekshirib qayta urinib koʻring', 'bad'); return null; }
  let det;
  try {
    const sup = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : CAM_FORMATS;
    const f = CAM_FORMATS.filter(x => sup.includes(x));
    det = f.length ? new BarcodeDetector({ formats: f }) : new BarcodeDetector();
  } catch (e) { toast('Kamera skaneri ishga tushmadi: ' + (e.message || e.name), 'bad'); return null; }
  const ov = document.createElement('div'); ov.className = 'cam'; if (opts.modals) ov.style.zIndex = 101;   // oyna ichidan ochilsa — oynadan yuqorida
  ov.innerHTML = `<video playsinline muted autoplay></video><div class="cam-frame"><i></i></div>
    <div class="cam-top"><b class="grow">${esc(opts.title || 'Skanerlash')}</b><button class="btn" type="button" data-cam="torch" hidden title="Chiroq">💡</button><button class="btn gold" type="button" data-cam="done">Tayyor</button></div>
    <div class="cam-msg">${esc(opts.hint || 'Shtrix-kodni ramka ichiga toʻgʻrilang')}</div>`;
  document.body.appendChild(ov);
  const v = ov.querySelector('video'), msg = ov.querySelector('.cam-msg');
  let stream = null, stop = false, last = '', lastSeen = 0, busy = false, n = 0;
  const vis = () => { if (document.hidden) close(); };   // ilova yopilsa yoki boshqa oynaga oʻtilsa — kamera oʻchadi
  const close = () => {
    if (stop) return; stop = true;
    if (stream) stream.getTracks().forEach(t => t.stop());
    ov.remove(); document.removeEventListener('visibilitychange', vis);
    if (opts.onClose) opts.onClose(n);
  };
  const api = { close };
  document.addEventListener('visibilitychange', vis);
  ov.querySelector('[data-cam=done]').onclick = close;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) {
    close();
    toast(e.name === 'NotAllowedError' ? 'Kameraga ruxsat berilmadi — telefon sozlamasida ilovaga kamera ruxsatini bering' : 'Kamera ochilmadi: ' + (e.message || e.name), 'bad');
    return null;
  }
  if (stop) { stream.getTracks().forEach(t => t.stop()); return null; }
  v.srcObject = stream; try { await v.play(); } catch (e) { }
  const track = stream.getVideoTracks()[0], caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch) {
    const tb = ov.querySelector('[data-cam=torch]'); let on = false; tb.hidden = false;
    tb.onclick = async () => { on = !on; try { await track.applyConstraints({ advanced: [{ torch: on }] }); tb.classList.toggle('gold', on); } catch (e) { } };
  }
  const show = (t, ok) => { msg.textContent = t; msg.className = 'cam-msg ' + (ok ? 'ok' : 'bad'); };
  const tick = async () => {
    if (stop) return;
    if (!busy && !MODALS.slice(opts.modals || 0).length && v.readyState >= 2) {
      busy = true;
      try {
        const r = await det.detect(v), now = Date.now();
        const code = r && r.length ? String(r[0].rawValue || '').trim() : '';
        if (!code) { if (last && now - lastSeen > 600) last = ''; }        // kod koʻrinmay qoldi — keyingi (bir xil) tovar ham oʻqiladi
        else if (code === last) lastSeen = now;
        else {
          last = code; lastSeen = now; n++;
          try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) { }
          const res = await onCode(code, api);
          if (!stop && res) { show(res.text || code, res.ok !== false); if (res.ok === false && typeof beep === 'function') beep(); }
          if (!stop && opts.once && res && res.ok !== false) { busy = false; close(); return; }
          lastSeen = Date.now();
        }
      } catch (e) { }
      busy = false;
    }
    if (!stop) setTimeout(tick, 120);
  };
  tick();
  return api;
}

// Kod yoziladigan maydon yoniga 📷 tugmasi. Oʻqilgan kod maydonga yoziladi va:
//   opts.mode = 'enter' (odatiy) — Enter bosilgandek; 'input' — qidiruv maydoni (roʻyxat suziladi);
//   opts.onCode(kod, api) — oʻzining ishi (natija { ok, text } qaytaradi).
// Ishlov paytida yangi oyna ochilsa (masalan «Yangi tovar») — kamera yopiladi, oyna koʻrinadi.
function camButton(inp, opts = {}) {
  if (!inp || !camOk() || inp.dataset.cam) return null;
  inp.dataset.cam = '1';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn cam-btn'; b.textContent = '📷'; b.title = 'Telefon kamerasi bilan skanerlash';
  const par = inp.parentElement, flex = par && /flex/.test(getComputedStyle(par).display);
  if (flex) inp.insertAdjacentElement('afterend', b);
  else {   // oddiy blok ichida — maydon va tugma bitta qatorga
    const w = document.createElement('div'); w.className = 'row cam-wrap';
    inp.replaceWith(w); w.append(inp, b); inp.classList.add('grow');
  }
  b.onclick = () => {
    const n0 = MODALS.length;
    camScan(async (code, api) => {
      let res;
      if (opts.onCode) res = await opts.onCode(code, api);
      else {
        inp.value = code;
        if (opts.mode === 'input') inp.dispatchEvent(new Event('input', { bubbles: true }));
        else inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await new Promise(r => setTimeout(r, 60));
        res = opts.check ? opts.check(code) : null;
        if (!res) {
          const p = D.byBarcode.get(code) || (typeof parseScale === 'function' ? (parseScale(code) || {}).p : null);
          res = p ? { ok: true, text: '✓ ' + p.name + (opts.count ? ' — ' + opts.count(p) : '') } : { ok: false, text: 'Topilmadi: ' + code };
        }
      }
      if (MODALS.length > n0 || !inp.isConnected) {          // yangi oyna ochildi (masalan «Yangi tovar») yoki maydon yopildi
        setTimeout(api.close, 0);
        // resume: oyna yopilgach skanerlash oʻzi davom etadi (kirim, chiqim — ketma-ket tovarlar)
        if (opts.resume && inp.isConnected) {
          const t = setInterval(() => {
            if (!inp.isConnected) return clearInterval(t);
            if (MODALS.length <= n0) { clearInterval(t); if (!camOpen()) setTimeout(() => b.click(), 150); }
          }, 300);
        }
      }
      return res;
    }, Object.assign({ modals: n0 }, opts));
  };
  return b;
}

const ORD_ST = { new: ['Yangi', 'gold'], accepted: ['Qabul qilindi', ''], ready: ['Tayyor', 'ok'], done: ['Bajarildi', ''], cancelled: ['Bekor qilindi', 'red'] };

// Har 30 soniyada: yangi buyurtma — ovoz; faol (yangi, qabul qilingan, tayyor) buyurtma bor ekan — menyuda qizil miltillaydi
async function pollOrders() {
  if (!S.session || !S.me || !['admin', 'kassa'].includes(S.me.role) || !S.online) return;
  try {
    const rows = await API.get('orders?select=id,status&status=in.(new,accepted,ready)');
    const n = rows.filter(o => o.status === 'new').length;
    if (n > S.newOrders) { toast('Yangi buyurtma keldi (' + n + ')', 'ok'); beep(); if (S.tab === 'buyurtmalar' && SCREENS.buyurtmalar.reload) SCREENS.buyurtmalar.reload(); }
    S.newOrders = n; S.activeOrders = rows.length;
    $$('.ord-badge').forEach(b => { b.textContent = S.activeOrders || ''; b.classList.toggle('hide', !S.activeOrders); });
    if (typeof menuMarks === 'function') menuMarks();
  } catch (e) { }
}
setInterval(pollOrders, 30000);
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(a.destination); o.start();
    setTimeout(() => { o.stop(); a.close(); }, 300);
  } catch (e) { }
}

function askText(title, ph) {

      <div class="foot"><button class="btn" data-x="no">Ortga</button><button class="btn red" data-x="ok">Bekor qilish</button></div>`, { onClose: () => res(null) });
    const ok = () => { const v = $('#at-v').value.trim(); const mm = MODALS.pop(); mm.ov.remove(); refocus(); res(v); };
    m.querySelector('[data-x=ok]').onclick = ok; m.querySelector('[data-x=no]').onclick = () => closeModal();

// Buyurtmani savatga olib, odatdagidek sotish; sotuvdan keyin buyurtma «Bajarildi» boʻladi
async function orderToCart(o, lines) {
  if (!S.staff) { toast('Avval kassir sifatida PIN bilan kiring', 'bad'); return; }
  const had = S.carts.findIndex(c => c.order_id === o.id);
  if (had >= 0) { S.cart = had; saveCarts(); go('kassa'); return; }
  let c = cart();
  if (c.lines.length) {
    if (S.carts.length >= 10) { toast('Boʻsh savat yoʻq — avval bittasini yoping', 'bad'); return; }
    c = newCart(); S.carts.push(c); S.cart = S.carts.length - 1;
  }
  if (!D.clients.find(x => x.id === o.client_id)) D.clients.push({ id: o.client_id, name: o.client_name, phone: o.phone, active: true });
  Object.assign(c, { order_id: o.id, order_no: o.number, client: o.client_id });
  for (const l of lines) {
    const p = D.products.get(l.product_id);
    // buyurtma narxi oʻzgarmaydi (ilovadagi aksiya bilan); aksiya belgisi chekka oʻtadi
    c.lines.push(Object.assign({ pid: l.product_id, name: l.name, unit: l.unit, qty: round3(+l.qty), price: +l.price, base: p ? +p.sale_price : +l.price, fixed: true },
      l.promotion_id ? { promoId: l.promotion_id, promo: 'Aksiya' } : {}));
  }
  c.sel = c.lines.length - 1; saveCarts();
  if (o.status === 'new') { try { await API.rpc('order_set_status', { p_id: o.id, p_status: 'accepted' }); pollOrders(); } catch (e) { } }
  go('kassa'); toast('Buyurtma №' + o.number + ' savatga olindi', 'ok');
}

function shopTotal() {

async function shopLoad() {
  // Versiya katalogdan OLDIN olinadi: yuklash paytidagi oʻzgarish ham keyingi tekshiruvda koʻrinadi
  const ver = await API.rpc('data_version').catch(e => { if (e.code === 'NET') throw e; return null; });
  // katalog 1000 tadan koʻp — boʻlaklab olinadi (Supabase bir soʻrovda 1000 qator beradi)
  const [items, me, promos, contacts, freq, dlv, sst, sup] = await Promise.all([API.rpcAll('client_catalog', {}, 'id'), API.rpc('client_me'), API.rpc('client_promotions').catch(() => []),
    API.rpc('store_contacts').catch(() => null), API.rpc('client_frequent', { p_limit: 12 }).catch(() => []), API.rpc('delivery_status').catch(() => null), API.rpc('store_status').catch(() => null),
    // Taʼminotchimi (31-SQL): Telegram ichida ochilgan boʻlsa — imzo ham yuboriladi (seans egasi tasdiqlanadi)
    API.rpc('supplier_me', { p_init: (typeof TG !== 'undefined' && TG.init) || null }).catch(() => null)]);
  SHOP.sup = sup && Array.isArray(sup.suppliers) && sup.suppliers.length ? sup : null;
  SHOP.dlv = !(dlv && dlv.on === false);
  SHOP.open = !(sst && sst.open === false);   // doʻkon ochiq: kamida bitta kassa ochiq (23-SQL yoʻq boʻlsa — ochiq deb)   // yetkazib berish ishlayaptimi (17-SQL yoʻq boʻlsa — ishlayapti deb)
  if (ver) S.dataVer = ver;
  SHOP.promos = promos || []; SHOP.contacts = contacts && typeof contacts === 'object' && !Array.isArray(contacts) ? contacts : {};
  SHOP.items = items.map(p => Object.assign(p, { _n: norm(p.name), price: +p.price }));
  SHOP.byId = new Map(SHOP.items.map(p => [p.id, p]));
  // «Xit» — oxirgi 30 kunda eng koʻp olinganlar (yuqori 8%, kamida 5 marta)
  const pops = SHOP.items.map(p => +p.pop || 0).filter(n => n >= 5).sort((a, b) => b - a);
  SHOP.hitMin = pops.length ? Math.max(5, pops[Math.min(pops.length - 1, Math.floor(SHOP.items.length * 0.08))]) : Infinity;
  SHOP.freq = (Array.isArray(freq) ? freq : []).map(f => SHOP.byId.get(f.product_id)).filter(Boolean);
  SHOP.me = (me && me[0]) || SHOP.me; SHOP.at = Date.now();
  for (const id of Object.keys(SHOP.cart)) if (!SHOP.byId.has(id)) delete SHOP.cart[id];
  shopCartSave();
}

  };

'use strict';
/* ===================== Mijozlar ilovasi: 🚚 Taʼminotchi boʻlimi (31-SQL) =====================
   Taʼminotchi (botga raqamini yuborgan yoki raqami tasdiqlangan) ismi yonida «🚚 Taʼminotchi» belgisi chiqadi.
   Belgini yoki ismini bossa — taʼminotchi boʻlimi: doʻkon undan oladigan tovarlar (oxirgi narxi, sanasi, kam qolganlari)
   va «Yangi tovar taklif qilish» — taklif rahbarga boradi, javobi shu yerda va Telegramda. Bosmasa — oddiy mijoz. */
const SUP = { firm: '', tab: 'p', q: '', low: false, items: [], offers: [] };
// Taʼminotchi boʻlimi ochiq qoldirilganmi (sahifa yangilansa ham shu boʻlimda qoladi; ilova yopilsa — xaridor rejimi)
function supMode(v) {
  try {
    if (v === true) sessionStorage.setItem('supMode', '1'); else if (v === false) sessionStorage.removeItem('supMode');
    return sessionStorage.getItem('supMode') === '1';
  } catch (e) { return false; }
}
const supDate = d => d ? String(d).slice(8, 10) + '.' + String(d).slice(5, 7) + '.' + String(d).slice(0, 4) : '';
const supNew = () => !!(SHOP.sup && SHOP.sup.last_answer && String(SHOP.sup.last_answer) > String(ls.get('supSeen', '')));

// Sarlavhadagi ism: taʼminotchi boʻlsa — yonida «🚚 Taʼminotchi» belgisi (javob kelgan boʻlsa — nuqta)
function shopWho() {
  const el = $('#sh-who'); if (!el) return;
  const nm = esc(S.me?.display_name || SHOP.me?.name || '');
  if (!SHOP.sup) { el.innerHTML = nm; return; }
  el.innerHTML = `<button type="button" class="sh-name" id="sh-sup-n" title="Taʼminotchi boʻlimi">${nm}</button>`
    + `<button type="button" class="sup-badge" id="sh-sup" title="Taʼminotchi boʻlimi">🚚 Taʼminotchi${supNew() ? '<i class="sup-dot"></i>' : ''}</button>`;

  $('#sh-sup-n').onclick = () => scrSupplier();
}

async function scrSupplier() {
  if (!SHOP.sup) return scrShop();
  supMode(true);
  const firms = SHOP.sup.suppliers || [];
  if (firms.length === 1) SUP.firm = firms[0].id; else if (SUP.firm && !firms.some(f => f.id === SUP.firm)) SUP.firm = '';

async function supLoad() {
  try {
    const [items, offers] = await Promise.all([API.rpc('supplier_products', { p_sup: SUP.firm || null }), API.rpc('my_supplier_offers')]);
    SUP.items = (items || []).map(p => Object.assign(p, { _n: norm(p.name) }));
    SUP.offers = (offers || []).filter(o => !SUP.firm || o.supplier_id === SUP.firm);
    SUP.err = '';
  } catch (e) {
    SUP.err = e.code === 'NET' ? 'Internet yoʻq. Ulanib, qayta oching.' : e.message;
    if (/ochilmagan/.test(e.message)) { SHOP.sup = null; supMode(false); toast('Taʼminotchi boʻlimi yopilgan', 'bad'); return scrShop(); }
  }
}

  if (SUP.err) { $('#su-tools').innerHTML = ''; body.innerHTML = `<div class="alert bad">${esc(SUP.err)}</div>`; return; }
  if (SUP.tab === 'o') return supOffers();
  const nLow = SUP.items.filter(p => p.low).length;
  if (!$('#su-q')) {
    $('#su-tools').innerHTML = `<div class="shop-search"><input id="su-q" type="search" placeholder="Tovar qidirish: nomi yoki shtrix-kodi" autocomplete="off"></div><div class="chips" id="su-ch"></div>`;
    $('#su-q').value = SUP.q;

  $$('#su-ch [data-low]').forEach(b => b.onclick = () => { SUP.low = b.dataset.low === '1'; supDraw(); });
  const words = norm(SUP.q).split(' ').filter(Boolean), code = String(SUP.q || '').trim();
  const list = SUP.items.filter(p => (!SUP.low || p.low) && ((code && p.barcode === code) || words.every(w => p._n.includes(w))));

// Kunlik savdo ustunlari (bitta qator — legenda shart emas, sarlavha nomlaydi); sichqoncha bilan qiymat
function anDailyChart(el, data) {
  if (!el) return;
  const W = Math.round(Math.max(360, el.clientWidth || 900)), H = 230, L = 58, R = 10, T = 12, B = 26, n = data.length || 1;
  const max = Math.max(1, ...data.map(d => +d.revenue));
  const step = (() => { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; })();
  const top = Math.ceil(max / step) * step, y = v => T + (H - T - B) * (1 - v / top), band = (W - L - R) / n, bw = Math.min(24, band * 0.7);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${fmtK(v)}</text>`;
  const bars = data.map((d, i) => {
    const x = L + band * i + (band - bw) / 2, v = +d.revenue, yy = y(v), h = (H - B) - yy, r = Math.min(4, h, bw / 2);
    const path = h > 0 ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - B} Z` : '';
    const lab = (n <= 31 ? i % 5 === (n - 1) % 5 : i % 15 === (n - 1) % 15) ? `<text x="${x + bw / 2}" y="${H - 8}" class="ax" text-anchor="middle">${fmtDate(d.d).slice(0, 5)}</text>` : '';
    return `<g class="bar" data-i="${i}"><rect x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>${path ? `<path d="${path}" class="mk"/>` : ''}${lab}</g>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Kunlik savdo">${g}<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" class="bl"/>${bars}</svg><div class="tip hide"></div>`;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('.bar').forEach(b => {
    const show = e => {
      const d = data[+b.dataset.i]; tip.innerHTML = ''; tip.classList.remove('hide');
      const v = document.createElement('b'); v.textContent = fmt(d.revenue) + ' soʻm';
      const s1 = document.createElement('div'); s1.className = 'sm'; s1.textContent = 'Foyda: ' + fmt(d.profit);
      const s2 = document.createElement('div'); s2.className = 'sm mut'; s2.textContent = fmtDate(d.d);
      tip.append(v, s1, s2);
      const r = el.getBoundingClientRect(), x = (e.clientX ?? (b.getBoundingClientRect().left + 10)) - r.left;
      tip.style.left = Math.min(Math.max(x + 12, 0), r.width - 150) + 'px'; tip.style.top = '8px';
      b.classList.add('on');
    };
    b.addEventListener('pointermove', show); b.addEventListener('pointerleave', () => { tip.classList.add('hide'); b.classList.remove('on'); });
  });
}
// Tartiblangan gorizontal ustunlar (bitta rang), qiymat ustun oxirida

function anSegBar(parts, total) {

  const tbl = el.querySelector('.an-t');
  const filt = () => { const t = norm(q).trim(); return rows.filter(r => !t || norm(r.name || r.category || '').includes(t) || String(r.barcode || '').includes(q.trim())); };
  const sorted = () => {
    const list = filt();
    return sortK ? list.slice().sort((a, b) => { const x = a[sortK], y = b[sortK]; return (typeof x === 'number' || typeof y === 'number' || !isNaN(+x) ? ((+x || 0) - (+y || 0)) : String(x ?? '').localeCompare(String(y ?? ''))) * sortD; }) : list;
  };
  const draw = () => {
    let list = sorted();
    const sum = k => list.reduce((t, r) => t + (+r[k] || 0), 0);
    tbl.innerHTML = `<thead><tr>${cols.map(c => `<th class="${c.num ? 'r' : ''} sortable" data-k="${c.k}" title="Saralash">${c.t}${sortK === c.k ? (sortD > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${list.slice(0, shown).map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'r num' : ''} ${c.cls ? c.cls(r) : ''}">${c.f ? c.f(r[c.k], r) : esc(r[c.k] ?? '')}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="mut">Maʼlumot yoʻq</td></tr>`}</tbody>
      ${totals.length && list.length ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.num ? 'r num' : ''} b">${i === 0 ? 'Jami' : totals.includes(c.k) ? fmt(sum(c.k)) : ''}</td>`).join('')}</tr></tfoot>` : ''}`;
    el.querySelector('.an-cnt').textContent = list.length + ' ta';
    el.querySelector('.an-more').innerHTML = list.length > shown ? `<button class="btn blk" style="margin-top:8px">Yana ${list.length - shown} ta</button>` : '';
    const mb = el.querySelector('.an-more button'); if (mb) mb.onclick = () => { shown += 300; draw(); };
    tbl.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { if (sortK === th.dataset.k) sortD = -sortD; else { sortK = th.dataset.k; sortD = -1; } draw(); });
  };
  const qi = el.querySelector('.an-q'); if (qi) { qi.oninput = () => { q = qi.value; shown = 300; draw(); }; qi.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); }; camButton(qi, { once: true, mode: 'input', title: 'Tovarni skanerlang' }); }
  el.querySelector('.an-csv').onclick = () => {
    const list = sorted(), tabName = (AN_TABS.find(x => x[0] === S.anTab) || [, 'Hisobot'])[1];
    const money = k => /total|revenue|profit|frozen|balance|value|lost_revenue|lost_profit|day_loss|price|^s[123]?$|^p[123]?$|cost/.test(k);
    const xc = cols.map(c => ({ t: c.t.replace(/<br>/g, ' ').replace(/<[^>]*>/g, ''), num: !!c.num, int: !!c.num && money(c.k), w: c.num ? 14 : c.k === 'name' || c.k === 'category' ? 36 : 18 }));
    const sum = k => list.reduce((t, r) => t + (+r[k] || 0), 0);
    xlsxDownload(csv + '_' + todayTK(), { sheet: tabName, title: tabName + ' — ' + fmtDate(todayTK()), cols: xc,
      rows: list.map(r => cols.map(c => { const v = r[c.k]; return v == null ? '' : c.num ? +v : v; })),
      total: totals.length ? cols.map((c, i) => i === 0 ? 'Jami' : totals.includes(c.k) ? Math.round(sum(c.k)) : '') : null });
  };
  draw();
}

  $$('[data-iv]').forEach(tr => tr.onclick = () => { const d = list.find(x => x.id === tr.dataset.iv); if (d.status === 'open') invCount(d); else invView(d); });
  const open = list.find(d => d.status === 'open');
  if (open && S.invAuto !== open.id) { S.invAuto = open.id; invCount(open); }   // ochiq hujjat boʻlsa — darhol sanashga
};

// Sanash oynasi: skaner (+1 yoki soni soʻraladi), sanalganlar va sanalmaganlar roʻyxati, yakunlash (admin)
async function invCount(d) {
  const main = $('#main'); if (!main) return;
  document.onkeydown = null;
  const adm = adminUI();
  let lines = [], unc = null, tab = 'counted', mode = ls.get('invMode') || 'add', drop = [];
  main.innerHTML = `<div class="row w"><button class="btn" id="ic-back">← Roʻyxat</button><div class="h1 grow">Inventarizatsiya №${esc(d.number || '')}</div><span class="tag gold">${esc(d.label || '')}</span></div>
    <div class="card" style="margin-top:8px">
      <div class="row w"><input id="ic-q" class="lg grow" placeholder="Shtrix-kodni skanerlang yoki nomini yozing…" autocomplete="off" enterkeyhint="done">
        <div class="seg"><button data-md="add" class="${mode === 'add' ? 'on' : ''}" title="Har skanerda +1">Har urishda +1</button><button data-md="ask" class="${mode === 'ask' ? 'on' : ''}" title="Har skanerda sonini soʻraydi">Sonini yozish</button></div></div>
      <div class="drop hide" id="ic-drop" style="position:relative"></div>
      <div id="ic-last" class="ic-last mut">Tovarni skanerlang — sanalgani shu yerda koʻrinadi.</div>
    </div>
    <div class="row w" style="margin:10px 0"><div class="seg"><button data-t="counted" class="on">Sanalganlar <b id="ic-n1">0</b></button><button data-t="unc">Sanalmaganlar <b id="ic-n2">…</b></button></div>
      <div class="grow"></div><span id="ic-sum" class="sm"></span>
      ${adm ? '<button class="btn red" id="ic-cancel">Bekor qilish</button><button class="btn gold" id="ic-fin">Yakunlash</button>' : '<span class="mut sm">Yakunlashni admin qiladi</span>'}</div>
    <div class="card" id="ic-list" style="padding:0">Yuklanmoqda…</div>`;
  const q = $('#ic-q');
  camButton(q, { title: 'Inventarizatsiya: sanash', hint: 'Har oʻqilgan tovar sanaladi (+1). Bir xil tovarlar orasida kamerani biroz uzoqlashtiring' });
  const draw = () => {
    if (!$('#ic-list')) return;
    $('#ic-n1').textContent = lines.length; if (unc) $('#ic-n2').textContent = unc.length;
    const short = lines.filter(l => l.diff < 0), plus = lines.filter(l => l.diff > 0);
    $('#ic-sum').innerHTML = adm ? `Kam: <b class="bad">${short.length} ta · ${fmt(short.reduce((a, l) => a - l.diff * (+l.cost || 0), 0))}</b> · Ortiqcha: <b>${plus.length} ta · ${fmt(plus.reduce((a, l) => a + l.diff * (+l.cost || 0), 0))}</b> soʻm`
      : `Kam: <b class="bad">${short.length}</b> · Ortiqcha: <b>${plus.length}</b>`;
    if (tab === 'counted') {
      $('#ic-list').innerHTML = `<table class="t"><thead><tr><th>Tovar</th><th class="r">Hisobda</th><th class="r">Sanaldi</th><th class="r">Farq</th>${adm ? '<th class="r">Farq, soʻm</th>' : ''}<th></th></tr></thead><tbody>${lines.map(l => `
        <tr class="click" data-ln="${l.product_id}"><td><b>${esc(l.name)}</b>${l.barcode ? `<span class="mut sm"> · ${esc(l.barcode)}</span>` : ''}</td><td class="r num">${fmtQ(+l.expected)} ${esc(l.unit)}</td>
          <td class="r num b">${fmtQ(+l.counted)}</td><td class="r num ${l.diff < 0 ? 'bad' : l.diff > 0 ? 'ok' : 'mut'}">${l.diff > 0 ? '+' : ''}${fmtQ(+l.diff)}</td>
          ${adm ? `<td class="r num ${l.diff < 0 ? 'bad' : ''}">${l.diff ? fmt(l.diff * (+l.cost || 0)) : '—'}</td>` : ''}<td class="nw"><button class="btn" data-exp="${l.product_id}" title="Yaroqlilik muddatini tuzatish">🗓 Srok</button> <button class="x btn" data-rm="${l.product_id}" title="Roʻyxatdan olib tashlash">×</button></td></tr>`).join('')
        || `<tr><td colspan="6" class="mut">Hali sanalmagan — tovarni skanerlang</td></tr>`}</tbody></table>`;
      $$('#ic-list [data-ln]').forEach(tr => tr.onclick = e => { if (e.target.closest('button')) return; const l = lines.find(x => x.product_id === tr.dataset.ln); setQty(D.products.get(l.product_id) || l, l.counted); });
      $$('#ic-list [data-exp]').forEach(b => b.onclick = () => { const l = lines.find(x => x.product_id === b.dataset.exp); expFixDialog(D.products.get(l.product_id) || { id: l.product_id, name: l.name, unit: l.unit }); });
      $$('#ic-list [data-rm]').forEach(b => b.onclick = async () => {
        const l = lines.find(x => x.product_id === b.dataset.rm);
        if (!(await confirmBox('«' + l.name + '» sanalganlardan olib tashlansinmi?', 'Olib tashlash'))) return;
        try { await API.rpc('inv_remove', { p_id: d.id, p_product: l.product_id }); lines = lines.filter(x => x !== l); unc = null; draw(); loadUnc(); } catch (e) { toast(invErr(e), 'bad'); }
      });
    } else {
      $('#ic-list').innerHTML = unc == null ? '<div class="mut" style="padding:12px">Yuklanmoqda…</div>'
        : `<table class="t"><thead><tr><th>Tovar</th><th class="r">Hisobda</th><th></th></tr></thead><tbody>${unc.slice(0, 500).map(u => `<tr class="click" data-un="${u.product_id}"><td>${esc(u.name)}${u.barcode ? `<span class="mut sm"> · ${esc(u.barcode)}</span>` : ''}</td><td class="r num ${+u.stock < 0 ? 'bad' : ''}">${fmtQ(+u.stock)} ${esc(u.unit)}</td><td class="r"><span class="mut">sanash ›</span></td></tr>`).join('')
          || '<tr><td colspan="3" class="mut">Hammasi sanaldi 👍</td></tr>'}</tbody></table>${unc.length > 500 ? `<div class="mut sm" style="padding:8px">Birinchi 500 tasi koʻrsatildi (jami ${unc.length})</div>` : ''}`;
      $$('#ic-list [data-un]').forEach(tr => tr.onclick = () => { const u = unc.find(x => x.product_id === tr.dataset.un); setQty(D.products.get(u.product_id) || u, null); });
    }
  };
  const loadLines = async () => { try { lines = await API.rpcAll('inv_lines', { p_id: d.id }); draw(); } catch (e) { if ($('#ic-list')) $('#ic-list').innerHTML = `<div class="alert bad">${esc(invErr(e))}</div>`; } };
  const loadUnc = async () => { try { unc = await API.rpcAll('inv_uncounted', { p_id: d.id }); draw(); } catch (e) { } };
  const shown = (p, r, added) => {
    const el = $('#ic-last'); if (!el) return;
    const diff = +r.counted - +r.expected;
    el.className = 'ic-last ok';
    el.innerHTML = `✓ <b>${esc(p.name)}</b>${added ? ` <span class="tag">+${fmtQ(added)}</span>` : ''} — sanaldi <b class="lg">${fmtQ(+r.counted)}</b> ${esc(p.unit || '')}, hisobda ${fmtQ(+r.expected)} <span class="${diff < 0 ? 'bad' : diff > 0 ? 'ok' : 'mut'}">(${diff > 0 ? '+' : ''}${fmtQ(diff)})</span>`;
  };
  const apply = (p, r) => {
    const l = lines.find(x => x.product_id === p.id), diff = round3(+r.counted - +r.expected);
    if (l) { l.counted = +r.counted; l.diff = diff; l.counted_at = new Date().toISOString(); lines = [l, ...lines.filter(x => x !== l)]; }
    else {
      lines.unshift({ product_id: p.id, name: p.name, barcode: p.barcode, unit: p.unit, expected: +r.expected, counted: +r.counted, diff, cost: adm ? +p.cost_price || 0 : null });
      if (unc) unc = unc.filter(u => u.product_id !== p.id);
    }
    draw();
  };
  const count = async (p, qty, add = true) => {
    try {
      const r = await API.rpc('inv_count', { p_id: d.id, p_product: p.id, p_qty: qty, p_add: add, p_staff: S.staff?.id || S.adminStaffId || null });
      apply(p, r); shown(p, r, add ? qty : 0);
    } catch (e) { toast(invErr(e), 'bad'); const el = $('#ic-last'); if (el) { el.className = 'ic-last bad'; el.textContent = invErr(e); } }
  };
  const setQty = async (p, cur) => {
    const n = await askNumber('Sanalgan miqdor: ' + p.name, { value: cur ?? '', hint: 'Jami nechta bor — shu sonni yozing' });
    if (n == null || n < 0) return; await count(p, n, false);
  };
  const scan = async p => {
    if (!p) return;
    const weighted = p.is_weighted || ['kg', 'l', 'm'].includes(p.unit);
    if (mode === 'ask' || weighted) {
      const n = await askNumber((weighted ? 'Ogʻirligi / miqdori: ' : 'Nechta: ') + p.name, { hint: weighted ? 'Masalan 2,5' : 'Shu joydagi sonini yozing — avvalgisiga qoʻshiladi' });
      if (n == null || n <= 0) return; await count(p, n, true);
    } else await count(p, 1, true);
    q.focus();
  };
  const hideDrop = () => { drop = []; $('#ic-drop').classList.add('hide'); };
  q.oninput = () => {
    const t = q.value.trim(); drop = t && !/^\d{6,}$/.test(t) ? findProducts(t, 12) : [];
    $('#ic-drop').innerHTML = drop.map((p, i) => `<div data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="mut sm">${esc(p.barcode || '')}</span></div>`).join('');
    $('#ic-drop').classList.toggle('hide', !drop.length);
    $$('#ic-drop [data-i]').forEach(el => el.onmousedown = e => { e.preventDefault(); const p = drop[+el.dataset.i]; q.value = ''; hideDrop(); scan(p); });
  };
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = q.value.trim(); if (!v) return;
    q.value = ''; const first = drop[0]; hideDrop();
    const sc = parseScale(v);
    if (sc && sc.p) return count(sc.p, sc.qty, true);
    const p = D.byBarcode.get(v) || (/^\d{6,}$/.test(v) ? null : first);
    if (!p) { toast('Topilmadi: ' + v, 'bad'); beep(); return; }
    scan(p);
  };
  $$('[data-md]').forEach(b => b.onclick = () => { mode = b.dataset.md; ls.set('invMode', mode); $$('[data-md]').forEach(x => x.classList.toggle('on', x === b)); q.focus(); });
  $$('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; $$('[data-t]').forEach(x => x.classList.toggle('on', x === b)); draw(); if (tab === 'unc' && unc == null) loadUnc(); q.focus(); });
  $('#ic-back').onclick = () => { S.invAuto = d.id; go('inventar'); };
  if ($('#ic-cancel')) $('#ic-cancel').onclick = async () => {
    if (!(await confirmBox('Inventarizatsiya bekor qilinsinmi? Sanalganlar saqlanmaydi, qoldiq oʻzgarmaydi.', 'Bekor qilish'))) return;
    try { await API.rpc('inv_cancel', { p_id: d.id }); toast('Bekor qilindi', 'ok'); S.invAuto = d.id; await syncDown(); go('inventar'); } catch (e) { toast(invErr(e), 'bad'); }
  };
  if ($('#ic-fin')) $('#ic-fin').onclick = async () => {
    await ready;   // roʻyxat hali yuklanmagan boʻlsa — kutiladi
    if (!lines.length) return toast('Hali birorta tovar sanalmagan', 'bad');
    if (unc == null) await loadUnc();
    const withStock = (unc || []).filter(u => +u.stock !== 0);
    const short = lines.filter(l => l.diff < 0), plus = lines.filter(l => l.diff > 0);
    const m = modal(`<h3>Inventarizatsiyani yakunlash</h3>
      <div>Sanaldi: <b>${lines.length}</b> ta tovar</div>
      <div>Kam chiqdi: <b class="bad">${short.length} ta — ${fmt(short.reduce((a, l) => a - l.diff * (+l.cost || 0), 0))} soʻm</b></div>
      <div>Ortiqcha chiqdi: <b>${plus.length} ta — ${fmt(plus.reduce((a, l) => a + l.diff * (+l.cost || 0), 0))} soʻm</b></div>
      ${withStock.length ? `<label class="row" style="margin-top:10px"><input type="checkbox" id="if-zero" style="width:auto"> Sanalmagan, lekin hisobda bor <b>${withStock.length}</b> ta tovar «yoʻq» deb hisoblansin (qoldigʻi 0 qilinadi)</label>
        <div class="mut sm">Belgilanmasa — ularning qoldigʻi oʻzgarmaydi.</div>` : ''}
      <div class="mut sm" style="margin-top:8px">Sanalganlarning qoldigʻi sanalgan miqdorga tuzatiladi. Natija adminning Telegramiga boradi.</div>
      <label class="row" style="margin-top:10px"><input type="checkbox" id="if-week" style="width:auto" checked> Haftalik inventarizatsiya shu bilan <b>qilindi</b> — kassadagi qizil ogohlantirish oʻchadi, 7 kundan keyin yana yonadi</label>
      <div id="if-err" class="alert bad hide"></div>
      <div class="foot"><button class="btn" data-x="no">Ortga</button><button class="btn gold" data-x="ok">Yakunlash</button></div>`);
    m.querySelector('[data-x=no]').onclick = () => closeModal();
    m.querySelector('[data-x=ok]').onclick = async () => {
      m.querySelector('[data-x=ok]').disabled = true;
      try {
        const week = $('#if-week') && $('#if-week').checked;
        const r = await API.rpc('inv_finish', { p_id: d.id, p_zero: !!($('#if-zero') && $('#if-zero').checked), p_staff: S.staff?.id || S.adminStaffId || null });
        if (week) { try { const st = await API.rpc('inv_week_done', { p_staff: S.staff?.id || S.adminStaffId || null }); if (st) { D.inv = st; ls.set('inv', st); } } catch (e) { toast(invErr(e), 'bad'); } }
        closeModal(); toast(`Yakunlandi: kam ${fmt(r.short_value)} · ortiqcha ${fmt(r.surplus_value)} soʻm`, 'ok');
        S.invAuto = d.id; await syncDown(); onDataChanged(); go('inventar');
      } catch (e) { m.querySelector('[data-x=ok]').disabled = false; showErr('#if-err', invErr(e)); }
    };
  };
  q.focus();
  const ready = loadLines();
  await ready; loadUnc();
}

/* ---------- Haftalik inventarizatsiya: admin «qilindi» deb belgilaydi — kassadagi qizil ogohlantirish oʻchadi, aniq 7 kundan keyin yana yonadi ---------- */
const INV_WEEK = 7 * 864e5;
function invWeekCard() {
  const el = $('#iv-week'); if (!el) return;
  const v = D.inv || {}, at = v.week_at !== undefined ? v.week_at : v.last, t = at ? Date.parse(at) : NaN;
  const due = isNaN(t) || Date.now() - t >= INV_WEEK, days = isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5);
  const btn = adminUI() ? '<button class="btn" id="iv-done">Haftalik inventarizatsiya qilindi</button>' : '';
  el.innerHTML = due
    ? `<div class="alert bad row w" style="margin:0 0 10px"><span class="grow">🧮 ${days == null ? 'Haftalik inventarizatsiya hali qilinmagan.' : `Oxirgi inventarizatsiyaga <b>${days} kun</b> boʻldi.`} Kassada qizil ogohlantirish yonib turibdi — sanab chiqing; admin yakunlab tasdiqlagach oʻchadi.</span>${btn}</div>`
    : `<div class="alert row w" style="margin:0 0 10px;background:#EEF6EE;color:var(--ok)"><span class="grow">✓ Haftalik inventarizatsiya qilingan: ${esc(timeStr(at))}${v.week_by ? ' · ' + esc(v.week_by) : ''}. Keyingisi: <b>${esc(timeStr(new Date(t + INV_WEEK).toISOString()))}</b></span></div>`;
  if ($('#iv-done')) $('#iv-done').onclick = invWeekDone;
}
async function invWeekDone() {
  if (!(await confirmBox('Haftalik inventarizatsiya qilindi deb belgilansinmi? Kassadagi qizil ogohlantirish oʻchadi va aniq 7 kundan keyin yana yonadi.', 'Qilindi'))) return;
  try {
    const st = await API.rpc('inv_week_done', { p_staff: S.staff?.id || S.adminStaffId || null });
    if (st) { D.inv = st; ls.set('inv', st); }
    toast('Belgilandi — keyingi inventarizatsiya 7 kundan keyin', 'ok');
    if (typeof renderInvBar === 'function') renderInvBar();
    invWeekCard();
  } catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : /inv_week_done|PGRST202/.test(e.code + ' ' + e.message) ? 'Avval Supabase’da yangi 13-SQL faylni ishga tushiring' : e.message, 'bad'); }
}

// Inventarizatsiyada srokni tuzatish: tanlangan sana tovarning butun hozirgi qoldigʻiga qoʻyiladi (oldingi sroklar hisobdan chiqadi)
async function expFixDialog(p) {
  const m = modal(`<h3>🗓 Yaroqlilik muddati — <span translate="no">${esc(p.name)}</span></h3>
    <div id="ef-now" class="mut">Yuklanmoqda…</div>
    <div class="row" style="margin-top:8px"><div class="grow"><label>Ishlab chiqarilgan</label><input id="ef-md" type="date" max="${todayTK()}"></div>
      <div class="grow"><label>Yaroqli (gacha) *</label><input id="ef-ed" type="date" class="dt need"></div></div>

      3) Mijoz keyingi xaridda ball bilan toʻlaydi: kassada «Ishlatish» — hammasi yoki kerakli soni yoziladi. Tovar qaytarilsa, sarflangan ball qaytmaydi, shu xariddan berilgan ball olib qoʻyiladi.</div>
    <div class="h2" style="margin:0 0 6px">Qoʻshimcha qoidalar</div>
    <div class="card" id="ly-list" style="padding:0">Yuklanmoqda…</div>
    <div class="row w" style="margin-top:16px"><div class="h2 grow" style="margin:0">Mijozlar</div><select id="ly-s" style="width:auto">${Object.entries(LY_SORT).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select><input id="ly-q" placeholder="Ism yoki telefon" style="max-width:240px"></div>
    <div class="card" id="ly-cl" style="padding:0;margin-top:8px">Yuklanmoqda…</div>`;
  let tab = 'act', rules = [], cls = [];
  const bvx = () => {
    const v = num($('#ly-bv').value), ps = num($('#ly-ps').value), pp = num($('#ly-pp').value);
    const ex = ps > 0 && pp > 0 ? `Masalan: 57 000 soʻmlik xariddan ${fmtBall(Math.floor(57000 / ps) * pp)} ball yigʻiladi. ` : 'Har necha soʻm savdoga necha ball berilishini yozing (masalan: har 10 000 soʻmga 1 ball). ';
    $('#ly-bvx').textContent = ex + (v > 0 ? `Mijozda 50 ball boʻlsa — kassada ${fmt(50 * v)} soʻm ayriladi (xohlasa kamroq ball ishlatadi).` : '');
  };
  ['#ly-bv', '#ly-ps', '#ly-pp'].forEach(x => $(x).oninput = bvx); bvx();
  $('#ly-save').onclick = async () => {
    const v = num($('#ly-bv').value), ps = $('#ly-ps').value.trim() === '' ? 0 : num($('#ly-ps').value), pp = $('#ly-pp').value.trim() === '' ? 0 : num($('#ly-pp').value);
    if (!(v > 0 && v <= 100000)) return toast('1 ball qiymatini toʻgʻri yozing', 'bad');
    if (isNaN(ps) || isNaN(pp) || ps < 0 || pp < 0 || (ps > 0) !== (pp > 0)) return toast('«Har necha soʻm savdoga necha ball» — ikkalasini ham yozing (yoki ikkalasini boʻsh qoldiring)', 'bad');
    const old = ballValue();
    if (v !== old && cls.some(c => +c.bonus > 0) && !(await confirmBox(`1 ball ${fmtBall(old)} soʻmdan ${fmtBall(v)} soʻmga oʻzgaradi. Mijozlardagi ${fmtBall(cls.reduce((a, c) => a + Math.max(0, +c.bonus), 0))} ball endi ${fmt(cls.reduce((a, c) => a + Math.max(0, +c.bonus), 0) * v)} soʻmga teng boʻladi. Davom etilsinmi?`, 'Saqlash'))) return;
    try { await API.insert('settings', [{ store_id: 1, key: 'ball_value', value: v }, { store_id: 1, key: 'ball_per_sum', value: ps }, { store_id: 1, key: 'ball_points', value: pp },
      { store_id: 1, key: 'kassa_client', value: $('#ly-kc').checked }], 'store_id,key'); await syncDown(); toast('Saqlandi', 'ok'); load(); }
    catch (e) { toast(loyErr(e), 'bad'); }
  };
  const draw = () => {
    if (!$('#ly-list')) return;
    const list = rules.filter(r => tab === 'del' ? r.deleted_at : !r.deleted_at), today = todayTK();
    $('#ly-list').innerHTML = `<table class="t"><thead><tr><th>Nomi</th><th class="r">Minimal summa</th><th class="r">Maksimal summa</th><th>Sana</th><th class="r">Qoida</th><th>Holat</th><th></th></tr></thead><tbody>${list.map(r => {
      const live = r.active && !r.deleted_at && (!r.start_date || r.start_date <= today) && (!r.end_date || r.end_date >= today);
      return `<tr class="click" data-ly="${r.id}"><td><b>${esc(r.name)}</b></td><td class="r num">${fmt(r.min_sum)}</td><td class="r num">${r.max_sum == null ? '<span class="mut">cheklanmagan</span>' : fmt(r.max_sum)}</td>
        <td class="nw">${r.start_date || r.end_date ? (fmtDate(r.start_date) || '…') + ' — ' + (fmtDate(r.end_date) || '…') : '<span class="mut">doimiy</span>'}</td><td class="r num b nw">${+r.per_sum > 0 ? `har ${fmt(r.per_sum)} soʻmga ${fmtBall(r.points)} ball` : String(+r.percent).replace('.', ',') + '%'}</td>
        <td>${r.deleted_at ? '<span class="tag red">oʻchirilgan</span>' : live ? '<span class="tag ok">amalda</span>' : '<span class="tag">amalda emas</span>'}</td><td class="mut">›</td></tr>`;
    }).join('') || `<tr><td colspan="7" class="mut">${tab === 'del' ? 'Oʻchirilgan qoida yoʻq' : 'Qoʻshimcha qoida yoʻq — kerak boʻlsa «+ Qoʻshish» (masalan: 100 000 soʻmdan katta xaridga har 10 000 soʻmga 2 ball)'}</td></tr>`}</tbody></table>`;
    $$('[data-ly]').forEach(tr => tr.onclick = () => ruleForm(rules.find(r => r.id === tr.dataset.ly), load));
  };
  const drawCl = () => {
    if (!$('#ly-cl')) return;
    const t = norm($('#ly-q').value), d = t.replace(/\D/g, ''), srt = $('#ly-s').value, bvn = ballValue();
    const list = cls.filter(c => !t || norm(c.name).includes(t) || (d && String(c.phone || '').replace(/\D/g, '').includes(d)))
      .sort((a, b) => srt === 'name' ? a.name.localeCompare(b.name) : (+b[srt] - +a[srt]) || (+b.earned - +a.earned) || a.name.localeCompare(b.name));
    $('#ly-cl').innerHTML = `<table class="t"><thead><tr><th class="r">#</th><th>Mijoz</th><th>Telefon</th><th class="r">Ball</th><th class="r">Soʻmda</th><th class="r">Jami yigʻilgan</th><th class="r">Sarflangan</th><th class="r">Xaridlar</th><th>Oxirgi</th><th></th></tr></thead><tbody>${list.slice(0, 500).map((c, i) => `
      <tr><td class="r mut sm">${i + 1}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone || '')}</td><td class="r num b">${fmtBall(c.bonus)}</td><td class="r num">${fmt(+c.bonus * bvn)}</td>
        <td class="r num">${fmtBall(c.earned)}</td><td class="r num">${fmtBall(c.spent)}</td><td class="r num">${c.purchases ? c.purchases + ' · ' + fmt(c.total) : '<span class="mut">—</span>'}</td>
        <td class="nw mut sm">${c.last_at ? timeStr(c.last_at) : ''}</td><td class="r"><button class="btn" data-adj="${c.client_id}">Tuzatish</button></td></tr>`).join('')
      || '<tr><td colspan="10" class="mut">Mijoz yoʻq</td></tr>'}</tbody></table>${list.length > 500 ? `<div class="mut sm" style="padding:8px">… yana ${list.length - 500} ta — qidiruvdan foydalaning</div>` : ''}`;
    $$('[data-adj]').forEach(b => b.onclick = () => bonusAdjust(cls.find(c => c.client_id === b.dataset.adj), load));
  };
  const load = async () => {
    try { rules = await API.get('loyalty_rules?select=*&order=min_sum.asc'); } catch (e) { if ($('#ly-list')) $('#ly-list').innerHTML = `<div class="alert bad">${esc(loyErr(e))}</div>`; return; }
    draw();
    try { cls = await API.rpcAll('loyalty_clients'); } catch (e) { cls = []; }
    drawCl();
  };
  $$('[data-lt]').forEach(b => b.onclick = () => { tab = b.dataset.lt; $$('[data-lt]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#ly-q').oninput = drawCl; $('#ly-s').onchange = drawCl;
  $('#ly-new').onclick = () => ruleForm(null, load);
  load();
};

function ruleForm(r, after) {
  const isNew = !r; r = r || { name: '', min_sum: 0, max_sum: null, percent: null, per_sum: 10000, points: 1, start_date: null, end_date: null, active: true };
  let rt = +r.per_sum > 0 ? 'ball' : 'pct';
  const m = modal(`<h3>${isNew ? 'Yangi ball qoidasi' : esc(r.name)}</h3>
    <label>Nomi *</label><input id="lf-n" value="${esc(r.name)}" placeholder="Masalan: Doimiy mijoz" autofocus maxlength="60">
    <label>Qoida turi</label><div class="seg" id="lf-rt"><button data-rt="ball" class="${rt === 'ball' ? 'on' : ''}">Har N soʻmga M ball</button><button data-rt="pct" class="${rt === 'pct' ? 'on' : ''}">Foiz</button></div>
    <div class="row" id="lf-rb"><div class="grow"><label>Har necha soʻm savdoga</label><input id="lf-ps" class="num" inputmode="numeric" value="${+r.per_sum || ''}" placeholder="10 000"></div>
      <div class="grow"><label>Necha ball</label><input id="lf-pp" class="num" inputmode="decimal" value="${+r.points ? String(+r.points).replace('.', ',') : ''}" placeholder="1"></div></div>
    <div class="row hide" id="lf-rp"><div style="width:140px"><label>Foiz, %</label><input id="lf-p" class="num" inputmode="decimal" value="${r.percent != null ? String(+r.percent).replace('.', ',') : ''}"></div></div>
    <div class="row"><div class="grow"><label>Qoida amal qiladigan minimal xarid, soʻm</label><input id="lf-min" class="num" inputmode="numeric" value="${+r.min_sum || 0}"></div>
      <div class="grow"><label>Maksimal xarid (boʻsh — cheklanmagan)</label><input id="lf-max" class="num" inputmode="numeric" value="${r.max_sum == null ? '' : +r.max_sum}"></div></div>
    <div class="row"><div class="grow"><label>Boshlanish sanasi (ixtiyoriy)</label><input id="lf-s" type="date" value="${esc(r.start_date || '')}"></div>
      <div class="grow"><label>Tugash sanasi (ixtiyoriy)</label><input id="lf-e" type="date" value="${esc(r.end_date || '')}"></div></div>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="lf-a" style="width:auto" ${r.active ? 'checked' : ''}> Faol</label>
    <div class="mut sm" id="lf-ex"></div>
    <div id="lf-err" class="alert bad hide"></div>
    <div class="foot">${isNew ? '' : r.deleted_at ? '<button class="btn" data-x="rest" style="margin-right:auto">Qayta tiklash</button>' : '<button class="btn red" data-x="del" style="margin-right:auto">Oʻchirish</button>'}<button class="btn" data-x="no">Bekor</button><button class="btn gold" data-x="ok">Saqlash</button></div>`, { wide: true });
  const ex = () => {
    $('#lf-rb').classList.toggle('hide', rt !== 'ball'); $('#lf-rp').classList.toggle('hide', rt !== 'pct');
    const s = Math.max(num($('#lf-min').value) || 0, 100000), bv = ballValue();
    if (rt === 'ball') { const ps = num($('#lf-ps').value), pp = num($('#lf-pp').value); $('#lf-ex').textContent = ps > 0 && pp > 0 ? `Masalan: ${fmt(s)} soʻmlik xariddan ${fmtBall(Math.floor(s / ps) * pp)} ball yigʻiladi (1 ball = ${fmtBall(bv)} soʻm).` : ''; return; }
    const p = num($('#lf-p').value) || 0, som = Math.floor(s * p / 100);
    $('#lf-ex').textContent = p > 0 ? `Masalan: ${fmt(s)} soʻmlik xariddan ${fmt(som)} soʻm = ${fmtBall(Math.floor(som / bv))} ball yigʻiladi (1 ball = ${fmtBall(bv)} soʻm).` : '';
  };
  m.querySelectorAll('input').forEach(i => i.addEventListener('input', ex));
  m.querySelectorAll('#lf-rt [data-rt]').forEach(b => b.onclick = () => { rt = b.dataset.rt; m.querySelectorAll('#lf-rt [data-rt]').forEach(x => x.classList.toggle('on', x === b)); ex(); });
  ex();
  m.querySelector('[data-x=no]').onclick = () => closeModal();
  const upd = async (patch, msg) => { try { await API.update('loyalty_rules', 'id=eq.' + r.id, patch); closeModal(); toast(msg, 'ok'); await syncDown(); after && after(); } catch (e) { showErr('#lf-err', loyErr(e)); } };
  if (m.querySelector('[data-x=del]')) m.querySelector('[data-x=del]').onclick = async () => { if (await confirmBox('«' + r.name + '» qoidasi oʻchirilsinmi? Yigʻilgan ballar saqlanadi.', 'Oʻchirish')) upd({ deleted_at: new Date().toISOString(), active: false }, 'Oʻchirildi'); };
  if (m.querySelector('[data-x=rest]')) m.querySelector('[data-x=rest]').onclick = () => upd({ deleted_at: null, active: true }, 'Tiklandi');
  m.querySelector('[data-x=ok]').onclick = async () => {
    const v = { name: $('#lf-n').value.trim(), min_sum: num($('#lf-min').value) || 0, max_sum: $('#lf-max').value.trim() === '' ? null : num($('#lf-max').value),
      percent: rt === 'pct' ? num($('#lf-p').value) : null, per_sum: rt === 'ball' ? num($('#lf-ps').value) : null, points: rt === 'ball' ? num($('#lf-pp').value) : null,
      start_date: $('#lf-s').value || null, end_date: $('#lf-e').value || null, active: $('#lf-a').checked };
    if (v.name.length < 2) return showErr('#lf-err', 'Nomini yozing');
    if (rt === 'pct' && !(v.percent > 0 && v.percent <= 50)) return showErr('#lf-err', 'Foiz 0 dan katta va 50 dan oshmasin');
    if (rt === 'ball' && !(v.per_sum > 0 && v.points > 0)) return showErr('#lf-err', 'Har necha soʻmga necha ball — ikkalasini yozing');
    if (v.min_sum < 0 || (v.max_sum != null && !(v.max_sum >= v.min_sum))) return showErr('#lf-err', 'Maksimal summa minimaldan kichik boʻlmasin');
    if (v.start_date && v.end_date && v.end_date < v.start_date) return showErr('#lf-err', 'Tugash sanasi boshlanishidan oldin boʻlmasin');
    try { if (isNew) await API.insert('loyalty_rules', v); else await API.update('loyalty_rules', 'id=eq.' + r.id, v); closeModal(); toast('Saqlandi', 'ok'); await syncDown(); after && after(); }
    catch (e) { showErr('#lf-err', /per_sum|points|PGRST204|42703|kind_chk|not-null/.test(e.code + ' ' + e.message) ? 'Avval Supabase’da yangi 13-SQL faylni ishga tushiring' : loyErr(e)); }
  };
}

  };
}

      : `<div class="grow"><label>Taʼminotchi *</label><select id="of-s"><option value="">—</option>${D.suppliers.filter(x => x.active !== false).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>

      return `<tr><td>${esc(l.name)} <span class="mut sm">${esc(l.unit)}</span></td><td class="r num ${l.qty > st ? 'bad' : 'mut'}" data-label="Qoldiq">${fmtQ(st)}</td>
        <td class="r" data-label="Miqdor"><input class="num" inputmode="decimal" data-q="${i}" style="width:90px;text-align:right" value="${fmtQ(l.qty)}"></td>
        <td class="r num" data-label="Tannarx">${l.cost == null ? '…' : fmt(l.cost)}</td><td class="r num ls" data-label="Summa">${l.cost == null ? '' : fmt((l.qty || 0) * l.cost)}</td><td><button class="x btn" data-del="${i}">×</button></td></tr>`;
    }).join('') || '<tr><td colspan="6" class="mut">Tovar qoʻshing</td></tr>';
    $$('#of-lines [data-q]').forEach(inp => inp.oninput = () => {
      const l = lines[+inp.dataset.q], v = num(inp.value); l.qty = isNaN(v) ? 0 : round3(v);
      inp.closest('tr').querySelector('.ls').textContent = l.cost == null ? '' : fmt(l.qty * l.cost);
      inp.closest('tr').children[1].classList.toggle('bad', l.qty > (D.stock.get(l.product_id) || 0)); $('#of-sum').textContent = fmt(total());
    });
    $$('#of-lines [data-del]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.del, 1); draw(); });
    $('#of-sum').textContent = fmt(total());
  };
  const add = (p, qty = 1, focus = true) => {
    if (!p) return;
    let l = lines.find(x => x.product_id === p.id);
    if (l) l.qty = round3(l.qty + qty);
    else {
      l = { product_id: p.id, name: p.name, unit: p.unit, qty: round3(qty), cost: p.cost_price != null ? +p.cost_price || 0 : null }; lines.push(l);   // admin qurilmasida tannarx bor
      if (l.cost == null) API.get('products_admin?select=cost_price&id=eq.' + p.id).then(r => { l.cost = +(r[0] && r[0].cost_price) || 0; if ($('#of-lines')) draw(); }).catch(() => { l.cost = 0; });
    }
    if (!wo && !$('#of-s').value && p.supplier_id) $('#of-s').value = p.supplier_id;
    draw();
    if (focus && !camOpen()) { const qi = $(`#of-lines [data-q="${lines.indexOf(l)}"]`); if (qi) { qi.focus(); qi.select(); } }
  };
  const addExpired = () => { $('#of-r').value = 'expired'; for (const x of expiredNow()) { const p = D.products.get(x.product_id); if (p) add(p, +x.left_qty, false); } $('#of-q').focus(); };
  if ($('#of-exp')) $('#of-exp').onclick = addExpired;
  // Qidiruv: shtrix-kod, tarozi yorligʻi yoki nomi
  const q = $('#of-q'), dr = $('#of-drop'); let res = [];
  const reset = () => { q.value = ''; dr.classList.add('hide'); res = []; };
  q.oninput = () => {
    const t = q.value.trim(); res = t ? findProducts(t, 12) : [];
    dr.innerHTML = res.map((p, i) => `<div data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="mut sm">${esc(p.barcode || '')}</span></div>`).join('') || (t ? '<div class="mut">Topilmadi</div>' : '');
    dr.classList.toggle('hide', !t);
    dr.querySelectorAll('[data-i]').forEach(el => el.onmousedown = e => { e.preventDefault(); add(res[+el.dataset.i]); reset(); });
  };
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); const v = q.value.trim(); if (!v) return;
    const exact = D.byBarcode.get(v); if (exact) { add(exact); reset(); return; }
    const sc = typeof parseScale === 'function' ? parseScale(v) : null;
    if (sc && !sc.error) { add(sc.p, sc.qty); reset(); return; }
    if (res[0]) { add(res[0]); reset(); return; }
    toast('Topilmadi: ' + v, 'bad'); q.select();
  };
  camButton(q, { resume: true, title: 'Chiqim: skanerlash', hint: 'Har oʻqilgan tovar roʻyxatga qoʻshiladi (+1)',
    count: p => { const l = lines.find(x => x.product_id === p.id); return l ? fmtQ(l.qty) + ' ' + (p.unit || '') : ''; } });
  draw(); if (withExpired) addExpired(); else setTimeout(() => q.focus(), 50);
  m.querySelector('[data-x=no]').onclick = () => tryClose();
  m.querySelector('[data-x=ok]').onclick = async () => {
    if (!lines.length) return showErr('#of-err', 'Tovar qoʻshing');
    const bad = lines.find(l => !(l.qty > 0)); if (bad) return showErr('#of-err', '«' + bad.name + '»: miqdorni kiriting');
    if (!wo && !$('#of-s').value) return showErr('#of-err', 'Taʼminotchini tanlang');
    const over = lines.filter(l => l.qty > (D.stock.get(l.product_id) || 0));
    if (!(await confirmBox(`${wo ? 'Hisobdan chiqarilsinmi' : 'Taʼminotchiga qaytarish yozilsinmi'}? ${lines.length} ta tovar, ${fmt(total())} soʻm — qoldiq kamayadi.`
      + (over.length ? ` Diqqat: ${over.map(l => l.name).slice(0, 3).join(', ')} — qoldiqdan koʻp.` : ''), wo ? 'Hisobdan chiqarish' : 'Yozish'))) return;
    const p = { id: uuid(), kind, number: $('#of-n').value.trim() || null, note: $('#of-note').value.trim() || null,
      lines: lines.map(l => ({ product_id: l.product_id, qty: l.qty })) };
    if (wo) p.reason = $('#of-r').value; else { p.supplier_id = $('#of-s').value; p.payment_method = $('#of-pay').value; }
    const btn = m.querySelector('[data-x=ok]'); btn.disabled = true;
    try {
      await API.rpc('stock_out', { p, p_staff: S.staff?.id || S.adminStaffId || null });
      lines.length = 0; closeModal(); toast(wo ? 'Hisobdan chiqarildi' : 'Qaytarish yozildi', 'ok');
      await syncDown(); after && after();
    } catch (e) { btn.disabled = false; showErr('#of-err', outErr(e)); }
  };
}

const xpShift = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

      : st.month_done ? `<div class="alert ok">✓ Bu oy polkalar rasmga olingan${st.last_at ? ': ' + esc(timeStr(st.last_at)) : ''}. Xohlasangiz yana yuklashingiz mumkin.</div>` : '';

    $('#pk-ai').classList.toggle('hide', !st.key);
  };
  try {
    const [s1, sea] = await Promise.all([API.rpc('ai_status'), API.rpc('shelf_season')]);
    st = s1; D.shelf = Object.assign({}, D.shelf || {}, { due: st.due, month_done: st.month_done, last_at: st.last_at, remind: st.remind }); ls.set('shelf', D.shelf); menuMarks();
    drawStatus();
    if (sea && $('#pk-season')) $('#pk-season').innerHTML = `<b>Hozir: ${SEASON_UZ[sea.season] || ''}</b>${(sea.events || []).length
      ? ` · Yaqin bayram va mavsumlar: ${sea.events.map(e => `<span class="ev">${esc(e.t)} <span class="mut sm">(${ddmm(e.from)}–${ddmm(e.to)})</span></span>`).join(', ')}` : ''}
      <div class="mut sm">AI shularga va oxirgi 30 kunlik savdoga (eng koʻp sotilgan, foydali, yotib qolgan, muddati yaqin tovarlar) qarab tavsiya beradi.</div>`;
  } catch (e) {
    if ($('#pk-season')) $('#pk-season').innerHTML = `<div class="alert bad">${esc(e.code === 'NET' ? 'Internet yoʻq' : old15(e) ? 'Avval Supabase’da 15-SQL faylni ishga tushiring' : e.message)}</div>`;

    return { sid, list };
  };
  const run = async ai => {
    if (busy) return;

  };

// AI javobini kutish (har 3 soniyada; 4 daqiqagacha)
async function shelfWait(id) {
  const t0 = Date.now();
  for (; ;) {
    const el = $('#pk-res'); if (!el) return;
    const sec = Math.round((Date.now() - t0) / 1000);
    el.innerHTML = `<div class="card ai-wait"><span class="spin"></span> 🧠 AI rasmlarni koʻryapti… <b>${sec}</b> soniya <span class="mut sm">(odatda 30–60 soniya)</span></div>`;
    await new Promise(r => setTimeout(r, 3000));
    let r; try { r = await API.rpc('shelf_ai_poll', { p_id: id }); } catch (e) { if (e.code === 'NET') continue; throw e; }
    if (r.status === 'done') { if ($('#pk-res')) $('#pk-res').innerHTML = shelfResultHtml(r); return; }
    if (r.status === 'error') {
      if ($('#pk-res')) $('#pk-res').innerHTML = `<div class="alert bad">${esc(r.error || 'AI xatosi')}</div><button class="btn" id="pk-retry">Qayta urinish</button>`;
      if ($('#pk-retry')) $('#pk-retry').onclick = () => shelfRetry(id);
      return;
    }
    if (Date.now() - t0 > 250000) { if ($('#pk-res')) $('#pk-res').innerHTML = '<div class="alert bad">AI javob bermadi. Keyinroq «Oldingi oylar»dan qayta urinib koʻring.</div>'; return; }
  }
}
// Saqlangan rasmlarni ombordan olib, AI ga qayta yuborish
async function shelfRetry(id, review) {
  try {
    const r = review || (await API.rpc('shelf_list', { p_limit: 30 })).find(x => x.id === id); if (!r) return;
    if ($('#pk-res')) $('#pk-res').innerHTML = '<div class="card ai-wait"><span class="spin"></span> 🧠 Rasmlar tayyorlanmoqda…</div>';
    const images = [];
    for (const p of r.photos || []) { const b = await API.storageBlob('polka', p.path); images.push({ zone: p.zone, data: await blobB64(b.size > 260000 ? await imgResize(b, 1024, 0.7) : b) }); }
    await API.rpc('shelf_ai_start', { p_id: id, p_images: images, p_lang: I18N.lang });
    await shelfWait(id);
  } catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
}
// AI tavsiyasi (matn AI tilida — ilova oʻgirmaydi)

    ${x.summary ? `<div class="ai-sum">${esc(x.summary)}</div>` : ''}${x.season ? `<div class="mut sm" style="margin-top:4px">${esc(x.season)}</div>` : ''}
    ${arr(x.quick_wins).length ? `<div class="ai-quick"><b>⚡ Bugun qilish mumkin</b><ul>${arr(x.quick_wins).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
    <div class="ai-zones">${zones.map(z => `<div class="ai-zone"><div class="row"><b class="grow">${esc(z.zone || '')}</b>${+z.score ? `<span class="score ${sc(z.score)}">${Math.round(+z.score)}/10</span>` : ''}</div>

      ${arr(z.products).length ? `<div class="chips">${arr(z.products).map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>` : ''}

// Savdoni oshirish uchun AI tavsiya (analitika asosida, rasmsiz)
async function shelfAn(go) {
  const st = $('#pk-an-st'), res = $('#pk-an-res'), btn = $('#pk-an-go'); if (!st) return;
  const msg = e => esc(e.code === 'NET' ? 'Internet yoʻq' : /PGRST202|42883|shelf_tips|Could not find the function/i.test(e.code + ' ' + e.message) ? 'Avval Supabase’da 20-SQL faylni ishga tushiring' : e.message);
  btn.onclick = () => shelfAn(true);
  if (go) {
    btn.disabled = true;
    try { await API.rpc('shelf_tips_start', { p_lang: I18N.lang, p_staff: S.staff?.id || S.adminStaffId || null }); }
    catch (e) { btn.disabled = false; st.innerHTML = `<span class="bad">${msg(e)}</span>`; return; }
  }
  const t0 = Date.now();
  for (;;) {
    let r; try { r = await API.rpc('shelf_tips_last'); } catch (e) { if (!$('#pk-an-st')) return; st.innerHTML = `<span class="bad">${msg(e)}</span>`; btn.disabled = false; return; }
    if (!$('#pk-an-st')) return;
    const l = r.last, d = r.done;
    if (d && d.result) res.innerHTML = shelfResultHtml({ result: d.result, created_at: d.created_at, staff: d.staff });
    const busy = l && l.status === 'sent';
    btn.disabled = busy; btn.textContent = d ? '🔄 Yangi tavsiya' : '🧠 Tavsiya olish';
    st.innerHTML = busy ? `<span class="gold">⏳ AI tahlil qilyapti${l.tries > 1 ? ` (Google band — ${l.tries}-urinish)` : ''}… 30–60 soniya</span>`
      : l && l.status === 'error' ? `<span class="bad">${esc(l.error || 'Xato')}</span>`
      : !d ? '<span class="mut">Hali tavsiya soʻralmagan. «🧠 Tavsiya olish»ni bosing.</span>'
      : r.ext ? '<span class="mut">Savdo statistikasi: yangi tizim + iDokon’dan olingan maʼlumotlar</span>' : '';
    if (!busy || Date.now() - t0 > 6 * 60000) return;
    await new Promise(f => setTimeout(f, 4000));
  }
}

    $('#bg-at').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' holatiga';

    $$('#bg [data-act=noexp]').forEach(b => b.onclick = () => noexpDialog(load));
    $$('#bg [data-act=offers]').forEach(b => b.onclick = () => { S.spTab = 'offers'; go('taminotchilar'); });
  };
  $('#bg-r').onclick = load;
  await load();

function bugunHtml(d) {
  const pct = (a, b) => b > 0 ? Math.round((a - b) / b * 100) : null;
  const delta = (a, b, unit) => { const p = pct(+a, +b); return p === null ? `<span class="mut sm">oʻtgan hafta shu vaqtda: ${+b ? fmt(b) + unit : 'yoʻq'}</span>`
    : `<span class="sm ${p >= 0 ? 'ok' : 'bad'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span> <span class="mut sm">oʻtgan hafta shu vaqtga nisbatan (${fmt(b)}${unit})</span>`; };
  const tiles = [
    ['Savdo', `${fmt(d.sales)} <small>soʻm</small>`, delta(d.sales, d.sales_lw, ' soʻm')],
    ['Cheklar', fmt(d.cheques), delta(d.cheques, d.cheques_lw, '')],
    ['Oʻrtacha chek', d.avg ? `${fmt(d.avg)} <small>soʻm</small>` : '—', ''],
    ['Yalpi foyda', `${fmt(d.profit)} <small>soʻm</small>`, +d.returns ? `<span class="mut sm">Qaytarishlar: ${fmt(d.returns)} soʻm</span>` : '']];
  const exp = (D.expAlerts || []).length, shelf = d.shelf || {}, inv = d.inv || {};
  const alerts = [
    +d.orders_active ? { t: `🛍 Faol buyurtmalar: <b>${d.orders_active}</b>${+d.orders_new ? ` (yangi: <b>${d.orders_new}</b>)` : ''}`, go: 'buyurtmalar', hot: +d.orders_new > 0 } : null,
    shelf.due ? { t: '📸 Bu oy polkalar rasmga olinmagan', go: 'polka', hot: true } : null,
    inv.due && inv.remind !== false ? { t: '🧮 Haftalik inventarizatsiya muddati oʻtgan', go: 'inventar', hot: true } : null,
    +d.low ? { t: `📦 Kam qolgan tovarlar: <b>${d.low}</b>`, go: 'tovarlar', f: 'low' } : null,
    +d.neg ? { t: `⚠️ Minus qoldiq: <b>${d.neg}</b> ta tovar`, go: 'tovarlar', f: 'neg' } : null,
    exp ? { t: `⏳ Muddati yaqin yoki oʻtgan: <b>${exp}</b>`, go: 'tovarlar', f: 'exp' } : null,
    +d.noexp ? { t: `🗓 Srogi kiritilmagan: <b>${d.noexp}</b> ta tovar`, act: 'noexp', hot: true } : null,
    +d.offers ? { t: `💡 Taʼminotchilardan yangi tovar taklifi: <b>${d.offers}</b>`, act: 'offers', hot: true } : null,
    +d.debtors ? { t: `💳 Qarzdorlar: <b>${d.debtors}</b> ta, jami <b>${fmt(d.debt)}</b> soʻm` } : null,
    +d.clients_new ? { t: `🙋 Bugun yangi mijozlar: <b>${d.clients_new}</b>` } : null].filter(Boolean);
  return `<div class="bg-tiles">${tiles.map(([h, v, s]) => `<div class="card bg-tile"><div class="mut sm">${h}</div><div class="bg-v num">${v}</div><div>${s}</div></div>`).join('')}</div>
    <div class="row w" style="align-items:flex-start;margin-top:10px">
      <div class="card" style="flex:1;min-width:300px"><div class="h2">Eʼtibor bering</div>
        ${alerts.map(a => `<div class="bg-al ${a.hot ? 'hot' : ''} ${a.go || a.act ? 'click' : ''}" ${a.go ? `data-go="${a.go}"` : ''} ${a.act ? `data-act="${a.act}"` : ''} ${a.f ? `data-f="${a.f}"` : ''}><span class="grow">${a.t}</span>${a.go || a.act ? '<span class="mut">›</span>' : ''}</div>`).join('')
          || '<div class="ok">✓ Hammasi joyida</div>'}
        <div class="h2" style="margin-top:12px">Ochiq smenalar</div>
        ${(d.shifts || []).map(s => `<div class="sm">Kassa ${s.cashbox} — <b>${esc(s.staff || 'kassir')}</b> <span class="mut">(${esc(timeStr(s.at))} dan)</span></div>`).join('') || '<div class="mut sm">Hozir ochiq smena yoʻq</div>'}</div>
      <div class="card" style="flex:1;min-width:300px"><div class="h2">Soatlar boʻyicha savdo</div>${hoursChart(d.hours || [])}
        <div class="h2" style="margin-top:12px">Bugun eng koʻp sotilgan</div>
        ${(d.top || []).map((t, i) => `<div class="row sm"><span class="mut">${i + 1}.</span><span class="grow">${esc(t.name)}</span><span class="mut">${fmtQ(+t.qty)}</span><b class="num">${fmt(t.amount)}</b></div>`).join('') || '<div class="mut sm">Hali sotuv yoʻq</div>'}</div>
    </div>`;
}
// Soatlar: bugun (toʻq) va oʻtgan haftaning shu kuni (och) — bitta oʻq, ustiga olib borsangiz qiymat
function hoursChart(h) {
  const by = new Map(h.map(x => [+x.h, x])), hs = h.length ? [...by.keys()] : [];
  const from = Math.min(8, ...hs), to = Math.max(21, ...hs), mx = Math.max(1, ...h.map(x => Math.max(+x.td, +x.lw)));
  const cols = []; for (let i = from; i <= to; i++) cols.push(i);
  return `<div class="hchart" role="img" aria-label="Soatlar boʻyicha savdo"><div class="hc-legend sm"><span class="k td"></span>Bugun <span class="k lw"></span>Oʻtgan hafta</div>
    <div class="hc-bars">${cols.map(i => { const x = by.get(i) || { td: 0, lw: 0 };
      return `<div class="hc-col" title="${i}:00 — bugun ${fmt(x.td)} soʻm, oʻtgan hafta ${fmt(x.lw)} soʻm"><div class="hc-pair"><i class="lw" style="height:${Math.round(+x.lw / mx * 100)}%"></i><i class="td" style="height:${Math.round(+x.td / mx * 100)}%"></i></div><span>${i}</span></div>`; }).join('')}</div></div>`;
}

function helpList(who) {
  const staff = who !== 'client', adm = staff && (typeof adminUI === 'function' && adminUI() || (S.staff && S.staff.role === 'admin'));
  return HELP.filter(h => (!h.if || h.if()) && (who === 'client' ? h.who === 'client' : h.who === 'staff' || (h.who === 'admin' && adm)));
}
function helpOpen(who) {
  who = who || (S.mode === 'client' || document.querySelector('.shop-top') ? 'client' : 'staff');
  const all = helpList(who), cur = S.tab;
  const tabName = id => (MENU.find(m => m.id === id) || {}).t || '';
  const m = modal(`<h3>❓ Yordam — nimani qanday qilaman?</h3>
    <input id="hp-q" placeholder="Savolingizni yozing: masalan «qaytarish», «srok», «qarz»" autocomplete="off" style="width:100%">
    <div id="hp-l" style="max-height:62vh;overflow:auto;margin-top:8px"></div>
    <div class="mut sm" style="margin-top:8px">${who === 'client' ? 'Javob topilmasa — doʻkonga qoʻngʻiroq qiling' + (setting('receipt_phone', '') ? ': <b>' + esc(setting('receipt_phone', '')) + '</b>' : '') + ' yoki Telegram botga yozing.'
      : 'Javob topilmasa — adminga yozing. «👉 Koʻrsat» bosilsa, kerakli joy ochilib, tugma yonib-oʻchib koʻrsatiladi.'}</div>
    <div class="foot"><button class="btn" data-x="close">Yopish</button></div>`, { wide: true });
  m.querySelector('[data-x=close]').onclick = () => closeModal();
  const norm = s => String(s).toLowerCase().replace(/[ʻʼ'`‘’]/g, '');
  const item = h => `<div class="hp-it" data-h="${h.id}"><div class="hp-q click"><span class="grow">${esc(h.q)}</span>${h.tab && who !== 'client' ? `<span class="mut sm">${esc(tabName(h.tab))}</span>` : ''}<span class="mut">›</span></div>
    <div class="hp-a hide"><ol>${h.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${h.show || h.tab ? '<button class="btn gold" data-show>👉 Koʻrsat</button>' : ''}</div></div>`;
  const draw = () => {
    const q = norm(m.querySelector('#hp-q').value.trim());
    const words = q.split(/\s+/).filter(Boolean);
    const hit = h => !words.length || words.every(w => norm(h.q + ' ' + h.steps.join(' ')).includes(w));
    const list = all.filter(hit), here = list.filter(h => h.tab && h.tab === cur), rest = list.filter(h => !here.includes(h));
    m.querySelector('#hp-l').innerHTML = !list.length ? '<div class="mut">Topilmadi — boshqa soʻz bilan yozib koʻring</div>'
      : (here.length ? `<div class="h2">Shu boʻlim: ${esc(tabName(cur))}</div>${here.map(item).join('')}<div class="h2" style="margin-top:10px">Boshqa savollar</div>` : '') + rest.map(item).join('');
    m.querySelectorAll('.hp-it').forEach(el => {
      const h = HELP.find(x => x.id === el.dataset.h);
      el.querySelector('.hp-q').onclick = () => { const a = el.querySelector('.hp-a'), open = a.classList.contains('hide'); m.querySelectorAll('.hp-a').forEach(x => x.classList.add('hide')); a.classList.toggle('hide', !open); };
      const sb = el.querySelector('[data-show]'); if (sb) sb.onclick = () => helpShow(h);
    });
    if (list.length === 1 || (words.length && list.length)) { const f = m.querySelector('.hp-a'); if (f && list.length === 1) f.classList.remove('hide'); }
  };
  m.querySelector('#hp-q').oninput = draw;
  draw();
  setTimeout(() => { const i = m.querySelector('#hp-q'); if (i && !isPhoneUI()) i.focus(); }, 50);
}
// «Koʻrsat»: boʻlimni ochadi va tugmani yonib-oʻchib koʻrsatadi
function helpShow(h) {
  while (MODALS.length) closeModal();
  if (h.tab && h.tab !== S.tab && typeof go === 'function' && !document.querySelector('.shop-top')) go(h.tab);
  let n = 0;
  const t = setInterval(() => {
    const el = h.show && h.show.split(',').map(s => document.querySelector(s.trim())).find(e => e && e.offsetParent !== null);
    if (el || ++n > 25) {
      clearInterval(t);
      if (!el) { if (h.show) toast(h.steps[0]); return; }
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('hp-glow'); setTimeout(() => el.classList.remove('hp-glow'), 6000);
      toast('👉 ' + h.steps[Math.min(1, h.steps.length - 1)]);
    }
  }, 200);
}

'use strict';
/* ===================== AI marketing tavsiyalari (17-SQL) =====================
   Savdo maʼlumoti, fasl va bayramlar asosida Gemini beradi: rahbar uchun va kassir uchun.
   Bittadan koʻrsatiladi: «✅ Tushundim» bosilgandan keyin keyingisi. Tushunarsiz boʻlsa «❓ Savolim bor» — AI oddiy tilda tushuntiradi. */
const TIP = { data: null, at: 0, aud: 'cashier' };
const tipLang = () => ['ru', 'en'].includes(I18N.lang) ? I18N.lang : 'uz';
// AI matni: oʻzbekcha boʻlsa va ilova kirillda — kirillga oʻgiriladi (I18N lugʻatiga tegmaydi)
const tipTxt = (t, lang) => esc(I18N.lang === 'uzc' && (lang || 'uz') === 'uz' && I18N.cyr ? I18N.cyr(String(t || '')) : String(t || ''));
const fmtSavol = n => `${n} ta savol`;
const tipErr = e => e.code === 'NET' ? 'Internet yoʻq' : /ai_tip|Could not find/.test(e.message) ? 'Avval Supabase’da 17-SQL faylni ishga tushiring' : e.message;

async function tipLoad(aud = 'cashier') {
  try { TIP.data = await API.rpc('ai_tips_next', { p_staff: S.staff?.id || null, p_aud: aud }); TIP.aud = aud; TIP.at = Date.now(); }
  catch (e) { if (e.code !== 'NET') { TIP.data = null; TIP.at = Date.now(); } }
  return TIP.data;
}
// Kassa: tepada ingichka qator — bosilsa tavsiya ochiladi (savdoga xalaqit bermaydi)
function tipBar() {
  const el = $('#tip-bar'); if (!el) return;
  const d = TIP.data, t = d && d.tip;
  el.innerHTML = t ? `<div class="tipbar" id="tb-open" role="button" tabindex="0" title="AI tavsiyasi — oʻqing, tushunsangiz «Tushundim», tushunmasangiz savol bering">
      <span class="tb-i">💡</span><span class="tb-l">Tavsiya</span> <span class="tb-n">${(+d.done || 0) + 1}/${+d.total || 1}</span>
      <span class="grow tb-t" translate="no">${tipTxt(t.title, t.lang)}</span><span class="btn tb-b">Ochish</span></div>` : '';
  if (t) { const o = $('#tb-open'); o.onclick = () => tipOpen(); o.onkeydown = e => { if (e.key === 'Enter') tipOpen(); }; }
}
function tipMaybeLoad(aud = 'cashier') {
  if (Date.now() - TIP.at < 10 * 60e3 && TIP.aud === aud) { tipBar(); return; }
  tipLoad(aud).then(tipBar);
}
// Oyna (kassa): tavsiya, savol-javob, «Tushundim»
function tipOpen() {
  if (!TIP.data || !TIP.data.tip) return;
  const m = modal('<div id="tip-m"></div>', { wide: true, onClose: () => tipBar() });
  tipView(m.querySelector('#tip-m'), { aud: TIP.aud, modal: true });
}
// Tavsiya koʻrinishi (oynada yoki «Analitika»da): bitta tavsiya + savol-javob + tugmalar
function tipView(box, opts = {}) {
  const aud = opts.aud || 'cashier';
  let asking = false, timer = null;
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const poll = (n = 0) => {
    stop();
    if (!box.isConnected || n > 70) return;
    timer = setTimeout(async () => {
      if (!box.isConnected) return;
      await tipLoad(aud);
      const pend = (TIP.data?.qa || []).some(x => x.status === 'sent');
      draw();
      if (pend) poll(n + 1);
    }, 3000);
  };
  const draw = () => {
    if (!box.isConnected) return;
    const d = TIP.data, t = d && d.tip;
    if (!t) {
      box.innerHTML = `<div class="tip-done"><div style="font-size:40px">👏</div><h3>Barcha tavsiyalarni tushundingiz</h3>
        <div class="mut">Rahmat! Yangi tavsiyalar har dushanba keladi.</div></div>
        ${opts.modal ? '<div class="foot"><button class="btn gold" data-x="close">Yopish</button></div>' : ''}`;
      if (opts.modal) box.querySelector('[data-x=close]').onclick = () => closeModal();
      opts.onChange && opts.onChange();
      return;
    }
    const qa = d.qa || [], wait = qa.some(x => x.status === 'sent');
    box.innerHTML = `<div class="tip-h"><span class="tag ${t.audience === 'cashier' ? 'ok' : 'gold'}">${t.audience === 'cashier' ? 'Kassir uchun' : 'Rahbar uchun'}</span>
        <span class="mut sm">${(+d.done || 0) + 1} / ${+d.total || 1}</span></div>
      <h3 class="tip-t" translate="no">💡 ${tipTxt(t.title, t.lang)}</h3>
      <div class="tip-b" translate="no">${tipTxt(t.body, t.lang)}</div>
      ${(t.steps || []).length ? `<div class="tip-sh">Qanday qilinadi</div><ol class="tip-s" translate="no">${t.steps.map(x => `<li>${tipTxt(x, t.lang)}</li>`).join('')}</ol>` : ''}
      ${t.example ? `<div class="tip-say"><div class="sm">🗣 Mijozga shunday deng:</div><div class="tip-q" translate="no">«${tipTxt(t.example, t.lang)}»</div></div>` : ''}
      ${t.why ? `<div class="tip-why"><b>Nega ishlaydi:</b> <span translate="no">${tipTxt(t.why, t.lang)}</span></div>` : ''}
      ${t.metric ? `<div class="tip-why mut"><b>Natija qanday koʻrinadi:</b> <span translate="no">${tipTxt(t.metric, t.lang)}</span></div>` : ''}
      ${qa.length ? `<div class="tip-qa">${qa.map(x => `<div class="tq">❓ <span translate="no">${esc(x.q)}</span></div>${x.status === 'done'
          ? `<div class="ta">🤖 <span translate="no">${tipTxt(x.a, tipLang())}</span></div>`
          : x.status === 'error' ? `<div class="ta bad">${esc(x.error || 'AI javob bermadi')}</div>` : '<div class="ta mut">🤖 AI javob yozmoqda… (odatda 10–30 soniya)</div>'}`).join('')}</div>` : ''}
      <div id="tip-ask" class="${asking ? '' : 'hide'}"><label>Nimasi tushunarsiz? Savolingizni yozing</label>
        <textarea id="tip-qi" rows="2" maxlength="400" placeholder="Masalan: mijoz rozi boʻlmasa nima deyman?"></textarea>
        <div class="row w" style="margin-top:6px"><button class="btn gold" id="tip-send" type="button">Yuborish</button><button class="btn" id="tip-cancel" type="button">Bekor</button></div></div>
      <div id="tip-err" class="alert bad hide"></div>
      <div class="foot tip-foot">${opts.modal ? '<button class="btn" data-x="later" type="button">Keyinroq</button>' : ''}
        <button class="btn" id="tip-askb" type="button" ${wait || asking ? 'disabled' : ''}>❓ ${qa.length ? 'Yana savolim bor' : 'Savolim bor'}</button>
        <button class="btn gold big" id="tip-ok" type="button" ${wait ? 'disabled' : ''}>✅ ${qa.length ? 'Endi tushundim' : 'Tushundim'}</button></div>`;
    const err = s => { const e = box.querySelector('#tip-err'); e.textContent = s; e.classList.remove('hide'); };
    if (opts.modal) box.querySelector('[data-x=later]').onclick = () => { stop(); closeModal(); };
    box.querySelector('#tip-askb').onclick = () => { asking = true; draw(); const q = box.querySelector('#tip-qi'); if (q) q.focus(); };
    if (box.querySelector('#tip-cancel')) box.querySelector('#tip-cancel').onclick = () => { asking = false; draw(); };
    box.querySelector('#tip-send').onclick = async () => {
      const q = box.querySelector('#tip-qi').value.trim();
      if (q.length < 2) return err('Savolingizni yozing');
      const b = box.querySelector('#tip-send'); b.disabled = true;
      try {
        TIP.data = await API.rpc('ai_tip_ask', { p_tip: t.id, p_q: q, p_staff: S.staff?.id || null, p_lang: tipLang(), p_aud: aud });
        asking = false; draw(); poll();
      } catch (e) { b.disabled = false; err(tipErr(e)); }
    };
    box.querySelector('#tip-ok').onclick = async () => {
      const b = box.querySelector('#tip-ok'); b.disabled = true;
      try {
        TIP.data = await API.rpc('ai_tip_ack', { p_tip: t.id, p_staff: S.staff?.id || null, p_aud: aud });
        asking = false; toast(TIP.data && TIP.data.tip ? 'Rahmat! Mana keyingi tavsiya' : 'Rahmat! Hammasini tushundingiz', 'ok');
        draw(); tipBar(); opts.onChange && opts.onChange();
        box.scrollIntoView && box.closest('.modal') && box.closest('.modal').scrollTo(0, 0);
      } catch (e) { b.disabled = false; err(tipErr(e)); }
    };
    if (wait && !timer) poll();
  };
  draw();
  return { draw, stop };
}
