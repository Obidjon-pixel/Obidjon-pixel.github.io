    const err = s => { const e = $('#pay-err'); e.textContent = s; e.classList.remove('hide'); };
    const T = due();
    if (mode === 'cash') { recv = num($('#p-recv').value); if (isNaN(recv) || recv < T) return err('Berilgan summa yetarli emas'); cash = T; }
    else if (mode === 'card') card = T;
    else if (mode === 'qr') qr = T;
    else if (mode === 'mixed') { cash = num($('#p-cash').value) || 0; if (cash < 0 || cash > T) return err('Naqd qismi notoʻgʻri'); if (rest === 'qr') qr = T - cash; else card = T - cash; }
    else {
      if (!c.client) return err('Qarzga sotish uchun mijozni tanlang');
      cash = num($('#p-cash').value) || 0; card = num($('#p-card2').value) || 0; qr = num($('#p-qr2').value) || 0; debt = T - cash - card - qr;
      if (debt <= 0 || cash < 0 || card < 0 || qr < 0) return err('Summalar notoʻgʻri');
      const lim = D.clients.find(x => x.id === c.client)?.debt_limit;
      if (lim && (D.balances.get(c.client) || 0) + debt > +lim && !(await needAdminPin('Mijoz qarz limitidan oshmoqda'))) return;
    }
    if (bonus > 0) {   // ball serverda tekshiriladi: boshqa kassada sarflangan boʻlishi mumkin
      if (!S.online) return err('Ball bilan toʻlash uchun internet kerak');
      try { const live = await API.rpc('client_bonus_live', { p_client: c.client }); if (+live + 0.004 < pts) { D.bonus.set(c.client, +live); return err('Ball yetarli emas: hozir ' + fmtBall(live) + ' ball'); } }
      catch (e) { return err(e.code === 'NET' ? 'Ball bilan toʻlash uchun internet kerak' : e.message); }
    }
    if (qr > 0) ls.set('qrProv', prov);
    m.querySelector('[data-x=ok]').disabled = true;
    await finishSale({ cash, card, qr, prov: qr > 0 ? prov : null, debt, recv, bonus, points: bonus > 0 ? pts : 0 });
    closeModal();
  };
  m.querySelector('[data-x=ok]').onclick = ok;
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.target.matches('button') && e.target.id !== 'p-lc') { e.preventDefault(); ok(); } });
  body();
}
async function nextNo() { const n = (await IDB.meta('local_no')) || 0; await IDB.meta('local_no', n + 1); return n + 1; }
async function finishSale({ cash, card, qr = 0, prov = null, debt, recv, bonus = 0, points = 0 }) {
  const c = cart(), t = totals(c);
  const sale = {
    id: uuid(), kind: 'sale', cashbox_id: cashboxId(), shift_id: S.shift.id, staff_id: S.staff?.id || null, client_id: c.client || null,
    local_no: await nextNo(), created_at: new Date().toISOString(), subtotal: t.sub, discount: t.disc, total: t.total,
    paid_cash: cash, paid_card: card, paid_qr: qr, qr_provider: prov, paid_debt: debt, note: null,
    lines: c.lines.map(l => Object.assign({ product_id: l.pid, name: l.name, qty: l.qty, price: l.price, discount: 0, amount: lineAmount(l), unit: l.unit },
      l.gift || l.promoId ? { promotion_id: l.gift || l.promoId } : {}))
  };
  if (bonus > 0) { sale.paid_bonus = bonus; sale.paid_points = points; }
  // Ball (taxminiy — aniq hisob serverda): sarflangani ayiriladi, yangisi qoʻshiladi; qarzga yozilgan va balldan toʻlangan qismiga ball yoʻq
  const earn = c.client ? bonusEarn(t.total - bonus, Math.max(0, t.total - bonus - (debt || 0))) : 0;
  if (c.client && (points > 0 || earn > 0)) { D.bonus.set(c.client, clientBonus(c.client) - points + earn); ls.set('bonus', [...D.bonus]); }
  await IDB.put('sales', Object.assign({}, sale, { recv, staff_name: S.staff?.full_name, bonus_est: earn }));
  applyLocalStock(sale);
  if (debt > 0) D.balances.set(c.client, (D.balances.get(c.client) || 0) + debt);
  await enqueue('sale', stripLocal(sale));
  if (c.order_id) await enqueue('order_done', { id: c.order_id, sale_id: sale.id });
  if (S.carts.length > 1) { S.carts.splice(S.cart, 1); if (S.cart >= S.carts.length) S.cart = S.carts.length - 1; } else S.carts[S.cart] = newCart(cart().no);
  saveCarts(); renderKassa();
  const tg = tgReceipt(sale.client_id);
  toast('Sotildi: ' + fmt(t.total) + ' soʻm' + (recv > t.total - bonus ? ' · qaytim ' + fmt(recv - (t.total - bonus)) : '') + (tg ? ' · chek Telegramga yuboriladi' : ''), 'ok');
  if (S.device.autoPrint && !S.device.printerProblem && !tg) printReceipt(Object.assign({}, sale, { recv, staff_name: S.staff?.full_name, bonus_est: earn }));
}
// Mijoz botga ulangan boʻlsa chek Telegramga boradi — qogʻoz chek shart emas (qurilma sozlamasi)
function tgReceipt(clientId) {
  if (!clientId || S.device.tgNoPrint === false || setting('tg_receipts', true) === false) return false;
  return !!D.clients.find(x => x.id === clientId)?.telegram_chat_id;
}
function stripLocal(s) { const o = Object.assign({}, s); o.lines = s.lines.map(({ unit, ...l }) => l); delete o.recv; delete o.staff_name; delete o.bonus_est; return o; }
function logAudit(action, details) { enqueue('audit', { staff_id: S.staff?.id || null, cashbox_id: cashboxId(), action, details: details ?? null }); }

function printReceipt(s, title) {
  let f = $('#pf'); if (f) f.remove();
  f = document.createElement('iframe'); f.id = 'pf'; f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(receiptHtml(s, title)); f.contentDocument.close();
  I18N.trDoc(f.contentDocument);   // chek ham tanlangan tilda
  const go = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { console.warn(e); } setTimeout(refocus, 300); };
  const img = f.contentDocument.querySelector('img');
  if (img && !img.complete) { img.onload = go; img.onerror = go; } else setTimeout(go, 50);
}

  const m = modal(`<h3>Qaytarish — chek ${s.cashbox_id}-${String(s.local_no).padStart(5, '0')}</h3>
    <table class="t"><thead><tr><th>Tovar</th><th class="r">Sotilgan</th><th class="r">Qaytgan</th><th class="r">Narx</th><th class="r">Qaytariladi</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td>${esc(r.name)}</td><td class="r num">${fmtQ(r.sold)}</td><td class="r num">${fmtQ(r.returned)}</td><td class="r num">${fmt(r.net_price)}</td>
      <td class="r"><input class="num" data-rq="${i}" style="width:90px;text-align:right" value="0" ${r.left <= 0 ? 'disabled' : ''}> <button class="btn" data-all="${i}" ${r.left <= 0 ? 'disabled' : ''}>hammasi</button></td></tr>`).join('')}</tbody></table>
    <label>Pul qanday qaytariladi</label><select id="r-m"><option value="cash">Naqd</option><option value="card">Kartaga</option><option value="qr" ${s.paid_qr > 0 ? 'selected' : ''}>QR orqali${s.qr_provider ? ' (' + esc(s.qr_provider) + ')' : ''}</option>${s.paid_debt > 0 && s.client_id ? '<option value="debt" selected>Mijoz qarzidan ayiriladi</option>' : ''}</select>
    <div class="mut sm hide" id="r-dinfo"></div>
    <label>Sabab</label><input id="r-note" placeholder="Masalan: muddati oʻtgan, xato urilgan">
    <div class="lg" style="margin-top:10px">Qaytariladi: <b id="r-sum" class="num">0</b> soʻm</div>
    ${+s.paid_bonus > 0 ? `<div class="mut sm" id="r-bon">Chekning ${fmt(s.paid_bonus)} soʻmi ball bilan toʻlangan — qaytarishda ball qismi pulga aylanmaydi.</div>` : ''}
    <div class="foot"><button class="btn" data-x="no">Bekor</button><button class="btn red big" data-x="ok">Qaytarishni bajarish</button></div>`, { wide: true });
  // Bonus bilan toʻlangan chek: shu qismga toʻgʻri keladigan summa qaytarilmaydi (sarflangan bonus qaytmaydi)
  const bShare = sum => +s.paid_bonus > 0 && +s.total > 0 ? Math.min(Math.round(sum * s.paid_bonus / s.total), +s.paid_bonus) : 0;
  const split = money => { const d = $('#r-m').value === 'debt' ? Math.min(money, debtLeft) : 0; return { debt: d, rest: money - d }; };
  const calc = () => {
    let sum = 0; $$('[data-rq]').forEach(inp => { const r = rows[+inp.dataset.rq]; let v = num(inp.value) || 0; if (v > r.left) { v = r.left; inp.value = fmtQ(v); } sum += roundSum(v * r.net_price); });
    const money = sum - bShare(sum), sp = split(money); $('#r-sum').textContent = fmt(money);
    const di = $('#r-dinfo'); if (di) { di.classList.toggle('hide', $('#r-m').value !== 'debt' || !money); di.textContent = `Qarzdan ayriladi: ${fmt(sp.debt)} soʻm` + (sp.rest > 0 ? ` · naqd qaytariladi: ${fmt(sp.rest)} soʻm (bu chekdagi qarz ${fmt(debtLeft)} soʻm edi)` : ''); }
    return sum;
  };
  $$('[data-rq]').forEach(inp => inp.oninput = calc); $('#r-m').onchange = calc;
  $$('[data-all]').forEach(b => b.onclick = () => { const i = +b.dataset.all; $(`[data-rq="${i}"]`).value = fmtQ(rows[i].left); calc(); });
  m.querySelector('[data-x=no]').onclick = () => closeModal();
  m.querySelector('[data-x=ok]').onclick = async () => {
    const lines = []; $$('[data-rq]').forEach(inp => { const r = rows[+inp.dataset.rq]; const v = num(inp.value) || 0; if (v > 0) lines.push({ product_id: r.product_id, name: r.name, qty: round3(v), price: r.net_price, discount: 0, amount: roundSum(v * r.net_price), unit: r.unit }); });
    if (!lines.length) { toast('Qaytariladigan miqdorni kiriting'); return; }
    const total = lines.reduce((a, l) => a + l.amount, 0), method = $('#r-m').value, share = bShare(total), money = total - share;
    if (!(await confirmBox(`${fmt(money)} soʻm qaytarilsinmi?` + (share ? ` (ball qismi ${fmt(share)} soʻm qaytmaydi)` : ''), 'Qaytarish'))) return;
    const ret = { id: uuid(), kind: 'return', original_sale_id: s.id, cashbox_id: cashboxId(), shift_id: S.shift?.id || null, staff_id: S.staff?.id || null, client_id: s.client_id || null,
      local_no: await nextNo(), created_at: new Date().toISOString(), subtotal: total, discount: 0, total,
      paid_cash: method === 'cash' ? money : method === 'debt' ? split(money).rest : 0, paid_card: method === 'card' ? money : 0, paid_qr: method === 'qr' ? money : 0, qr_provider: method === 'qr' ? (s.qr_provider || qrProviders()[0]) : null,
      paid_debt: method === 'debt' ? split(money).debt : 0, note: $('#r-note').value.trim() || null, lines };
    if (share) ret.paid_bonus = share;
    try { await API.rpc('submit_sale', { p: stripLocal(ret) }); }
    catch (e) { toast(e.code === 'NET' ? 'Internet uzildi, qaytarish bajarilmadi' : e.message, 'bad'); return; }
    await IDB.put('sales', Object.assign({}, ret, { staff_name: S.staff?.full_name })); applyLocalStock(ret);
    if (ret.paid_debt > 0) D.balances.set(s.client_id, (D.balances.get(s.client_id) || 0) - ret.paid_debt);
    closeModal(); toast('Qaytarildi: ' + fmt(money) + ' soʻm', 'ok');
    if (S.device.autoPrint && !S.device.printerProblem && !tgReceipt(ret.client_id)) printReceipt(Object.assign({}, ret, { staff_name: S.staff?.full_name }), 'QAYTARISH');
    if ($('#r-list')) recentReturns();
  };
}

async function recentReturns() {
  const local = (await IDB.all('sales')).filter(s => s.kind === 'return');
  let server = [];
  if (S.online) { try { server = await API.get('sales?select=id,kind,cashbox_id,local_no,created_at,total,paid_cash,paid_card,paid_qr,paid_debt,client_id,staff_id,original_sale_id&kind=eq.return&order=created_at.desc&limit=100'); } catch (e) { } }
  const map = new Map(); for (const s of [...server, ...local]) map.set(s.id, Object.assign(map.get(s.id) || {}, s));
  const all = [...map.values()].sort((a, b) => b.created_at.localeCompare(a.created_at));
  const origNo = id => { const o = id && (map.get(id) || null); return o ? o.cashbox_id + '-' + String(o.local_no || '').padStart(5, '0') : ''; };

      const cl = s.client_id ? D.clients.find(c => c.id === s.client_id) : null;
      const pay = [['naqd', s.paid_cash], ['karta', s.paid_card], ['QR', s.paid_qr], ['qarzdan', s.paid_debt]].filter(x => +x[1] > 0).map(x => x[0]).join(', ');

/* ---------- Mijoz qarzi tarixi: qachon qarzga olgan, qachon toʻlagan ---------- */
async function debtHistory(clientId) {
  const c = D.clients.find(x => x.id === clientId) || { name: '' };
  const m = modal(`<h3>Qarz tarixi — <span translate="no">${esc(c.name)}</span></h3><div id="dh-b" class="mut">Yuklanmoqda…</div><div class="foot"><button class="btn" data-x="close">Yopish</button></div>`, { wide: true });
  m.querySelector('[data-x=close]').onclick = () => closeModal();
  let rows;
  try { rows = await API.get('debt_moves?select=id,amount,method,note,created_at,sale_id&client_id=eq.' + clientId + '&order=created_at.asc,id.asc&limit=2000'); }
  catch (e) { const b = m.querySelector('#dh-b'); if (b) b.innerHTML = `<div class="alert bad">${esc(e.code === 'NET' ? 'Internet yoʻq' : e.message)}</div>`; return; }
  let bal = 0;
  const list = rows.map(r => { bal += +r.amount; return Object.assign({}, r, { bal }); }).reverse();
  const adj = r => /tenglashtir|oʻtkazilgan qarz/i.test(r.note || '');
  const kind = r => {
    if (adj(r)) return ['Tenglashtirish', ''];
    if (/Возврат|qaytar/i.test(r.note || '')) return ['Qaytarish', 'ok'];
    if (+r.amount > 0) return [r.sale_id ? 'Qarzga xarid' : 'Qarz qoʻshildi', 'red'];
    return ['Toʻlov' + (r.method === 'cash' ? ' (naqd)' : r.method === 'card' ? ' (karta)' : r.method === 'qr' ? ' (QR)' : ''), 'ok'];
  };
  const took = rows.filter(r => +r.amount > 0 && !adj(r)).reduce((a, r) => a + +r.amount, 0);
  const paid = rows.filter(r => +r.amount < 0 && !adj(r)).reduce((a, r) => a - r.amount, 0);
  const b = m.querySelector('#dh-b'); if (!b) return;
  b.classList.remove('mut');
  b.innerHTML = rows.length ? `<div class="row w" style="gap:16px;margin-bottom:8px">
      <div>Qarzga olgan: <b class="num">${fmt(took)}</b></div><div>Toʻlagan: <b class="num">${fmt(paid)}</b></div><div>Hozirgi qarz: <b class="num ${bal > 0 ? 'bad' : ''}">${fmt(bal)}</b></div></div>
    <div style="max-height:60vh;overflow:auto"><table class="t"><thead><tr><th>Sana</th><th>Nima</th><th class="r">Summa</th><th class="r">Qarz qoldigʻi</th><th></th></tr></thead><tbody>
    ${list.map(r => { const [t, cls] = kind(r); return `<tr${r.sale_id ? ` class="click" data-sale="${r.sale_id}"` : ''}><td class="nw">${esc(timeStr(r.created_at))}</td>
      <td><span class="tag ${cls}">${t}</span>${/iDokon/.test(r.note || '') ? ' <span class="mut sm">iDokon</span>' : ''}</td>
      <td class="r num ${+r.amount > 0 ? 'bad' : 'ok'}">${+r.amount > 0 ? '+' : ''}${fmt(r.amount)}</td><td class="r num">${fmt(r.bal)}</td>
      <td>${r.sale_id ? '<span class="mut sm">chek ›</span>' : ''}</td></tr>`; }).join('')}</tbody></table></div>`
    : '<div class="mut">Bu mijozda qarz harakati yoʻq</div>';
  b.querySelectorAll('[data-sale]').forEach(tr => tr.onclick = async () => {
    try {
      const [s] = await getSales('sales?select=id,kind,cashbox_id,local_no,created_at,total,paid_cash,paid_card,paid_qr,qr_provider,paid_debt%B,client_id,staff_id,original_sale_id,note&id=eq.' + tr.dataset.sale);
      if (!s) return;
      const full = await fullSale(s.id, new Map([[s.id, s]]));
      if (full) showSale(full);
    } catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
  });
}

SCREENS.tovarlar = main => {
  main.style.padding = '14px';
  main.innerHTML = `<div class="row w"><div class="h1 grow">Tovarlar</div>
    <input id="pr-q" placeholder="Nomi yoki shtrix-kod" style="max-width:260px">
    <select id="pr-f" style="max-width:220px"><option value="">Hammasi</option><option value="low">Kam qolgan</option><option value="neg">Minus qoldiq</option><option value="warn">Narxida xato bor</option><option value="exp">Muddati yaqin / oʻtgan</option><option value="quick">Tezkor tanlov</option><option value="noimg">Rasmsiz</option><option value="off">Nofaol</option><option value="del">Oʻchirilganlar</option></select>
    <select id="pr-s" style="max-width:170px"><option value="name">Nomi (A–Z)</option><option value="rank">Eng foydali</option><option value="stock">Qoldigʻi kam</option></select>
    <label class="row sm" style="margin:0;width:auto"><input type="checkbox" id="pr-ws" style="width:auto" ${showWholesale('tovarlar') ? 'checked' : ''}> Ulgurji narx</label>
    <button class="btn" id="pr-xls" title="Roʻyxatni Excel faylga yuklab olish">Excel</button><button class="btn gold" id="pr-new">+ Yangi tovar</button></div>
    <div class="card" style="padding:0" id="pr-list"></div><div class="mut sm" id="pr-cnt" style="margin-top:6px"></div>`;
  const draw = () => {
    const t = $('#pr-q').value.trim(), f = $('#pr-f').value, nt = norm(t);
    let list = [...D.products.values()].filter(p => f === 'del' ? !!p.deleted_at : f === 'off' ? !p.active && !p.deleted_at : p.active);
    if (t) list = list.filter(p => (p.barcode && String(p.barcode).includes(t)) || p._n.includes(nt));
    if (f === 'low') list = list.filter(p => p.min_stock > 0 && (D.stock.get(p.id) || 0) <= p.min_stock);
    if (f === 'neg') list = list.filter(p => (D.stock.get(p.id) || 0) < 0);
    if (f === 'warn') list = list.filter(p => priceWarnings(p).length);
    if (f === 'quick') list = list.filter(p => p.quick_pick);
    if (f === 'noimg') list = list.filter(p => !p.image_url);
    if (f === 'exp') { const ids = new Set((D.expAlerts || []).map(x => x.product_id)); list = list.filter(p => ids.has(p.id)); }
    const srt = $('#pr-s').value, rk = p => D.rank.get(p.id)?.rnk ?? 1e9;
    list.sort(srt === 'rank' ? (a, b) => rk(a) - rk(b) || a.name.localeCompare(b.name) : srt === 'stock' ? (a, b) => (D.stock.get(a.id) || 0) - (D.stock.get(b.id) || 0) || a.name.localeCompare(b.name) : (a, b) => a.name.localeCompare(b.name));
    S.prList = list;
    $('#pr-cnt').textContent = list.length + ' ta tovar';
    const ws = showWholesale('tovarlar');
    const im = imgOn();
    $('#pr-list').innerHTML = `<table class="t"><thead><tr>${im ? '<th style="width:52px"></th>' : ''}<th>Nomi</th><th>Shtrix-kod</th><th>Taʼminotchi</th><th class="r">Qoldiq</th><th class="r">Kirim</th>${ws ? '<th class="r">Ulgurji</th>' : ''}<th class="r">Sotish</th><th class="r">Ustama</th><th></th></tr></thead><tbody>${list.slice(0, 400).map(p => {
      const st = D.stock.get(p.id) || 0, w = priceWarnings(p), mk = p.cost_price > 0 ? Math.round((p.sale_price - p.cost_price) / p.cost_price * 100) : null;
      return `<tr class="click" data-id="${p.id}">${im ? `<td class="pimg"><button type="button" class="img-mini" data-img="${p.id}" title="${p.image_url ? 'Rasmni almashtirish' : 'Rasm qoʻyish'}">${p.image_url ? thumb(p) : '<span class="thumb add">📷</span>'}</button></td>` : ''}<td><b>${esc(p.name)}</b>${p.deleted_at ? ` <span class="tag red" title="${esc(p.deleted_reason || '')}">oʻchirilgan ${timeStr(p.deleted_at)}</span>` : ''}${p.quick_pick ? ' <span class="tag gold">tezkor</span>' : ''}${w.length ? ` <span class="tag red" title="${esc(w.join('; '))}">!</span>` : ''}</td>
        <td class="mut">${esc(p.barcode || '')}</td><td class="mut sm">${esc(supName(p.supplier_id))}</td>
        <td class="r num ${st < 0 ? 'bad' : p.min_stock > 0 && st <= p.min_stock ? 'warn' : ''}">${fmtQ(st)} ${p.unit}</td>
        <td class="r num">${fmt(p.cost_price)}</td>${ws ? `<td class="r num">${+p.wholesale_price > 0 ? fmt(p.wholesale_price) : '—'}</td>` : ''}<td class="r num b">${fmt(p.sale_price)}</td><td class="r num ${mk !== null && mk <= 0 ? 'bad' : ''}">${mk === null ? '—' : mk + '%'}</td><td class="mut">›</td></tr>`;
    }).join('') || `<tr><td colspan="${(ws ? 9 : 8) + (im ? 1 : 0)}" class="mut">Topilmadi</td></tr>`}</tbody></table>${list.length > 400 ? '<div class="mut sm" style="padding:8px">Birinchi 400 tasi koʻrsatildi — qidiruvdan foydalaning</div>' : ''}`;
    $$('#pr-list [data-id]').forEach(tr => tr.onclick = () => { const p = D.products.get(tr.dataset.id); if (p.deleted_at) restoreDialog(p, draw); else productForm(p, draw); });
    $$('#pr-list [data-img]').forEach(b => b.onclick = e => { e.stopPropagation(); quickImage(D.products.get(b.dataset.img), draw); });
  };
  $('#pr-q').oninput = draw; $('#pr-f').onchange = draw; $('#pr-new').onclick = () => productForm(null, draw);
  camButton($('#pr-q'), { title: 'Tovarni skanerlang', hint: 'Bor tovar — kartasi ochiladi; yangi boʻlsa — shu shtrix-kod bilan yangi tovar', onCode: (code, api) => {
    const p = D.byBarcode.get(code); setTimeout(api.close, 0);
    if (p) { $('#pr-q').value = code; draw(); setTimeout(() => productForm(p, draw), 50); return { ok: true, text: '✓ ' + p.name }; }
    setTimeout(() => productForm(null, draw, { barcode: code }), 50); return { ok: true, text: 'Yangi tovar: ' + code };
  } });
  $('#pr-s').onchange = async () => { if ($('#pr-s').value === 'rank') await loadRank(); draw(); };
  $('#pr-xls').onclick = async () => { await loadRank(true); productsXlsx(S.prList || [], 'Tovarlar'); };
  if (S.prFilter) { $('#pr-f').value = S.prFilter; S.prFilter = null; }
  $('#pr-ws').onchange = () => { setWholesaleShow('tovarlar', $('#pr-ws').checked); draw(); };
  draw();
};
function priceWarnings(p) {
  const w = [];
  if (!(p.sale_price > 0)) w.push('Sotish narxi yoʻq');
  if (p.cost_price > 0 && p.sale_price > 0) {
    if (p.sale_price < p.cost_price) w.push('Sotish narxi kirimdan past');
    if (p.sale_price / p.cost_price > 50) w.push('Kirim narxi juda past (1000 barobar xato boʻlishi mumkin)');
    if (p.cost_price === p.sale_price) w.push('Ustama 0%');
  }
  if (p.cost_price === 1000 && p.sale_price >= 10000) w.push('Kirim narxi taxminiy (1000)');
  return w;
}
function productForm(p, after, init) {
  const isNew = !p; p = p || Object.assign({ name: '', unit: 'dona', active: true, in_catalog: true, cost_price: 0, sale_price: 0, min_stock: 0 }, init || {});
  const m = modal(`<h3>${isNew ? 'Yangi tovar' : 'Tovar'}</h3>
    <div class="pf-top"><div class="grow"><label>Nomi *</label><input id="f-name" value="${esc(p.name)}" autofocus></div>
      <div class="pf-img"><button type="button" class="img-box" id="f-img" title="Rasm qoʻyish (kamera yoki galereya)">${p.image_url ? `<img src="${esc(imgUrl(p.image_url))}" alt="">` : '<span>📷<br><small>Rasm</small></span>'}</button>
        <button type="button" class="lnk sm ${p.image_url ? '' : 'hide'}" id="f-img-del">Rasmni olib tashlash</button></div></div>
    <div class="row"><div class="grow"><label>Shtrix-kod</label><div class="row" style="gap:6px"><input id="f-bar" class="grow" value="${esc(p.barcode || '')}" placeholder="Skanerlang yoki ↻ bosing"><button class="btn" id="f-gen" type="button" title="Yangi shtrix-kod yaratish">↻</button></div></div><div style="width:150px"><label>Oʻlchov</label><select id="f-unit">${Object.keys(UNITS).map(u => `<option ${p.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div></div>
    <div class="row"><div class="grow"><label>Kategoriya</label><select id="f-cat"><option value="">—</option>${D.categories.map(c => `<option value="${c.id}" ${p.category_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="grow"><label>Taʼminotchi</label><select id="f-sup"><option value="">—</option>${D.suppliers.map(s => `<option value="${s.id}" ${p.supplier_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="grow"><label>Kirim narxi</label><input id="f-cost" class="num" inputmode="decimal" value="${p.cost_price ?? 0}"></div><div class="grow ${showWholesale('tovarlar') ? '' : 'hide'}"><label>Ulgurji narx</label><input id="f-whole" class="num" inputmode="decimal" value="${p.wholesale_price ?? ''}"></div><div class="grow"><label>Sotish narxi *</label><input id="f-sale" class="num" inputmode="decimal" value="${p.sale_price ?? 0}"></div></div>
    <div id="f-warn"></div>
    <details class="more" ${isPhoneUI() ? '' : 'open'}><summary>Qoʻshimcha: minimal qoldiq, muddat, PLU, MXIK</summary>
    <div class="row"><div class="grow"><label>Minimal qoldiq (kam qolsa xabar)</label><input id="f-min" class="num" inputmode="decimal" value="${p.min_stock ?? 0}"></div><div class="grow"><label>Yetkazib berish (kun)</label><input id="f-dd" class="num" inputmode="numeric" value="${p.delivery_days ?? ''}"></div><div class="grow"><label>Tarozi kodi (PLU)</label><input id="f-plu" class="num" inputmode="numeric" value="${p.plu ?? ''}"></div></div>
    <div class="row"><div class="grow"><label>Saqlash muddati, kun (ishlab chiqarilgandan)</label><input id="f-shelf" class="num" inputmode="numeric" value="${p.shelf_days ?? ''}" placeholder="masalan 180"></div>
      <div class="grow"><label>Muddat tugashiga necha kun qolganda ogohlantirish</label><input id="f-alert" class="num" inputmode="numeric" value="${p.exp_alert_days ?? ''}" placeholder="odatiy: ${setting('exp_alert_days', 7)}"></div></div>
    <label>MXIK (IKPU)</label><input id="f-mxik" value="${esc(p.mxik || '')}"></details>
    <div class="row w" style="margin-top:10px">
      <label class="row" style="margin:0"><input type="checkbox" id="f-w" style="width:auto" ${p.is_weighted ? 'checked' : ''}> Tortiladigan</label>
      <label class="row" style="margin:0"><input type="checkbox" id="f-q" style="width:auto" ${p.quick_pick ? 'checked' : ''}> Tezkor tanlov</label>
      <label class="row" style="margin:0"><input type="checkbox" id="f-cat2" style="width:auto" ${p.in_catalog !== false ? 'checked' : ''}> Mijozlarga koʻrinsin</label>
      <label class="row" style="margin:0"><input type="checkbox" id="f-act" style="width:auto" ${p.active !== false ? 'checked' : ''}> Faol</label></div>
    ${isNew ? '<label>Boshlangʻich qoldiq (boʻlsa)</label><input id="f-q0" class="num" inputmode="decimal" placeholder="0">' : ''}
    ${isNew ? '' : `<div class="row" style="margin-top:8px;align-items:center;gap:10px"><div class="mut sm grow">Qoldiq: <b id="f-stock">${fmtQ(D.stock.get(p.id) || 0)} ${p.unit}</b> — kirim, sotuv va sanash orqali oʻzgaradi.</div><button class="btn" id="f-inv" type="button">Sanab tuzatish</button></div>`}
    <div id="f-err" class="alert bad hide"></div>
    <div class="foot">${isNew ? '' : '<button class="btn red" data-x="del" style="margin-right:auto">Oʻchirish</button>'}<button class="btn" data-x="no">Bekor</button><button class="btn gold" data-x="ok">Saqlash</button></div>`, { wide: true });
  // Rasm: kamera yoki galereyadan; 480 px gacha kichraytiriladi (~40 KB), «Saqlash»da yuklanadi
  let newImg = (isNew && init && init._img instanceof Blob) ? init._img : null, delImg = false;   // taʼminotchi taklifidagi rasm
  if (newImg) { m.querySelector('#f-img').innerHTML = `<img src="${URL.createObjectURL(newImg)}" alt="">`; m.querySelector('#f-img-del').classList.remove('hide'); }
  m.querySelector('#f-img').onclick = async () => {
    const f = await pickFile(); if (!f) return;
    try { newImg = await imgResize(f); delImg = false; } catch (e) { return toast(e.message, 'bad'); }
    m.querySelector('#f-img').innerHTML = `<img src="${URL.createObjectURL(newImg)}" alt="">`; m.querySelector('#f-img-del').classList.remove('hide');
  };
  m.querySelector('#f-img-del').onclick = () => { newImg = null; delImg = true; m.querySelector('#f-img').innerHTML = '<span>📷<br><small>Rasm</small></span>'; m.querySelector('#f-img-del').classList.add('hide'); };
  const del = m.querySelector('[data-x=del]');
  if (del) del.onclick = async () => {
    const reason = await askDelete(p, D.stock.get(p.id) || 0); if (reason === null) return;
    try {
      const r = await API.rpc('product_delete', { p_id: p.id, p_reason: reason || null, p_staff: S.staff?.id || S.adminStaffId || null });
      if (p.image_url) productImageSave(p.id, p.image_url, null, true).catch(() => { });   // oʻchirilgan tovar rasmi ham oʻchadi
      closeModal(); toast('Oʻchirildi: ' + p.name + (r && +r.stock > 0 ? ' · ' + fmtQ(+r.stock) + ' ' + p.unit + ' hisobdan chiqarildi' : ''), 'ok');
      await syncDown(); after && after();
    } catch (e) { showErr('#f-err', e.code === 'NET' ? 'Oʻchirish uchun internet kerak' : /product_delete|PGRST202/.test(e.code + ' ' + e.message) ? 'Avval Supabase’da 13-SQL faylni ishga tushiring' : e.message); }
  };
  const val = () => ({
    name: $('#f-name').value.trim(), barcode: $('#f-bar').value.trim() || null, unit: $('#f-unit').value,
    category_id: $('#f-cat').value ? +$('#f-cat').value : null, supplier_id: $('#f-sup').value || null,
    cost_price: num($('#f-cost').value) || 0, wholesale_price: isNaN(num($('#f-whole').value)) ? null : num($('#f-whole').value), sale_price: num($('#f-sale').value) || 0,
    min_stock: num($('#f-min').value) || 0, delivery_days: isNaN(num($('#f-dd').value)) ? null : num($('#f-dd').value), plu: isNaN(num($('#f-plu').value)) ? null : num($('#f-plu').value),
    mxik: $('#f-mxik').value.trim() || null, is_weighted: $('#f-w').checked, quick_pick: $('#f-q').checked, in_catalog: $('#f-cat2').checked, active: $('#f-act').checked,
    shelf_days: num($('#f-shelf').value) > 0 ? Math.round(num($('#f-shelf').value)) : null, exp_alert_days: $('#f-alert').value.trim() === '' || isNaN(num($('#f-alert').value)) ? null : Math.round(num($('#f-alert').value))
  });
  const warn = () => {
    const v = val(), w = priceWarnings(v);
    if (v.barcode) { const o = D.byBarcode.get(v.barcode); if (o && o.id !== p.id) w.push('Bu shtrix-kod «' + o.name + '» da bor'); }
    const dup = [...D.products.values()].find(x => x.active && x.id !== p.id && x._n === norm(v.name)); if (dup && v.name) w.push('Shu nomli tovar bor');
    $('#f-warn').innerHTML = w.map(x => `<div class="alert">${esc(x)}</div>`).join('');
  };
  $$('.modal input, .modal select').forEach(i => i.addEventListener('input', warn)); warn();
  m.querySelector('#f-gen').onclick = async () => { $('#f-bar').value = await genBarcode(); warn(); };
  camButton($('#f-bar'), { once: true, mode: 'input', title: 'Tovar shtrix-kodi', check: code => { const o = D.byBarcode.get(code);
    return o && o.id !== p.id ? { ok: false, text: 'Bu shtrix-kod «' + o.name + '» tovarida bor' } : { ok: true, text: '✓ ' + code }; } });
  if (isNew && p.barcode) setTimeout(() => { const n = m.querySelector('#f-name'); if (n && n.isConnected) n.focus(); }, 80);
  $('#f-bar').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#f-unit').focus(); } }); // skaner Enter bosadi
  const inv = m.querySelector('#f-inv');
  if (inv) inv.onclick = async () => {
    const n = await askNumber('Haqiqiy qoldiq: ' + p.name, { hint: 'Dasturda ' + fmtQ(D.stock.get(p.id) || 0) + ' ' + p.unit + '. Sanab, bor miqdorni kiriting.' });
    if (n == null || n < 0) return;
    try {
      const id = uuid();
      await API.insert('inventories', { id, note: 'Tovar kartasidan: ' + p.name });
      await API.insert('inventory_lines', { inventory_id: id, product_id: p.id, counted_qty: n });
      await API.rpc('finish_inventory', { p_id: id });
      await syncDown(); $('#f-stock').textContent = fmtQ(D.stock.get(p.id) || 0) + ' ' + p.unit; toast('Qoldiq tuzatildi', 'ok');
    } catch (e) { toast(e.code === 'NET' ? 'Qoldiqni tuzatish uchun internet kerak' : e.message, 'bad'); }
  };
  m.querySelector('[data-x=no]').onclick = () => closeModal();
  m.querySelector('[data-x=ok]').onclick = async () => {
    const v = val(); if (!v.name) return showErr('#f-err', 'Nomini kiriting');
    if (!(v.sale_price > 0)) return showErr('#f-err', 'Sotish narxini kiriting');
    if (v.barcode) { const o = D.byBarcode.get(v.barcode); if (o && o.id !== p.id) return showErr('#f-err', 'Bu shtrix-kod boshqa tovarda bor: ' + o.name); }
    if (priceWarnings(v).length && !(await confirmBox('Narxda ogohlantirish bor. Baribir saqlansinmi?', 'Saqlash'))) return;
    if (v.shelf_days != null && v.shelf_days > 3650) return showErr('#f-err', 'Saqlash muddati 3650 kundan oshmasin');
    try {
      if (isNew) {
        v.id = uuid(); const q0 = num($('#f-q0').value);
        try { await API.rpc('kassa_new_product', { p: Object.assign({ staff_id: S.staff?.id || S.adminStaffId || null, qty: q0 > 0 ? q0 : null, opening: q0 > 0 }, v) }); }
        catch (e) {
          if (!/kassa_new_product|PGRST202|shelf_days/.test(e.code + ' ' + e.message)) throw e;   // 12-SQL hali yoʻq — eski yoʻl
          await API.insert('products', noExp(v));
          if (q0 > 0) await API.insert('stock_moves', { store_id: 1, product_id: v.id, qty: q0, kind: 'opening', cost_price: v.cost_price || 0 });
        }
      } else {
        try { await API.update('products', 'id=eq.' + p.id, v); }
        catch (e) { if (!/shelf_days|exp_alert_days|PGRST204/.test(e.code + ' ' + e.message)) throw e; await API.update('products', 'id=eq.' + p.id, noExp(v)); }
      }
      const pid = isNew ? v.id : p.id;
      if (newImg || delImg) {
        try { await productImageSave(pid, isNew ? null : p.image_url, newImg, delImg); }
        catch (e) { closeModal(); toast('Tovar saqlandi, lekin rasm yuklanmadi: ' + e.message, 'bad'); await syncDown(); after && after(pid); return; }
      }
      closeModal(); toast('Saqlandi', 'ok'); await syncDown(); after && after(pid);
    } catch (e) { showErr('#f-err', e.code === 'NET' ? 'Internet yoʻq — tovarni saqlash uchun internet kerak' : e.message); }
  };
}
// Tovarlar roʻyxatida rasmni tez qoʻyish: 📷 bosiladi → kamera yoki galereya → darhol yuklanadi
async function quickImage(p, after) {
  const f = await pickFile(); if (!f) return;
  try {
    const b = await imgResize(f); toast('Rasm yuklanmoqda…');
    await productImageSave(p.id, p.image_url, b, false); toast('Rasm qoʻyildi: ' + p.name, 'ok'); after && after();
  } catch (e) { toast(e.code === 'NET' ? 'Rasm yuklash uchun internet kerak' : e.message, 'bad'); }
}


const noExp = v => { const o = Object.assign({}, v); delete o.shelf_days; delete o.exp_alert_days; return o; };
// Tovarni oʻchirish: sabab (ixtiyoriy) soʻraladi; qoldigʻi boʻlsa — hisobdan chiqarilishi aytiladi
function askDelete(p, st) {
  return new Promise(res => {
    const m = modal(`<h3>«${esc(p.name)}» oʻchirilsinmi?</h3>
      <div class="mut sm">Tovar kassa, mijozlar katalogi va roʻyxatlardan olinadi; sotuv tarixi saqlanadi. «Oʻchirilganlar» roʻyxatidan qayta tiklash mumkin. Adminga Telegram xabar boradi.</div>
      ${st > 0 ? `<div class="alert bad" style="margin-top:8px">Qoldigʻi <b>${fmtQ(st)} ${esc(p.unit)}</b> — hisobdan chiqariladi (≈ ${fmt(st * (+p.cost_price || 0))} soʻm).</div>` : ''}
      <label>Sabab (ixtiyoriy)</label><input id="dl-r" placeholder="Masalan: xato yaratilgan, endi sotilmaydi" maxlength="200" autofocus>
      <div class="foot"><button class="btn" data-x="no">Ortga</button><button class="btn red" data-x="ok">Oʻchirish</button></div>`, { onClose: () => res(null) });
    const ok = () => { const v = $('#dl-r').value.trim(); const mm = MODALS.pop(); mm.ov.remove(); refocus(); res(v); };
    m.querySelector('[data-x=ok]').onclick = ok; m.querySelector('[data-x=no]').onclick = () => closeModal();
    $('#dl-r').addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  });
}
function restoreDialog(p, after) {
  const m = modal(`<h3>${esc(p.name)}</h3><div class="mut">Oʻchirilgan: ${timeStr(p.deleted_at)}${p.deleted_reason ? '<br>Sabab: ' + esc(p.deleted_reason) : ''}</div>
    <div class="mut sm" style="margin-top:6px">Tiklansa, tovar yana kassada va katalogda chiqadi (qoldiq 0 — kirim qiling).</div>
    <div id="rs-err" class="alert bad hide"></div>
    <div class="foot"><button class="btn" data-x="no">Yopish</button><button class="btn gold" data-x="ok">Qayta tiklash</button></div>`);
  m.querySelector('[data-x=no]').onclick = () => closeModal();
  m.querySelector('[data-x=ok]').onclick = async () => {
    try { await API.rpc('product_restore', { p_id: p.id, p_staff: S.staff?.id || S.adminStaffId || null }); closeModal(); toast('Tiklandi', 'ok'); await syncDown(); after && after(); }
    catch (e) { showErr('#rs-err', e.code === 'NET' ? 'Internet yoʻq' : e.message); }
  };
}
// Tovarlar roʻyxati Excel faylga (admin): qoldiq, narxlar, 30 kunlik savdo va foyda
function productsXlsx(list, title) {
  const cols = [{ t: 'Oʻrin (foydalilik)', w: 10, num: true, int: true }, { t: 'Tovar', w: 36 }, { t: 'Shtrix-kod', w: 16 }, { t: 'Kategoriya', w: 18 }, { t: 'Taʼminotchi', w: 18 },
    { t: 'Qoldiq', num: true, w: 10 }, { t: 'Oʻlchov', w: 8 }, { t: 'Sotish narxi', num: true, int: true }, { t: 'Ulgurji narx', num: true, int: true }, { t: 'Kirim narxi', num: true, int: true },
    { t: 'Ustama, %', num: true, w: 10 }, { t: 'Qoldiq (kirim narxida)', num: true, int: true, w: 18 }, { t: 'Qoldiq (sotish narxida)', num: true, int: true, w: 18 },
    { t: '30 kunda sotildi', num: true, w: 12 }, { t: '30 kunlik foyda', num: true, int: true }, { t: 'Saqlash muddati, kun', num: true, int: true, w: 12 }];
  let s1 = 0, s2 = 0, s3 = 0;
  const rows = list.map(p => {
    const st = D.stock.get(p.id) || 0, r = D.rank.get(p.id) || {}, cost = +p.cost_price || 0, mk = cost > 0 ? Math.round((p.sale_price - cost) / cost * 1000) / 10 : null;
    s1 += Math.max(st, 0) * cost; s2 += Math.max(st, 0) * (+p.sale_price || 0); s3 += +r.profit30 || 0;
    return [r.rnk ?? null, p.name, p.barcode || '', catName(p.category_id), supName(p.supplier_id), round3(st), p.unit, +p.sale_price || 0, +p.wholesale_price || null, cost || null, mk,
      Math.round(Math.max(st, 0) * cost), Math.round(Math.max(st, 0) * (+p.sale_price || 0)), r.sold30 == null ? null : +r.sold30, r.profit30 == null ? null : +r.profit30, p.shelf_days ?? null];
  });
  xlsxDownload('tovarlar_' + todayTK(), { sheet: 'Tovarlar', title: (title || 'Tovarlar roʻyxati') + ' — ' + fmtDate(todayTK()) + ' · ' + list.length + ' ta',
    cols, rows, total: ['', 'Jami', '', '', '', '', '', '', '', '', '', Math.round(s1), Math.round(s2), '', Math.round(s3), ''] });
}

// Ulgurji narx koʻrinishini oʻzgartirish (admin): sozlama barcha qurilmalarga tarqaladi
async function setWholesaleShow(where, on) {
  const v = Object.assign({ kirim: true, tovarlar: true, kassa: false }, setting('wholesale_show', {}) || {}, { [where]: !!on });
  D.settings.wholesale_show = v;
  try { await API.insert('settings', [{ store_id: 1, key: 'wholesale_show', value: v }], 'store_id,key'); } catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq — faqat shu qurilmada' : e.message, e.code === 'NET' ? '' : 'bad'); }
}
async function purchaseForm(id) {
  let doc = { supplier_id: '', number: '', payment_status: 'unpaid', payment_method: 'cash', note: '', status: 'draft' }, lines = [];
  if (id) {
    try {
      doc = (await API.get('purchases?select=*&id=eq.' + id))[0];

      try { lines = await API.get(pl.replace('%s', ',made_date,exp_date')); } catch (e) { if (e.code === 'NET') throw e; lines = await API.get(pl.replace('%s', '')); }
      lines = lines.map(l => Object.assign(l, { name: D.products.get(l.product_id)?.name || '?', unit: D.products.get(l.product_id)?.unit || '' }));
    }
    catch (e) { toast(e.message, 'bad'); return; }
  }
  const ro = doc.status === 'posted' || doc.status === 'cancelled';
  let ws = showWholesale('kirim'), dirty = false;
  const m = modal(`<h3>${doc.status === 'cancelled' ? 'Kirim (bekor qilingan)' : ro ? 'Kirim (tasdiqlangan)' : id ? 'Kirim (qoralama)' : 'Yangi kirim'}</h3>
    ${doc.status === 'cancelled' ? `<div class="alert bad">Bekor qilingan${doc.cancel_reason ? ': ' + esc(doc.cancel_reason) : ''}${doc.cancel_staff_id ? ' — ' + esc(staffName(doc.cancel_staff_id)) : ''}</div>` : ''}
    ${doc.staff_id ? `<div class="mut sm">Kim qabul qilgan: <b>${esc(staffName(doc.staff_id))}</b></div>` : ''}
    <div class="row w"><div class="grow"><label>Taʼminotchi</label><select id="pf-s" ${ro ? 'disabled' : ''}><option value="">—</option>${D.suppliers.map(s => `<option value="${s.id}" ${doc.supplier_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div style="width:160px"><label>Hujjat №</label><input id="pf-n" value="${esc(doc.number || '')}" ${ro ? 'disabled' : ''}></div>
      <div style="width:170px"><label>Toʻlov</label><select id="pf-p" ${ro ? 'disabled' : ''}>${[['unpaid', 'Toʻlanmagan'], ['paid', 'Toʻlangan'], ['partial', 'Qisman']].map(([v, t]) => `<option value="${v}" ${doc.payment_status === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
    ${ro ? '' : `<div class="row" style="margin-top:10px"><input id="pf-q" placeholder="Tovarni skanerlang yoki nomini yozing…" class="grow"><button class="btn" id="pf-np">+ Yangi tovar</button></div><div class="drop hide" id="pf-drop" style="position:relative"></div>
    <div class="row sm" style="margin-top:6px"><span class="mut">Ustama:</span><input id="pf-mk" class="num" style="width:80px" placeholder="%"><button class="btn" id="pf-mk-go">Sotish narxlarini hisoblash</button></div>`}
    <label class="row sm" style="margin:6px 0 0;width:auto"><input type="checkbox" id="pf-ws" style="width:auto" ${ws ? 'checked' : ''}> Ulgurji narx koʻrinsin</label>
    <div style="max-height:46vh;overflow:auto;margin-top:8px"><table class="t kl"><thead id="pf-head"></thead><tbody id="pf-lines"></tbody></table></div>
    <div class="r lg" style="margin-top:6px">Jami: <b id="pf-sum" class="num">0</b> · sotish summasi <span id="pf-ssum" class="num">0</span></div>
    <div id="pf-err" class="alert bad hide"></div>
    <div class="foot">${ro ? `${doc.status === 'posted' ? '<button class="btn red" data-x="cancel">Kirimni bekor qilish</button>' : ''}<button class="btn gold" data-x="no">Yopish</button>` : `<button class="btn" data-x="no">Bekor</button><button class="btn" data-x="save">Qoralama saqlash</button><button class="btn gold" data-x="post">Saqlash va tasdiqlash</button>`}</div>`, { wide: true, sticky: !ro,
      guard: () => !ro && dirty ? 'Kirim saqlanmadi — tovarlar qoldiqqa qoʻshilmaydi. Yopilsinmi?' : '' });
  // Qoʻlda kiritilgan har qanday oʻzgarish (qidiruv va ustama maydonidan tashqari) — «saqlanmagan»
  const markDirty = e => { if (!['pf-q', 'pf-mk', 'pf-ws'].includes(e.target.id)) dirty = true; };
  m.addEventListener('input', markDirty); m.addEventListener('change', markDirty);
  const cols = () => ['qty', 'cost_price', ...(ws ? ['wholesale_price'] : []), 'sale_price'];
  const drawLines = () => {
    $('#pf-head').innerHTML = `<tr><th>Tovar</th><th class="r">Soni</th><th class="r">Kirim narxi</th>${ws ? '<th class="r">Ulgurji</th>' : ''}<th class="r">Sotish</th><th title="Ishlab chiqarilgan sana">Ishlab chiq.</th><th title="Yaroqlilik muddati (gacha)">Yaroqli</th><th class="r">Summa</th><th></th></tr>`;

      ${cols().map(k => `<td class="r" data-label="${KL_LABEL[k]}"><input class="num" inputmode="decimal" data-k="${k}" data-i="${i}" style="width:${k === 'qty' ? 80 : 105}px;text-align:right" value="${l[k] ?? ''}" ${ro ? 'disabled' : ''}></td>`).join('')}
      ${dateCells(l, i, ro)}
      <td class="r num ls" data-label="Summa">${fmt((l.qty || 0) * (l.cost_price || 0))}</td><td>${ro ? '' : `<button class="x btn" data-del="${i}">×</button>`}</td></tr>`).join('') || `<tr><td colspan="${ws ? 9 : 8}" class="mut">Tovar qoʻshing</td></tr>`;
    sums();
    $$('#pf-lines input').forEach(inp => inp.oninput = () => {
      const v = num(inp.value), l = lines[+inp.dataset.i]; l[inp.dataset.k] = isNaN(v) ? (inp.dataset.k === 'wholesale_price' ? null : 0) : v;
      const tr = inp.closest('tr'); tr.querySelector('.ls').textContent = fmt((l.qty || 0) * (l.cost_price || 0));

  };

    $('#pf-sum').textContent = fmt(lines.reduce((a, l) => a + (l.qty || 0) * (l.cost_price || 0), 0));
    $('#pf-ssum').textContent = fmt(lines.reduce((a, l) => a + (l.qty || 0) * (l.sale_price || 0), 0));
  };
  const add = (p, qty = 1, cost, dates) => {
    const ex = lines.find(l => l.product_id === p.id && !dates);
    if (ex) ex.qty = round3((ex.qty || 0) + qty); else lines.push(Object.assign({ product_id: p.id, name: p.name, unit: p.unit, qty: round3(qty), cost_price: cost ?? (+p.cost_price || 0), wholesale_price: p.wholesale_price, sale_price: +p.sale_price || 0 }, dates || {}));
    autoSupplier($('#pf-s'), p); dirty = true;
    drawLines(); const qi = $$('#pf-lines [data-k=qty]'); const last = qi[lines.indexOf(ex || lines[lines.length - 1])]; if (last && !camOpen()) { last.focus(); last.select(); }

  if (!ro) {

    wireKirimSearch(q, $('#pf-drop'), add, () => $('#pf-s').value);

    camButton(q, { resume: true, title: 'Kirim: skanerlash', hint: 'Har oʻqilgan tovar kirimga qoʻshiladi (+1). Roʻyxatda yoʻq boʻlsa — yangi tovar oynasi ochiladi',

    $('#pf-mk-go').onclick = () => { const k = num($('#pf-mk').value); if (isNaN(k)) return; for (const l of lines) if (l.cost_price > 0) l.sale_price = Math.ceil(l.cost_price * (1 + k / 100) / 100) * 100; dirty = true; drawLines(); };
    setTimeout(() => q.focus(), 50);

  drawLines();

  const cb = m.querySelector('[data-x=cancel]');

    const reason = await askText('Kirim bekor qilinsinmi? Tovarlar qoldiqdan ayiriladi. Sababi:', 'Masalan: hujjat xato kiritildi');
    if (reason === null) return;
    if (reason.trim().length < 3) return toast('Bekor qilish sababini yozing', 'bad');
    try { await API.rpc('purchase_cancel', { p_id: id, p_reason: reason, p_staff: S.staff?.id || null }); closeModal(); toast('Kirim bekor qilindi', 'ok'); await syncDown(); go('kirim'); }
    catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : /purchase_cancel/.test(e.message) ? 'Avval 10_nazorat.sql ni ishga tushiring' : e.message, 'bad'); }

    const bad = lines.find(l => !(l.qty > 0) || !(l.sale_price > 0));

    if (bad) return showErr('#pf-err', '«' + bad.name + '»: soni va sotish narxi kiritilishi shart');

    const pe = priceError(lines, false, showWholesale('kirim')); if (pe) return showErr('#pf-err', pe);
    try {
      const head = { supplier_id: $('#pf-s').value || null, number: $('#pf-n').value.trim() || null, payment_status: $('#pf-p').value };
      let pid = id;
      if (!pid) {
        pid = uuid();
        try { await API.insert('purchases', Object.assign({ id: pid, staff_id: S.staff?.id || null, cashbox_id: S.staff ? cashboxId() : null }, head)); }
        catch (e) { if (/staff_id|cashbox_id|PGRST204/.test(e.code + ' ' + e.message)) await API.insert('purchases', Object.assign({ id: pid }, head)); else throw e; }
      }
      else { await API.update('purchases', 'id=eq.' + pid, head); await API.remove('purchase_lines', 'purchase_id=eq.' + pid); }

      try { await API.insert('purchase_lines', pls); }
      catch (e) { if (!/made_date|exp_date|PGRST204/.test(e.code + ' ' + e.message)) throw e; await API.insert('purchase_lines', pls.map(x => { delete x.made_date; delete x.exp_date; return x; })); }
      if (post) await API.rpc('post_purchase', { p_id: pid });
      closeModal(); toast(post ? 'Kirim tasdiqlandi, qoldiq va narxlar yangilandi' : 'Qoralama saqlandi', 'ok');

}

/* ---------- Kirim yordamchilari: qidiruv, yangi tovar, shtrix-kod, muddatlar ---------- */
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const dateCells = (l, i, ro) => `<td data-label="Ishlab chiq."><input type="date" class="dt" data-d="made_date" data-i="${i}" value="${esc(l.made_date || '')}" max="${todayTK()}" ${ro ? 'disabled' : ''}></td>`
  + `<td data-label="Yaroqli"><input type="date" class="dt${!ro && !l.exp_date ? ' need' : ''}" data-d="exp_date" data-i="${i}" value="${esc(l.exp_date || '')}" ${ro ? 'disabled' : 'required'}></td>`;
const KL_LABEL = { qty: 'Soni', cost_price: 'Kirim narxi', wholesale_price: 'Ulgurji', sale_price: 'Sotish' };
// Ishlab chiqarilgan sana kiritilsa va tovarning saqlash muddati maʼlum boʻlsa — yaroqlilik oʻzi qoʻyiladi
function bindDates(sel, lines) {
  $$(sel + ' [data-d]').forEach(inp => inp.onchange = () => {
    const l = lines[+inp.dataset.i]; l[inp.dataset.d] = inp.value || null;
    const ex = inp.closest('tr')?.querySelector('[data-d=exp_date]');
    if (inp.dataset.d === 'made_date' && inp.value && !l.exp_date) {
      const sh = +D.products.get(l.product_id)?.shelf_days;
      if (sh > 0) { l.exp_date = addDays(inp.value, sh); const e = inp.closest('tr').querySelector('[data-d=exp_date]'); if (e) e.value = l.exp_date; }
    }
    if (ex) ex.classList.toggle('need', !l.exp_date);
  });
}
// Muddati oʻtgan tovar qabul qilinayotgan boʻlsa — soʻraladi
async function expiredOk(lines) {
  const e = lines.filter(l => l.exp_date && l.exp_date < todayTK());
  return !e.length || await confirmBox(e.map(l => '«' + l.name + '»').join(', ') + ' — yaroqlilik muddati oʻtgan (' + fmtDate(e[0].exp_date) + '). Baribir qabul qilinsinmi?', 'Ha, qabul qilish');
}
// Kirimda yaroqlilik muddati (srok) majburiy: har bir qatorda «Yaroqli (gacha)» sanasi boʻlishi kerak
function datesError(lines, needExp = true) {
  for (const l of lines) {
    if (needExp && !l.exp_date) return '«' + l.name + '»: yaroqlilik muddati (srok) kiritilmagan — kirimda majburiy';
    if (l.made_date && l.made_date > todayTK()) return '«' + l.name + '»: ishlab chiqarilgan sana kelajakda boʻlmaydi';
    if (l.made_date && l.exp_date && l.exp_date < l.made_date) return '«' + l.name + '»: yaroqlilik muddati ishlab chiqarilgan sanadan oldin boʻlmaydi';
  }
  return '';
}
// Tovarning odatiy taʼminotchisi boʻsh maydonga avtomatik qoʻyiladi (keyin oʻzgartirsa boʻladi)
function autoSupplier(sel, p) {
  if (sel && !sel.value && p.supplier_id && [...sel.options].some(o => o.value === p.supplier_id)) sel.value = p.supplier_id;
}
// Qidiruv: skaner (shtrix-kod) yoki nomi; topilmasa — «yangi tovar» (yozilgan matn oʻtadi, qayta kiritish shart emas)
function wireKirimSearch(q, dr, add, getSupplier) {
  let res = [];
  const reset = () => { q.value = ''; dr.classList.add('hide'); res = []; };
  const newP = text => { reset(); quickProduct({ text, supplier: getSupplier(), onSaved: add }); };
  q.oninput = () => {
    const t = q.value.trim(); res = t ? findProducts(t, 12) : [];
    dr.innerHTML = res.map((p, i) => `<div data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="mut sm">${esc(p.barcode || '')}</span></div>`).join('')
      + (t ? `<div data-new="1"><b class="grow" style="color:var(--gold-t)">+ «${esc(t)}» — yangi tovar</b></div>` : '');
    dr.classList.toggle('hide', !t);
    dr.querySelectorAll('[data-i]').forEach(el => el.onmousedown = e => { e.preventDefault(); add(res[+el.dataset.i]); reset(); });
    const nw = dr.querySelector('[data-new]'); if (nw) nw.onmousedown = e => { e.preventDefault(); newP(t); };
  };
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = q.value.trim(); if (!v) return;
    const exact = D.byBarcode.get(v);
    if (exact) { add(exact); reset(); return; }
    if (/^\d{6,}$/.test(v)) { toast('Bu shtrix-kod roʻyxatda yoʻq — yangi tovar sifatida qoʻshing'); newP(v); return; }
    if (res[0]) { add(res[0]); reset(); return; }
    newP(v);
  };
}
// EAN-13 nazorat raqami
function ean13(d12) { let t = 0; for (let i = 0; i < 12; i++) t += (+d12[i]) * (i % 2 ? 3 : 1); return d12 + ((10 - t % 10) % 10); }
// Doʻkon ichki shtrix-kodi: tarozi prefikslariga toʻgʻri kelmaydi va boshqa tovarda yoʻq
async function genBarcode() {
  const scale = [setting('scale_prefix_weight', '20'), setting('scale_prefix_piece', '21'), setting('scale_prefix_total', '25')].map(String);
  const prefix = ['28', '29', '27', '26', '24', '23', '22'].find(x => !scale.includes(x)) || '29';
  const used = new Set([...D.products.values()].map(p => String(p.barcode || '')));
  for (let t = 0; t < 50; t++) {
    let d = prefix; for (let i = 0; i < 10; i++) d += Math.floor(Math.random() * 10);
    const code = ean13(d);
    if (used.has(code)) continue;
    try { if (S.online && await API.rpc('barcode_owner', { p_code: code })) continue; } catch (e) { }
    return code;
  }
  return '';
}
// Kirimda yangi taʼminotchi / kategoriya (kassir ham qoʻsha oladi; oʻchirish va tahrirlash — faqat admin)
function addNewBtn(sel, kind) {
  if (!sel || sel.disabled || sel.dataset.addsel) return;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn'; b.dataset.addnew = kind; b.textContent = '+';
  b.title = kind === 'sup' ? 'Yangi taʼminotchi qoʻshish' : 'Yangi kategoriya qoʻshish';
  const wrap = document.createElement('div'); wrap.className = 'row'; wrap.style.gap = '6px';
  sel.parentElement.insertBefore(wrap, sel); wrap.appendChild(sel); sel.classList.add('grow'); wrap.appendChild(b);
  b.onclick = () => {
    const m = modal(`<h3>${kind === 'sup' ? 'Yangi taʼminotchi' : 'Yangi kategoriya'}</h3>
      <label>Nomi *</label><input id="an-n" autocomplete="off">
      ${kind === 'sup' ? '<label>Telefon</label><input id="an-p" inputmode="tel" placeholder="90 123 45 67">' : ''}
      <div class="mut sm" style="margin-top:6px">Qoʻshilgani adminga xabar qilinadi. Xato boʻlsa — adminga ayting, u tuzatadi (oʻchirish faqat adminda).</div>
      <div id="an-err" class="alert bad hide"></div>
      <div class="foot"><button class="btn" data-x="no">Bekor</button><button class="btn gold" data-x="ok">Qoʻshish</button></div>`);
    const ok = async () => {
      const name = m.querySelector('#an-n').value.trim();
      if (name.length < 2) return showErr('#an-err', 'Nomini yozing');
      const btn = m.querySelector('[data-x=ok]'); btn.disabled = true;
      try {
        const staff = S.staff?.id || S.adminStaffId || null;
        const r = kind === 'sup' ? await API.rpc('staff_add_supplier', { p_name: name, p_phone: m.querySelector('#an-p').value, p_staff: staff })
                                 : await API.rpc('staff_add_category', { p_name: name, p_staff: staff });
        const list = kind === 'sup' ? D.suppliers : D.categories, id = kind === 'sup' ? r.id : +r.id;
        const ex = list.find(x => String(x.id) === String(id));
        if (ex) ex.active = true; else list.push({ id, name: r.name, active: true });
        $$(`select[data-addsel="${kind}"]`).forEach(x => { if (![...x.options].some(o => o.value === String(id))) x.add(new Option(r.name, id)); });
        sel.value = String(id); sel.dispatchEvent(new Event('change'));
        closeModal(); toast(r.existed ? '«' + r.name + '» roʻyxatda bor edi — tanlandi' : '«' + r.name + '» qoʻshildi', 'ok');
      } catch (e) { btn.disabled = false; showErr('#an-err', e.code === 'NET' ? 'Internet yoʻq' : /staff_add_/.test(e.message) ? 'Avval Supabase’da 29-SQL faylni ishga tushiring' : e.message); }
    };
    m.querySelector('[data-x=ok]').onclick = ok; m.querySelector('[data-x=no]').onclick = () => closeModal();
    m.querySelector('#an-n').onkeydown = e => { if (e.key === 'Enter') ok(); };
    setTimeout(() => m.querySelector('#an-n').focus(), 50);
  };
  sel.dataset.addsel = kind;
}
// Sotish (va ulgurji) narxi kirim narxidan past boʻlsa — kirim qilinmaydi
function priceError(lines, cashier, checkWs) {
  for (const l of lines) {
    const cost = +l.cost_price || 0; if (!(cost > 0)) continue;
    const p = D.products.get(l.product_id) || {};
    const sale = l.sale_price != null && l.sale_price !== '' ? +l.sale_price : +p.sale_price || 0, ws = l.wholesale_price != null && l.wholesale_price !== '' ? +l.wholesale_price : null;
    if (sale > 0 && sale < cost) return '«' + l.name + '»: sotish narxi (' + fmt(sale) + ') kirim narxidan (' + fmt(cost) + ') past — kirim qilinmaydi.'
      + (cashier ? ' Adminga ayting: sotish narxini oshirsin yoki kirim narxini tekshiring.' : ' Sotish narxini oshiring.');
    if (checkWs && ws != null && ws > 0 && ws < cost) return '«' + l.name + '»: ulgurji narx (' + fmt(ws) + ') kirim narxidan (' + fmt(cost) + ') past — kirim qilinmaydi';
  }
  return '';
}

  camButton($('#qp-b'), { once: true, mode: 'input', title: 'Tovar shtrix-kodi', check: code => { const o = D.byBarcode.get(code);
    return o ? { ok: false, text: 'Bu shtrix-kod «' + o.name + '» tovarida bor' } : { ok: true, text: '✓ ' + code }; } });

  $('#qp-md').onchange = autoExp; $('#qp-sh').oninput = autoExp; $('#qp-ed').onchange = () => { $('#qp-ed').dataset.manual = $('#qp-ed').value ? '1' : ''; };
  setTimeout(() => { const n = m.querySelector('#qp-n'); if (n && n.isConnected) (n.value ? m.querySelector('#qp-cost') : n).focus(); }, 50);
  if (isCode) chk();

      D.products.set(p.id, p); reindex();

}

/* ---------- Srogi kiritilmagan qoldiq: har biriga yaroqlilik muddati (kassir va rahbar) ---------- */
async function noexpDialog(onDone) {
  const m = modal(`<h3>⏳ Srogi kiritilmagan tovarlar</h3>
    <div class="mut sm">Qoldigʻi bor, lekin yaroqlilik muddati yozilmagan. Har biriga «Yaroqli (gacha)» sanasini kiriting — hammasi kiritilmaguncha har kuni eslatma keladi.</div>
    <input id="ne-q" placeholder="Qidirish: nomi yoki shtrix-kod" style="margin-top:8px;width:100%">
    <div id="ne-b" class="mut" style="margin-top:8px">Yuklanmoqda…</div>
    <div class="foot"><button class="btn" data-x="close">Yopish</button></div>`, { wide: true, onClose: () => { if (onDone) onDone(); } });
  m.querySelector('[data-x=close]').onclick = () => closeModal();
  const b = m.querySelector('#ne-b');
  let rows;
  try { rows = await API.rpc('noexp_list'); }
  catch (e) { b.innerHTML = `<div class="alert bad">${esc(e.code === 'NET' ? 'Internet yoʻq' : /noexp_list|PGRST202/.test(e.code + ' ' + e.message) ? 'Avval Supabase’da 28-SQL faylni ishga tushiring' : e.message)}</div>`; return; }
  b.classList.remove('mut');
  const draw = () => {
    const q = (m.querySelector('#ne-q').value || '').trim().toLowerCase();
    const list = rows.filter(r => !q || r.name.toLowerCase().includes(q) || (r.barcode || '').includes(q));
    b.innerHTML = !rows.length ? '<div class="ok">✓ Hamma qoldiqqa srok kiritilgan</div>'
      : !list.length ? '<div class="mut">Topilmadi</div>'
      : `<div class="mut sm">${list.length} ta tovar</div><div style="max-height:58vh;overflow:auto"><table class="t"><thead><tr><th>Tovar</th><th class="r">Sroksiz qoldiq</th><th>Yaroqli (gacha)</th><th></th></tr></thead><tbody>
        ${list.slice(0, 150).map(r => `<tr data-id="${r.product_id}"><td><span translate="no">${esc(r.name)}</span>${r.barcode ? ` <span class="mut sm">${esc(r.barcode)}</span>` : ''}</td>
          <td class="r num nw">${fmtQ(+r.qty)} ${esc(r.unit)}</td><td><input type="date" class="dt need"></td><td><button class="btn gold" data-ok>Saqlash</button></td></tr>`).join('')}</tbody></table></div>
        ${list.length > 150 ? '<div class="mut sm">Birinchi 150 tasi koʻrsatildi — qolganini qidiruv bilan toping</div>' : ''}`;
    b.querySelectorAll('tr[data-id]').forEach(tr => {
      const inp = tr.querySelector('input'), btn = tr.querySelector('[data-ok]');
      inp.oninput = () => inp.classList.toggle('need', !inp.value);
      const save = async () => {
        if (!inp.value) { inp.focus(); return toast('Sanani kiriting', 'bad'); }
        btn.disabled = true;
        try {
          const r = await API.rpc('set_stock_exp', { p_product: tr.dataset.id, p_exp: inp.value });
          rows = rows.filter(x => x.product_id !== tr.dataset.id);
          toast('«' + r.name + '» — srok saqlandi' + (+r.left ? '. Qoldi: ' + r.left + ' ta' : '. Hammasi kiritildi ✓'), 'ok');
          draw();
        } catch (e) { btn.disabled = false; toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
      };
      btn.onclick = save;
      inp.onkeydown = e => { if (e.key === 'Enter') save(); };
    });
  };
  m.querySelector('#ne-q').oninput = draw;
  draw();
}

/* ---------- Kirim: kassir uchun (sotish narxi va ustama koʻrinmaydi, xato kirimni 24 soat ichida bekor qiladi) ---------- */
async function kirimKassa(main) {
  main.style.padding = '14px';
  main.innerHTML = `<div class="row"><div class="h1 grow">Kirim</div><button class="btn hide" id="kk-noexp">⏳ Srogi yoʻq</button><button class="btn gold" id="kk-new">+ Yangi kirim</button></div>
    <div class="mut sm" style="margin:-4px 0 8px">Kelgan tovarni qabul qiling. Xato boʻlsa — «Bekor qilish» (24 soat ichida) va qaytadan kiriting. Har bir kirim adminga yuboriladi.</div>
    <div class="card" id="kk-list">Yuklanmoqda…</div>`;
  $('#kk-new').onclick = () => kirimKassaForm(() => kirimKassa(main));
  $('#kk-noexp').onclick = () => noexpDialog(() => { if ($('#kk-list')) kirimKassa(main); });
  API.rpc('noexp_count').then(n => { const e = $('#kk-noexp'); if (e && +n > 0) { e.textContent = '⏳ Srogi yoʻq: ' + n; e.classList.remove('hide'); } }).catch(() => {});
  let list;
  try { list = await API.rpc('kassa_purchases', { p_days: 3 }); }
  catch (e) { $('#kk-list').innerHTML = `<div class="alert bad">${esc(e.code === 'NET' ? 'Kirimlarni koʻrish uchun internet kerak' : /kassa_purchases/.test(e.message) ? 'Avval Supabase’da 10_nazorat.sql ni ishga tushiring' : e.message)}</div>`; return; }
  if (!$('#kk-list')) return;
  $('#kk-list').innerHTML = (list || []).map(d => `<div class="kk" style="padding:10px 2px;border-bottom:1px solid var(--line)">
      <div class="row w"><b>${timeStr(d.created_at)}</b><span>${esc(d.supplier || 'Taʼminotchisiz')}${d.number ? ' · № ' + esc(d.number) : ''}</span><span class="mut sm">${esc(d.staff || '')}</span><div class="grow"></div>
        ${d.status === 'cancelled' ? '<span class="tag red">bekor qilingan</span>' : '<span class="tag ok">qabul qilindi</span>'}
        ${d.can_cancel ? `<button class="btn red" data-cancel="${d.id}">Bekor qilish</button>` : ''}</div>
      <div class="sm" style="margin-top:4px">${(d.lines || []).map(l => `${esc(l.name)} — <b>${fmtQ(+l.qty)}</b> ${esc(l.unit || '')}`).join(' · ')}</div>
      ${d.cancel_reason ? `<div class="mut sm">Sabab: ${esc(d.cancel_reason)}${d.cancel_staff ? ' (' + esc(d.cancel_staff) + ')' : ''}</div>` : ''}
    </div>`).join('') || '<div class="mut">Oxirgi 3 kunda kirim yoʻq</div>';
  $$('#kk-list [data-cancel]').forEach(b => b.onclick = async () => {
    const reason = await askText('Kirim bekor qilinsinmi? Tovarlar qoldiqdan ayiriladi. Sababi:', 'Masalan: soni xato yozildi');
    if (reason === null) return;
    if (reason.trim().length < 3) return toast('Bekor qilish sababini yozing', 'bad');
    try { await API.rpc('purchase_cancel', { p_id: b.dataset.cancel, p_reason: reason, p_staff: S.staff?.id || null }); toast('Kirim bekor qilindi — adminga xabar yuborildi', 'ok'); await syncDown(); kirimKassa(main); }
    catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
  });
}

      guard: () => lines.length ? `Kirim saqlanmadi: ${lines.length} ta tovar qoldiqqa qoʻshilmaydi. Yopilsinmi?` : '' });
  // Kassadan taʼminotchiga berilgan pul (nakladnoydagi summa): «Toʻlangan» boʻlsa va hamma narx yozilgan boʻlsa — jami taklif qilinadi
  const total = () => Math.round(lines.reduce((a, l) => a + (l.qty || 0) * (l.cost_price || 0), 0)), known = () => lines.length > 0 && lines.every(l => l.cost_price > 0);

    if (ex) ex.qty = round3((ex.qty || 0) + qty); else lines.push(Object.assign({ product_id: p.id, name: p.name, unit: p.unit, qty: round3(qty), cost_price: cost || null, wholesale: +p.wholesale_price || 0 }, dates || {}));
    autoSupplier($('#kf-s'), p);
    draw(); const qi = $$('#kf-lines [data-k=qty]')[lines.indexOf(ex || lines[lines.length - 1])]; if (qi && !camOpen()) { qi.focus(); qi.select(); }
  };

  addNewBtn($('#kf-s'), 'sup');
  camButton(q, { resume: true, title: 'Kirim: skanerlash', hint: 'Har oʻqilgan tovar kirimga qoʻshiladi (+1). Roʻyxatda yoʻq boʻlsa — yangi tovar oynasi ochiladi',
    count: p => { const l = lines.find(x => x.product_id === p.id); return l ? fmtQ(l.qty) + ' ' + (p.unit || '') : ''; } });
  setTimeout(() => q.focus(), 50);

    const bad = lines.find(l => !(l.qty > 0)); if (bad) return showErr('#kf-err', '«' + bad.name + '»: sonini kiriting');
    const neg = lines.find(l => l.cost_price != null && l.cost_price < 0); if (neg) return showErr('#kf-err', '«' + neg.name + '»: kirim narxi notoʻgʻri');

    const paid = canCash && $('#kf-p').value !== 'unpaid' ? num($('#kf-cash').value) || 0 : 0;
    if (paid < 0 || (known() && paid > total() + 0.5)) return showErr('#kf-err', 'Kassadan berilgan summa kirim summasidan (' + fmt(total()) + ') oshmasin');
    if (!(await expiredOk(lines))) return;
    if (!(await confirmBox(`Kirim qabul qilinsinmi? ${lines.length} ta tovar — qoldiq oshadi.` + (paid > 0 ? ` Kassadan ${fmt(paid)} soʻm taʼminotchiga beriladi.` : ''), 'Qabul qilish'))) return;
    const p = { id: uuid(), supplier_id: $('#kf-s').value || null, number: $('#kf-n').value.trim() || null, payment_status: $('#kf-p').value,
      staff_id: S.staff?.id || null, cashbox_id: cashboxId(), lines: lines.map(l => ({ product_id: l.product_id, qty: l.qty, cost_price: l.cost_price || null, made_date: l.made_date || null, exp_date: l.exp_date || null })) };
    const btn = m.querySelector('[data-x=ok]'); btn.disabled = true;
    try {
      await API.rpc('kassa_purchase', { p });
      if (paid > 0) await enqueue('expense', { id: uuid(), shift_id: S.shift.id, type_id: supT.id, amount: paid, from_cash: true, supplier_id: p.supplier_id, purchase_id: p.id,
        note: 'Kirim' + (p.number ? ' №' + p.number : '') + ' uchun', staff_id: S.staff?.id || null });
      closeModal(); toast('Kirim qabul qilindi — adminga xabar yuborildi', 'ok'); await syncDown(); after && after();
    }
    catch (e) { btn.disabled = false; showErr('#kf-err', e.code === 'NET' ? 'Kirim uchun internet kerak' : /kassa_purchase/.test(e.message) ? 'Avval Supabase’da 10_nazorat.sql ni ishga tushiring' : e.message); }
  };
}

    const disc = kind === 'discount', all = disc && allP, sel = kind !== 'info' && forC;
    const head = { title: $('#pm-t').value.trim(), description: $('#pm-d').value.trim() || null, kind, start_date: $('#pm-s').value || todayTK(), end_date: $('#pm-e').value || null,
      active: $('#pm-a').checked, show_in_shop: $('#pm-sh').checked };
    if (head.title.length < 2) return showErr('#pm-err', 'Aksiya nomini yozing');
    if (head.end_date && head.end_date < head.start_date) return showErr('#pm-err', 'Tugash sanasi boshlanishidan oldin boʻlmasin');
    if (disc && pct != null && !(pct > 0 && pct < 100)) return showErr('#pm-err', 'Foiz 0 dan katta va 100 dan kichik boʻlsin');
    if (all && !(pct > 0)) return showErr('#pm-err', 'Barcha tovarlarga aksiya uchun chegirma foizini yozing');
    const items = kind === 'info' || all ? [] : rows;
    if (kind !== 'info' && !all && !items.length) return showErr('#pm-err', kind === 'gift' ? 'Sovgʻa aksiyasi uchun tovar qoʻshing' : 'Tovar qoʻshing yoki «Barcha tovarlar»ni tanlang');
    for (const r of items) {
      const p = D.products.get(r.product_id), n = p ? p.name : '?', eff = r.promo_price ?? pctOf(p);
      if (disc && !(eff > 0 && (!p || eff < p.sale_price))) return showErr('#pm-err', `«${n}»: aksiya narxini yoki chegirma foizini yozing (oddiy narxdan past)`);
      if (kind === 'gift' && !(r.buy_qty > 0 && r.gift_product_id && r.gift_qty > 0)) return showErr('#pm-err', `«${n}»: necha ta olsa va sovgʻa tovarini kiriting`);
    }
    if (sel && !cls.length) return showErr('#pm-err', 'Mijozlarni tanlang yoki «Hamma mijozlar»ni belgilang');
    // 13-SQL boʻlsa — foiz, barcha tovarlar va mijozlar ham saqlanadi
    const ext = { pct: disc ? pct : null, all_products: all, for_clients: sel };
    const btn = m.querySelector('[data-x=ok]'); btn.disabled = true;
    try {
      const id = a.id || uuid();
      try { if (isNew) await API.insert('promotions', Object.assign({ id }, head, ext)); else await API.update('promotions', 'id=eq.' + id, Object.assign({}, head, ext)); }
      catch (e) { if (/pct|all_products|for_clients|PGRST204|42703/.test(e.code + ' ' + e.message)) throw new Error('Avval Supabase’da 13-SQL faylni ishga tushiring (aksiya foizi va mijozlar uchun)'); throw e; }
      if (!isNew) await API.remove('promotion_items', 'promotion_id=eq.' + id);
      if (items.length) await API.insert('promotion_items', items.map(r => disc
        ? { promotion_id: id, product_id: r.product_id, promo_price: r.promo_price }
        : { promotion_id: id, product_id: r.product_id, buy_qty: r.buy_qty, gift_product_id: r.gift_product_id, gift_qty: r.gift_qty }));
      if (!isNew || sel) await API.remove('promotion_clients', 'promotion_id=eq.' + id).catch(e => { if (sel) throw e; });
      if (sel) await API.insert('promotion_clients', cls.map(c => ({ promotion_id: id, client_id: c })));
      closeModal(); toast('Aksiya saqlandi', 'ok');
      await syncDown();
      if (m.querySelector('#pm-tg').checked && head.active && head.start_date <= todayTK()) await promoSend(id);
      after && after();
    } catch (e) { btn.disabled = false; showErr('#pm-err', e.code === 'NET' ? 'Internet yoʻq' : e.message); }
  };
}

const CT_NET = [['instagram', 'Instagram', '@yangikent_market yoki havola'], ['telegram', 'Telegram kanal', '@kanal yoki t.me/…'], ['youtube', 'YouTube', '@kanal yoki havola'],
  ['facebook', 'Facebook', 'sahifa nomi yoki havola'], ['tiktok', 'TikTok', '@nom'], ['whatsapp', 'WhatsApp', 'telefon raqam'], ['ok', 'Odnoklassniki', 'havola'],
  ['site', 'Sayt', 'masalan yangikent.uz'], ['map', 'Xaritada joylashuv', 'Google yoki Yandex xarita havolasi']];
// @nom, nom yoki havola → toʻliq https:// havola
function contactUrl(k, v) {
  v = String(v || '').trim(); if (!v) return '';
  if (k === 'whatsapp' && !/^https?:\/\//i.test(v)) { const d = v.replace(/\D/g, ''); return d.length >= 9 ? 'https://wa.me/' + (d.length === 9 ? '998' + d : d) : ''; }
  if (/^https?:\/\/\S+$/i.test(v)) return v;

// «telegram» funksiyasi (Verify JWT oʻchiq — kalitsiz chaqiriladi)
const FN_OLD = '«telegram» funksiyasida eski kod turibdi — yangi kodni joylang: Supabase → Edge Functions → telegram → Code → Deploy updates';
const FN_401 = 'Funksiya kirishni rad etdi (401): Supabase → Edge Functions → telegram → Settings → «Verify JWT» oʻchiq boʻlsin';
async function fnCall(q) {
  const base = String(setting('functions_url', '') || (S.cfg.url + '/functions/v1/telegram'));
  const r = await fetch(base + (base.includes('?') ? '&' : '?') + q, { method: 'POST' });
  return { r, j: await r.json().catch(() => ({})) };
}
// Bot holati: webhook ulanganmi, javobsiz xabarlar, oxirgi xato
async function botStatus() {
  const el = $('#tg-st'); if (!el) return;
  el.innerHTML = '<span class="mut">Bot holati tekshirilmoqda…</span>';
  const show = (cls, html) => { if ($('#tg-st')) $('#tg-st').innerHTML = `<div class="alert ${cls}" style="margin:0">${html}</div>`; };
  try {
    const { r, j } = await fnCall('status=1');
    if (r.status === 401) return show('bad', esc(FN_401));
    if (!('url' in j) && !j.error) return show('bad', esc(FN_OLD));
    if (!j.ok) return show('bad', 'Bot ishlamayapti: ' + esc(j.error || ('funksiya javobi ' + r.status)));
    if (!j.url) return show('bad', 'Bot hali ulanmagan — «Botni sozlash» tugmasini bosing.' + (j.pending ? ` Javob kutayotgan xabarlar: <b>${j.pending}</b>` : ''));
    const recent = j.last_error && j.last_error_at && Date.now() - new Date(j.last_error_at).getTime() < 3600e3;
    if (recent) return show('', `Bot ulangan, lekin oxirgi xato (${esc(timeStr(j.last_error_at))}): ${esc(j.last_error)}`);
    el.innerHTML = `<b class="ok">✓ Bot ishlayapti</b> — mijozlarga javob beradi${j.pending ? ` · navbatda ${j.pending} ta xabar` : ''}`;
  } catch (e) {
    show('bad', /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Funksiyaga ulanib boʻlmadi — internet yoki «telegram» funksiyasini tekshiring' : esc(e.message));
  }
}
