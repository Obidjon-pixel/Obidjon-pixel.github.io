<style>
:root {
  --gold: #E1BF89; --gold-d: #B8914E; --gold-t: #8A6A2E; --ink: #131313; --ink2: #2A2A2A;
  --bg: #F3F1EC; --card: #FFFFFF; --line: #E2DED5; --mut: #6E6A62; --ok: #1E7B34; --bad: #B3261E; --warn: #9C5700;
  --r: 10px; --sh: 0 1px 2px rgba(0,0,0,.06), 0 2px 10px rgba(0,0,0,.05);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); border-color: var(--gold-d); }
label { display: block; font-size: 13px; color: var(--mut); margin: 10px 0 4px; }
.num { font-variant-numeric: tabular-nums; }
td.num, th.num, td .num { white-space: nowrap; }   /* summalar ikki qatorga boʻlinmasin (uzun tovar nomi boʻlsa ham) */
.r { text-align: right; } .c { text-align: center; } .mut { color: var(--mut); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.b { font-weight: 600; } .sm { font-size: 13px; } .lg { font-size: 20px; } .xl { font-size: 30px; font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; } .row.w { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 8px; }
.hide { display: none !important; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--gold-d); }
.btn.gold { background: var(--gold); border-color: var(--gold-d); color: var(--ink); }
.btn.gold:hover { background: #D9B270; }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--gold); }
.btn.red { background: #fff; border-color: #E8B4AF; color: var(--bad); }
.btn.big { padding: 14px 18px; font-size: 18px; border-radius: 12px; }
.btn.blk { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.kbd { font-size: 11px; opacity: .7; margin-left: 6px; font-weight: 500; }

/* ---- Yuqori panel ---- */
.top { height: 56px; background: var(--ink); color: #eee; display: flex; align-items: center; gap: 14px; padding: 0 14px; }
.top .brand { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 700; font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
.top .brand img { width: 38px; height: 38px; border-radius: 50%; }
.top .who { font-size: 13px; color: #bbb; line-height: 1.25; }
.top .who b { color: #fff; font-weight: 600; }
.top .sp { flex: 1; }
.tbtn { background: transparent; border: 1px solid #3a3a3a; color: #ddd; border-radius: 8px; padding: 7px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.tbtn:hover { border-color: var(--gold); color: var(--gold); }
.tbtn.red { color: #ff9a92; border-color: #6b2a25; }
.net { width: 10px; height: 10px; border-radius: 50%; background: #3fbf5f; display: inline-block; }
.net.off { background: #e0573e; }
.sync { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #2b2b2b; color: #ccc; }
.sync.pend { background: #5a4520; color: var(--gold); }

/* ---- Asosiy joylashuv ---- */
.shell { display: flex; height: calc(100vh - 56px); }
.menu { width: 92px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px 0; overflow-y: auto; }
.menu button { border: 0; background: transparent; padding: 10px 4px; font-size: 12px; color: var(--mut); display: flex; flex-direction: column; align-items: center; gap: 4px; border-left: 3px solid transparent; }
.menu button .i { font-size: 20px; line-height: 1; }
.menu button.on { color: var(--ink); border-left-color: var(--gold-d); background: #FBF6EC; font-weight: 600; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 10px; }
.main { flex: 1; min-width: 0; overflow: auto; padding: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 14px; }
.h1 { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
.h2 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }

table.t { width: 100%; border-collapse: collapse; background: #fff; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--mut); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
table.t td { padding: 8px; border-bottom: 1px solid #F0EDE6; vertical-align: middle; }
table.t tr.sel td { background: #FBF3E2; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: #FAF8F3; }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #EEE9DE; color: var(--ink2); }
.tag.red { background: #FBE3E1; color: var(--bad); } .tag.ok { background: #E1F2E4; color: var(--ok); } .tag.gold { background: #F7EBD3; color: var(--gold-t); }

/* ---- Kassa ---- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; height: 100%; }
.pos .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tabs { display: flex; gap: 6px; align-items: center; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tabs button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.tabs button.on { background: var(--ink); color: var(--gold); border-color: var(--ink); }
.tabs button .x { margin-left: 8px; padding: 0 5px; border-radius: 6px; opacity: .55; font-weight: 700; }
.tabs button .x:hover { opacity: 1; background: rgba(127, 127, 127, .25); }
.search { position: relative; }
.search input { font-size: 20px; padding: 12px 14px; border-width: 2px; }
.drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 0 0 10px 10px; box-shadow: 0 10px 24px rgba(0,0,0,.12); max-height: 380px; overflow-y: auto; }
.drop div { padding: 9px 12px; display: flex; gap: 10px; border-bottom: 1px solid #F3F0EA; cursor: pointer; }
.drop div.on, .drop div:hover { background: #FBF3E2; }
.cart { flex: 1; min-height: 0; overflow-y: auto; }
.cart td.q input { width: 86px; text-align: right; padding: 5px 8px; }
.cart .x { border: 0; background: transparent; color: #aaa; font-size: 18px; }
.cart .x:hover { color: var(--bad); }
.empty { text-align: center; color: var(--mut); padding: 40px 10px; }
.right { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tot { background: var(--ink); color: #fff; border-radius: var(--r); padding: 14px 16px; }
.tot .l { display: flex; justify-content: space-between; color: #bbb; font-size: 14px; margin: 3px 0; }
.tot .big { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; color: var(--gold); }
.tot .big b { font-size: 34px; }
.tot .l .x { border: 0; background: transparent; color: #999; font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; }
.tot .l .x:hover { color: #fff; }
.tot .l .btn { background: transparent; color: var(--gold); border-color: #6b5a33; padding: 3px 10px; font-size: 13px; }
.tot .l { align-items: center; }
.kcl { margin-top: 6px; gap: 6px; }
.kcl input { padding: 8px 10px; font-size: 14px; }
.pcount { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }
.pays { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pays .btn { grid-column: span 3; }
.pays .btn.gold { grid-column: span 2; padding-left: 6px; padding-right: 6px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; }
.quick button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 6px; font-size: 12px; min-height: 54px; }
.quick button b { display: block; color: var(--gold-t); margin-top: 3px; }

/* ---- Oynalar ---- */
.ov { position: fixed; inset: 0; background: rgba(15,15,15,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal.wide { max-width: 860px; }
.modal h3 { margin: 0 0 10px; font-size: 19px; }
.modal .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 90vw; }
.toast.bad { background: var(--bad); } .toast.ok { background: var(--ok); }
.alert { padding: 9px 12px; border-radius: 8px; background: #FFF4E0; color: var(--warn); font-size: 13px; margin: 8px 0; }
.alert.bad { background: #FBE3E1; color: var(--bad); }

/* ---- Kirish / PIN ---- */
.center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--ink); }
.login { background: #fff; border-radius: 16px; padding: 26px; width: 100%; max-width: 420px; }
.login .logo { display: block; width: 120px; height: 120px; margin: 0 auto 8px; border-radius: 50%; }
.login h2 { text-align: center; margin: 4px 0 14px; }
/* Til tanlash */
select.lang-sel { width: auto; max-width: 140px; padding: 5px 8px; font-size: 13px; border-radius: 8px; cursor: pointer; }
select.lang-sel.blk { width: 100%; max-width: none; padding: 9px 11px; font-size: inherit; }
.login { position: relative; }
.lang-top { position: absolute; top: 12px; right: 12px; z-index: 2; }
.top .lang-sel, .shop-top .lang-sel { background: transparent; color: #ddd; border-color: #3a3a3a; }
.top .lang-sel option, .shop-top .lang-sel option { color: #131313; }
.m-lang { display: flex; flex: 1 1 100%; }
.m-lang .lang-sel { width: 100%; max-width: none; padding: 10px; font-size: 14px; }
.staff { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.staff button { padding: 16px 10px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
.staff button.on { border-color: var(--gold-d); background: #FBF3E2; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.pad button { padding: 16px; font-size: 22px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
.dots { text-align: center; font-size: 28px; letter-spacing: 10px; height: 40px; margin-top: 10px; }

@media (max-width: 900px) {
  .pos { grid-template-columns: 1fr; height: auto; }
  .menu { width: 70px; }
}
@media print { body * { visibility: hidden; } }

/* ---------- Raqamli klaviatura ---------- */
.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; user-select: none; }
.numpad button { border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 20px; font-weight: 600; padding: 10px 0; min-height: 46px; cursor: pointer; touch-action: manipulation; }
.numpad button:active { background: var(--gold); }
.numpad button.act { font-size: 15px; background: #f6f2ea; }
.numpad.full .np-sum, .numpad.full .np-ok { grid-column: span 2; }
.numpad.full .np-ok { background: var(--ink); color: var(--gold); border-color: var(--ink); font-size: 18px; }
.numpad.mini { margin: 8px 0 2px; }
.numpad.mini button { min-height: 42px; padding: 6px 0; font-size: 18px; }
.numpad.mini .np-0 { grid-column: span 2; }

/* ---------- Menyu belgisi (yangi buyurtmalar soni) ---------- */
.menu button { position: relative; }
.badge { position: absolute; top: 4px; right: 10px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.tag.ok { background: #e3f3e6; color: var(--ok); }
.card.ord.new { border-left: 4px solid var(--gold); }

/* ---------- Ikki holatli tugma (segment) ---------- */
.seg { display: flex; background: #efebe3; border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 9px 6px; font-size: 14px; font-weight: 600; color: var(--mut); white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- Mijozlar uchun doʻkon (telefon uchun) ---------- */
.shop { max-width: 720px; margin: 0 auto; padding: 0 12px 110px; }
.shop-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 -12px; background: var(--ink); color: #fff; }
.shop-top img { width: 38px; height: 38px; border-radius: 50%; }
.shop-top .sm { color: var(--gold); }
.shop-top .tbtn { padding: 7px 10px; font-size: 13px; }
.shop-search { position: sticky; top: 58px; z-index: 4; background: var(--bg); padding: 10px 0 6px; }
.shop-search input { font-size: 16px; padding: 12px 14px; border-radius: 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips button { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: 7px 13px; font-size: 13px; }
.chips button.on { background: var(--ink); color: var(--gold); border-color: var(--ink); }
.sp-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.sp-row .b { font-weight: 600; line-height: 1.25; }
.sp-row .sm { margin-top: 3px; }
.sp-row.off { opacity: .55; }
.sp-row > .btn { flex: 0 0 auto; padding: 9px 14px; }
.qty { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.qty button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--gold-d); background: var(--gold); font-size: 20px; font-weight: 700; line-height: 1; }
.qty span { min-width: 42px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.shop-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 12px max(16px, calc((100vw - 720px) / 2 + 12px)); background: var(--ink); color: #fff; box-shadow: 0 -4px 14px rgba(0, 0, 0, .2); }
.shop-bar .lg b { color: var(--gold); }
@media (max-width: 520px) { .shop-top .grow b { font-size: 14px; } .modal.wide { width: calc(100vw - 20px); } }
.shop-top .grow { min-width: 0; }
.shop-top .grow b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ck-lines td.num { white-space: nowrap; }
.modal .qty button { width: 34px; height: 34px; font-size: 18px; }
.modal .qty span { min-width: 34px; }
.nw { white-space: nowrap; }
.shop-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card, #fff); border: 1px solid var(--line); }
.shop-info .btn { text-decoration: none; color: inherit; }
.shop-info .sh-ver { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border-radius: 10px; background: #FFF6E0; font-size: 14px; }
.ctnet { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 10px; }
.ctnet.ph { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 10px; }
.shop-info .sh-ct { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; padding-top: 8px; border-top: 1px solid var(--line); }
.shop-info .sh-ct:first-child { padding-top: 0; border-top: 0; }
.shop-info .sh-ct a { color: var(--ink); font-weight: 600; text-decoration: none; white-space: nowrap; }
.shop-info .sh-ct a:hover { text-decoration: underline; }
.promo { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: linear-gradient(135deg, #1b1b1b, #3a2f1a); color: #fff; border: 1px solid var(--gold); }
.promo b { color: var(--gold); } .promo s { opacity: .7; } .promo .sm { margin-top: 3px; }

/* ---------- Analitika ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--gold-d); background: #FFFCF6; }
.kpi .kv { font-size: 24px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.an-chart { position: relative; margin-top: 8px; }
.an-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.an-chart .gl { stroke: #ECEAE4; stroke-width: 1; }
.an-chart .bl { stroke: #C3C2B7; stroke-width: 1; }
.an-chart .ax { fill: #898781; font-size: 11px; font-variant-numeric: tabular-nums; }
.an-chart .mk { fill: #A8862F; }
.an-chart .bar { cursor: default; } .an-chart .bar.on .mk { fill: #7D6322; }
.an-chart .tip { position: absolute; z-index: 3; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); padding: 8px 10px; min-width: 140px; }
.rb { margin-bottom: 10px; }
.rb-track { height: 10px; background: #F1EEE7; border-radius: 0 4px 4px 0; margin: 4px 0 2px; }
.rb-bar { height: 100%; background: #A8862F; border-radius: 0 4px 4px 0; }
.seg-bar { display: flex; gap: 2px; height: 32px; border-radius: 4px; overflow: hidden; }
.seg-bar > div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
th.sortable { cursor: pointer; white-space: nowrap; user-select: none; } th.sortable:hover { color: var(--ink); }
.an-wrap { max-height: calc(100vh - 250px); min-height: 160px; overflow: auto; }
.an-t th:first-child, .an-t td:first-child { position: sticky; left: 0; background: #fff; z-index: 1; min-width: 180px; }
.an-t th { z-index: 2; } .an-t th:first-child { z-index: 3; }
.an-t tfoot td { position: sticky; bottom: 0; background: #FBF8F1; border-top: 2px solid var(--line); z-index: 1; }
.an-t tfoot td:first-child { z-index: 2; background: #FBF8F1; }
.an-t td.num { white-space: nowrap; }

/* ---------- Bekor qilish sababi ---------- */
.reasons { display: grid; gap: 6px; margin: 10px 0 8px; max-height: 52vh; overflow-y: auto; }
.rsn { display: flex; align-items: center; gap: 10px; margin: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 15px; cursor: pointer; }
.rsn input { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--bad); }
.rsn:has(input:checked) { border-color: var(--bad); background: #FDF1EF; }
.btn.dim { opacity: .55; }

/* ---------- Kassa: tovarlar roʻyxati, muddat ogohlantirishi ---------- */
.plbtn { padding: 6px 12px; font-size: 13px; flex: 0 0 auto; }
.plbtn.on { background: var(--ink); color: var(--gold); border-color: var(--ink); }
.plist { display: flex; flex-direction: column; min-height: 0; flex: 1; padding: 10px; }
.pl-head { margin-bottom: 8px; } .pl-head input#pl-q { max-width: 340px; }
.pl-wrap { flex: 1; min-height: 0; overflow: auto; }
.pl-wrap table.t td { padding: 7px 8px; }
table.t tr.off td { color: var(--mut); }
.alert.exp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; }
.alert.exp .btn { padding: 5px 10px; font-size: 13px; }
input.dt { width: 138px; padding: 6px 7px; font-size: 13px; }

/* ---------- Analitika: tavsiyalar ---------- */
.tips { margin-bottom: 12px; }
.tip-i { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-top: 8px; border-radius: 8px; background: #FAF8F3; border-left: 4px solid var(--line); }
.tip-i.bad { border-left-color: var(--bad); background: #FDF3F2; }
.tip-i.warn { border-left-color: var(--warn); background: #FFF8EC; }
.tip-i.info { border-left-color: #A8862F; }
.tip-i.ok { border-left-color: var(--ok); background: #F1F8F2; }
.tip-i .sm { margin-top: 2px; color: var(--ink2); }
#exp-bar:empty { display: none; }
#an-tabs { flex-wrap: wrap; overflow: visible; }

/* 13: kassada koʻp sotiladiganlar, bonus, inventarizatsiya, kirish oynasi */
.empty.short { padding: 18px 10px 8px; }
.topsel { padding: 8px 10px 12px; border-top: 1px dashed var(--line); margin-top: 6px; }
.topsel .h2 { font-size: 14px; margin: 2px 0 8px; color: var(--mut); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 9px; min-height: 76px; cursor: pointer; }
.tile:hover { border-color: var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.tile .nm { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile b { color: var(--gold-t); }
.tile.off { opacity: .55; }
.bonus-row { align-items: center; gap: 8px; margin: 2px 0 10px; padding: 8px 10px; border-radius: 10px; background: #EEF6EE; }
.alert.inv { background: #EEF3FB; border-color: #C9D7EE; margin-top: 6px; }
#inv-bar:empty { display: none; }
.ic-last { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #F6F3EC; font-size: 15px; }
.ic-last.ok { background: #EEF6EE; } .ic-last.bad { background: #FBEDEC; color: var(--bad); }
.code-row { padding: 8px 4px; border-bottom: 1px solid var(--line); gap: 10px; }
.code-row .code { font-size: 22px; letter-spacing: 3px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.seg.roles button { font-weight: 600; }
.queue { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: #FBF6EC; }
.tgprev { white-space: pre-wrap; font-size: 14px; line-height: 1.45; background: #F6F3EC; border-radius: 10px; padding: 10px 12px; max-height: 60vh; overflow: auto; }

/* ---------- Haftalik inventarizatsiya: muddat oʻtsa — qizil, yonib-oʻchib turadi (admin tasdiqlaguncha) ---------- */
@keyframes invBlink { 0%, 100% { background: #C62828; color: #fff; border-color: #8E1B1B; } 50% { background: #FDE2E0; color: #B3261E; border-color: #E8B4AF; } }
.alert.inv.due { animation: invBlink 1.2s steps(1, end) infinite; font-weight: 600; border: 1px solid #8E1B1B; }   /* yonadi — oʻchadi (oraliq rang yoʻq — matn doim oʻqiladi) */
.alert.inv.due b { color: inherit; }
.alert.inv.due .btn { background: #fff; color: var(--bad); border-color: #E8B4AF; }

/* ---------- Kamera skaneri ---------- */
.search { display: flex; gap: 6px; align-items: stretch; }
.search input { flex: 1; min-width: 0; }
.cam-btn { flex: 0 0 auto; font-size: 20px; padding: 6px 12px; }
.cam-wrap { gap: 6px; }
details.more { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
details.more > summary { cursor: pointer; color: var(--mut); font-size: 14px; padding: 6px 0; }
.cam { position: fixed; inset: 0; z-index: 95; background: #000; display: flex; flex-direction: column; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-frame { position: absolute; left: 8%; right: 8%; top: 32%; height: 26%; border: 3px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); pointer-events: none; }
.cam-frame i { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #ff5a4e; box-shadow: 0 0 8px #ff5a4e; }
.cam-top { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 12px 10px; background: linear-gradient(#000c, #0000); color: #fff; }
.cam-msg { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: max(18px, env(safe-area-inset-bottom)); padding: 12px 14px; border-radius: 12px; background: rgba(19, 19, 19, .85); color: #fff; font-size: 15px; text-align: center; }
.cam-msg.ok { background: rgba(30, 123, 52, .92); } .cam-msg.bad { background: rgba(179, 38, 30, .92); }

/* ---------- Mijozlar ilovasi pastki qatori ---------- */
.sh-foot { text-align: center; font-size: 13px; color: var(--mut); padding: 18px 0 6px; }
.sh-foot a { color: var(--mut); }

/* ---------- Telefon (kichik ekran): pastki menyu, toʻlov paneli pastdan chiqadi, oynalar ekran kengligida ---------- */
.bnav, .m-only, .mbar, .co-head, .co-back, .m-back, .qb { display: none; }
@media (max-width: 760px) {
  html, body { font-size: 15px; overscroll-behavior-y: contain; }
  .top { height: 52px; gap: 8px; padding: 0 10px; }
  .top .brand { font-size: 0; gap: 0; } .top .brand img { width: 34px; height: 34px; }
  .top .who { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .sp, .top > .tbtn { display: none; }
  .shell { height: calc(100vh - 52px - 58px); height: calc(100dvh - 52px - 58px - env(safe-area-inset-bottom)); }
  .main { padding: 10px; }
  .menu { position: fixed; z-index: 85; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom)); width: auto; max-height: 72vh; overflow-y: auto;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 12px 10px; border: 0; border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); transform: translateY(calc(100% + 80px)); visibility: hidden; transition: transform .2s ease, visibility .2s; }
  body.menu-open .menu { transform: none; visibility: visible; }
  .menu button { border-left: 0; border-radius: 10px; padding: 10px 2px; font-size: 11.5px; text-align: center; }
  .menu button.on { background: #FBF3E2; }
  .menu hr { grid-column: 1 / -1; margin: 4px 6px; }

/* ===== Netlify bepul tarifidagi «Powered by Netlify» yozuvi (pastki oʻng burchak, ~64px) =====
   Yozuvni yashirmaymiz: u turganida (--nlb > 0) pastdan joy qoldiramiz — tugmalar, havolalar va toʻlov paneli uning ostida qolmaydi.
   --sb = iPhone pastki chizigʻi yoki Netlify yozuvi, qaysi biri kattaroq boʻlsa */
:root { --nlb: 0px; --sb: max(env(safe-area-inset-bottom, 0px), var(--nlb)); }
.shell { height: calc(100vh - 56px - var(--nlb)); }
.center { padding-bottom: calc(20px + var(--nlb)); }
.toast { bottom: calc(18px + var(--nlb)); }
.ov { padding-bottom: calc(16px + var(--nlb)); }
.shop { padding-bottom: calc(110px + var(--sb)); }
.shop-bar { padding-bottom: calc(12px + var(--sb)); }
.cam-msg { bottom: max(18px, calc(var(--sb) + 8px)); }
@media (max-width: 760px) {
  .shell { height: calc(100vh - 52px - 58px - var(--sb)); height: calc(100dvh - 52px - 58px - var(--sb)); }
  .menu { bottom: calc(58px + var(--sb)); }
  .bnav { height: calc(58px + var(--sb)); padding-bottom: var(--sb); }
  .ov { padding-bottom: 0; }
  .modal, .modal.wide { padding-bottom: calc(14px + var(--sb)); }
  .modal .foot { bottom: calc(-14px - var(--sb)); margin-bottom: calc(-14px - var(--sb)); padding-bottom: calc(12px + var(--sb)); }
  .toast { bottom: calc(70px + var(--sb)); }
  .right { padding-bottom: calc(14px + var(--sb)); }
}

.buy-rc .row { padding: 2px 0 2px 10px; }
.seg.buy-k { flex-wrap: wrap; }
/* Mijoz ilovasi sarlavhasi: tor ekranda tugmalar ikkinchi qatorga oʻtadi (sahifa kengayib ketmasin) */
.shop-top { flex-wrap: wrap; row-gap: 8px; }
.shop-top .grow { min-width: 0; }
.shop-top .grow b, .shop-top .grow .sm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) { .shop-top .tbtn { padding: 6px 8px; font-size: 12px; } }

/* Mijoz ilovasi sarlavhasi: telefonda nom toʻliq koʻrinsin — tugmalar ikkinchi qatorga tushadi */
.shop-top .sh-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.shop-top .grow { flex: 1 1 120px; }
@media (max-width: 640px) {
  .shop-top .sh-acts { flex-basis: 100%; }
  .shop-top .sh-acts .tbtn { flex: 1 1 auto; text-align: center; }
}

/* Kirimda srok majburiy: kiritilmagan sana qizil chegarada */
input.dt.need { border-color: #d9534f; background: #fff5f5; }

/* Kassa: narxni bosib oʻzgartirish */
button.pr { background: none; border: 1px dashed transparent; border-radius: 6px; padding: 2px 6px; font: inherit; color: inherit; cursor: pointer; }
button.pr:hover { border-color: var(--gold, #c9a227); }

/* ❓ Yordam */
.hp-it { border-bottom: 1px solid var(--line, #e5e5e5); }
.hp-q { display: flex; gap: 8px; align-items: center; padding: 10px 4px; font-weight: 600; }
.hp-a { padding: 0 4px 12px; }
.hp-a ol { margin: 4px 0 10px 20px; padding: 0; line-height: 1.5; }
@keyframes hpGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 160, 30, .0); } 50% { box-shadow: 0 0 0 6px rgba(217, 160, 30, .85); } }
.hp-glow { animation: hpGlow 1s ease-in-out 6; outline: 2px solid #d9a01e; outline-offset: 2px; border-radius: 8px; position: relative; z-index: 5; }

/* 🚚 Taʼminotchi boʻlimi (mijozlar ilovasida) */
.shop-top .sh-name { background: none; border: 0; padding: 0; font: inherit; color: var(--gold); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.sup-badge { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--gold); background: rgba(225, 191, 137, .16);
  color: var(--gold); font-size: 12px; font-weight: 700; cursor: pointer; line-height: 1.5; vertical-align: middle; }
.sup-badge:hover { background: var(--gold); color: var(--ink); }
.sup-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e5484d; margin-left: 4px; vertical-align: middle; }
.shop-top .tbtn.gold { color: var(--ink); background: var(--gold); border-color: var(--gold-d); font-weight: 700; }
.sup-intro { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: #FBF6EC; border: 1px solid #EADBBE; font-size: 14px; line-height: 1.45; }
.shop.sup #su-new { margin: 10px 0; }
.shop.sup .seg { margin-bottom: 4px; }
.shop.sup .shop-search { top: 58px; }
.sup-low { color: var(--bad); font-weight: 600; }
.sp-row.sup-lowrow { border-color: #F2C6C2; background: #FFF9F8; }
.su-ans { margin-top: 4px; padding: 6px 8px; border-radius: 8px; background: #F6F1E6; }
.sp-row.su-of { align-items: flex-start; }
.sp-row.su-of .tag { flex: 0 0 auto; white-space: nowrap; }
.sp-row.su-of .thumb { font-size: 18px; }
/* Rahbar: taʼminotchi takliflari */
.so-list { max-width: 900px; }
.so-row { align-items: flex-start; cursor: pointer; }
.so-row:hover { border-color: var(--gold-d); }
.so-row.so-new { border-left: 4px solid var(--gold); }
.so-row .so-side { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.so-ph { margin-bottom: 8px; }
.so-ph img { max-width: 100%; max-height: 320px; border-radius: 10px; object-fit: contain; }
.so-info { display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
@media (max-width: 520px) { .so-row .so-side .mut { display: none; } }

</style>

function xlsxDownload(fileName, opts) {

'use strict';
/* ===================== Interfeys asoslari ===================== */
const APP = () => $('#app');
let toastT;
function toast(msg, kind = '') {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + kind; t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, kind === 'bad' ? 5000 : 2500);
}
const MODALS = [];
function modal(html, opts = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}">${html}</div>`;
  document.body.appendChild(ov); MODALS.push({ ov, opts });
  const f = ov.querySelector('[autofocus]') || ov.querySelector('input,select,textarea,button.gold');
  if (f) setTimeout(() => { if (!ov.contains(document.activeElement)) { f.focus(); if (f.select) f.select(); } }, 30);
  ov.addEventListener('mousedown', e => { if (e.target === ov && !opts.sticky) tryClose(); });
  return ov.firstElementChild;
}
function closeModal() { const m = MODALS.pop(); if (m) { m.ov.remove(); if (m.opts.onClose) m.opts.onClose(); } refocus(); }
function topModal() { return MODALS.length ? MODALS[MODALS.length - 1] : null; }
// Saqlanmagan maʼlumotli oyna (masalan, kirim): «Bekor» yoki Esc bosilsa — avval soʻraladi (opts.guard xabar qaytaradi)
async function tryClose() {
  const m = topModal(); if (!m) return;
  const msg = m.opts.guard && m.opts.guard();
  if (msg && !(await confirmBox(msg, 'Ha, yopish'))) return;
  if (topModal() === m) closeModal();
}
function confirmBox(text, okText = 'Ha') {
  return new Promise(res => {
    const m = modal(`<h3>${esc(text)}</h3><div class="foot"><button class="btn" data-x="no">Yoʻq</button><button class="btn gold" data-x="yes">${esc(okText)}</button></div>`, { onClose: () => res(false) });
    m.querySelector('[data-x=yes]').onclick = () => { const mm = MODALS.pop(); mm.ov.remove(); refocus(); res(true); };
    m.querySelector('[data-x=no]').onclick = () => closeModal();
  });
}

function pickReason(title, sub, reasons) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3><div class="mut sm">${esc(sub || 'Sababini tanlang')}</div>
      <div class="reasons">${reasons.map((r, i) => `<label class="rsn"><input type="radio" name="rsn" value="${i}"><span>${esc(r)}</span></label>`).join('')}
        <label class="rsn"><input type="radio" name="rsn" value="other"><span>Boshqa sabab…</span></label></div>

      <div class="foot"><button class="btn" data-x="no">Orqaga</button><button class="btn red" data-x="ok">Bekor qilish</button></div>`, { onClose: () => res(null) });
    const o = m.querySelector('#rsn-o'), ok = m.querySelector('[data-x=ok]');
    const val = () => { const c = m.querySelector('input[name=rsn]:checked'); return !c ? '' : c.value === 'other' ? o.value.trim().replace(/\s+/g, ' ') : reasons[+c.value]; };
    const upd = () => { const c = m.querySelector('input[name=rsn]:checked'); o.classList.toggle('hide', !(c && c.value === 'other')); ok.classList.toggle('dim', val().length < 3); m.querySelector('#rsn-err').classList.add('hide'); };
    m.querySelectorAll('input[name=rsn]').forEach(i => i.onchange = () => { upd(); if (i.value === 'other') o.focus(); });
    o.oninput = upd; upd();
    ok.onclick = () => {
      const v = val();
      if (v.length < 3) { const e = m.querySelector('#rsn-err'); e.textContent = m.querySelector('input[name=rsn]:checked') ? 'Sababini yozing (kamida 3 harf)' : 'Sababni tanlang — bu majburiy'; e.classList.remove('hide'); return; }
      const mm = MODALS.pop(); mm.ov.remove(); refocus(); res(v);
    };
    m.querySelector('[data-x=no]').onclick = () => closeModal();
  });
}
const cancelReasons = kind => { const v = setting(kind === 'staff' ? 'cancel_reasons_staff' : 'cancel_reasons_client', null); return Array.isArray(v) && v.length ? v : REASONS[kind]; };
function askNumber(title, opts = {}) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3>${opts.hint ? `<div class="mut sm">${esc(opts.hint)}</div>` : ''}
      <input class="lg num" inputmode="decimal" autofocus value="${opts.value ?? ''}">${numpadOn() ? numpadHtml('mini') : ''}
      <div class="foot"><button class="btn" data-x="no">Bekor</button><button class="btn gold" data-x="ok">OK</button></div>`, { onClose: () => res(null) });
    const inp = m.querySelector('input');
    bindNumpad(m.querySelector('.numpad'), () => inp);
    const ok = () => { const t = inp.value.trim(), v = opts.raw && /^\/\s*\d/.test(t) ? t : num(t); if (typeof v === 'number' && isNaN(v)) { inp.focus(); return; } const mm = MODALS.pop(); mm.ov.remove(); refocus(); res(v); };
    m.querySelector('[data-x=ok]').onclick = ok; m.querySelector('[data-x=no]').onclick = () => closeModal();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } });
  });
}
function refocus() { if (!MODALS.length && S.tab === 'kassa' && !isPhoneUI()) { const s = $('#q'); if (s) s.focus(); } }   // telefonda klaviatura oʻzi ochilib ketmasin
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODALS.length) { e.preventDefault(); tryClose(); } }, true);

/* ---------- 2. Kirish: kim sifatida (rahbar, kassir, mijoz) va qanday (telefon raqam yoki pochta) ---------- */
function loginErr(e) {
  return e.code === 'NET' ? 'Internet yoʻq'
    : e.code === 'anonymous_provider_disabled' || /anonymous/i.test(e.message) ? 'Telefon bilan kirish uchun Supabase’da «Anonymous sign-ins» yoqilishi kerak (Authentication → Sign In / Providers).'
    : /staff_code_request|staff_login|PGRST202/.test(e.code + ' ' + e.message) ? 'Avval Supabase’da 13-SQL faylni ishga tushiring' : e.message;
}
function scrLogin(role, way) {
  role = role || ls.get('loginRole') || (window.YK_CFG ? 'client' : 'admin');   // Play Market ilovasi: yangi telefonda avval mijoz kirishi
  if (role === 'client') return scrClientLogin();
  way = way || ls.get('loginWay_' + role) || (role === 'kassa' ? 'phone' : 'email');
  const isK = role === 'kassa', byPhone = way === 'phone';
  APP().innerHTML = `<div class="center"><div class="login">${langTop()}
    <img class="logo" src="${LOGO}" alt="">
    <h2>Yangikent Market</h2><div class="c mut" style="margin-top:-6px">Kim sifatida kirasiz?</div>
    <div class="seg roles" style="margin-top:10px"><button data-r="admin" class="${role === 'admin' ? 'on' : ''}">Rahbar</button><button data-r="kassa" class="${isK ? 'on' : ''}">Kassir</button><button data-r="client">Mijoz</button></div>
    <div class="seg" style="margin-top:8px"><button data-w="phone" class="${byPhone ? 'on' : ''}">Telefon raqam</button><button data-w="email" class="${byPhone ? '' : 'on'}">Pochta</button></div>
    ${byPhone ? `<label>Telefon raqam</label><div class="row"><span class="mut">+998</span><input id="l-ph" inputmode="tel" placeholder="90 123 45 67" autocomplete="tel" maxlength="16" value="${esc(ls.get('loginPhone') || '')}"></div>
      <div id="l-code-box" class="hide">
        <div class="sm" id="l-code-info" style="margin-top:8px"></div>
        <label>Kirish kodi (6 raqam)</label><input id="l-code" inputmode="numeric" maxlength="7" autocomplete="one-time-code" placeholder="••••••">
        ${isK ? `<label>Qaysi kassa</label><select id="l-cb">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === (+ls.get('loginCb') || 1) ? 'selected' : ''}>Kassa ${n}</option>`).join('')}</select>` : ''}
        <div class="sm" style="text-align:right;margin-top:4px"><a href="#" id="l-resend">Kodni qayta olish</a></div>
      </div>`
    : `<label>Email</label><input id="l-email" type="email" autocomplete="username">
      <label>Parol</label><input id="l-pass" type="password" autocomplete="current-password">`}
    <div id="l-err" class="alert bad hide"></div>
    <button class="btn gold big blk" id="l-ok" style="margin-top:14px">${byPhone ? 'Kod olish' : 'Kirish'}</button>
    ${byPhone ? '<div class="mut sm" style="margin-top:8px">Raqamingiz rahbardagi «Xodimlar» roʻyxatida boʻlishi kerak. Kod Telegramingizga (botga ulangan boʻlsangiz) yoki SMS bilan keladi, rahbar ilovasida ham koʻrinadi.</div>' : ''}
    <div class="c sm" style="margin-top:12px"><a href="#" id="l-cfg" class="mut">Server sozlamasi</a></div>${instBtn()}
  </div></div>`;
  $$('[data-r]').forEach(b => b.onclick = () => { ls.set('loginRole', b.dataset.r); scrLogin(b.dataset.r); });
  $$('[data-w]').forEach(b => b.onclick = () => { ls.set('loginWay_' + role, b.dataset.w); scrLogin(role, b.dataset.w); });
  $('#l-cfg').onclick = e => { e.preventDefault(); scrSetup(); };
  if (!byPhone) {
    const go = async () => {
      const email = $('#l-email').value.trim(), pass = $('#l-pass').value;
      if (!email || !pass) return;
      $('#l-ok').disabled = true;
      const as = role === 'admin' ? 'admin' : 'kassa';
      try {
        await API.login(email, pass); if (S.cfg.mode) { delete S.cfg.mode; ls.set('cfg', S.cfg); }
        API.rpc('auth_attempt', { p_ok: true, p_as: as }).catch(() => { });   // rahbar kirdi — admin botiga (server oʻzi koʻrmasa)
        await afterLogin();
      } catch (e) {
        if (e.status === 400) API.rpc('auth_attempt', { p_email: email, p_ok: false, p_as: as }).catch(() => { });   // notoʻgʻri parol — admin botiga
        showErr('#l-err', e.code === 'NET' ? 'Internet yoʻq' : (e.status === 400 ? 'Email yoki parol notoʻgʻri' : e.message)); $('#l-ok').disabled = false;
      }
    };
    $('#l-ok').onclick = go; $('#l-pass').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#l-email').focus();
    return;
  }

  const phoneNow = () => { const d = $('#l-ph').value.replace(/\D/g, ''); return d.length === 9 ? '998' + d : d; };
  let sent = '';
  const needSession = async () => {
    if (S.session && S.session.user && S.session.user.email) logoutLocal();   // pochta seansi boʻlsa — yangisi
    if (!S.session) await API.anon();
  };
  const request = async () => {
    const ph = phoneNow();
    if (!/^998\d{9}$/.test(ph)) return showErr('#l-err', 'Telefon raqamni toʻliq yozing: 90 123 45 67');
    $('#l-ok').disabled = true;
    try {
      await needSession();
      let r;
      try { r = await API.rpc('staff_code_request', { p_phone: ph, p_as: role === 'admin' ? 'admin' : 'kassa' }); }
      catch (e1) {   // serverda 14-SQL hali ishga tushirilmagan boʻlsa — eski funksiya (p_as siz)

        r = await API.rpc('staff_code_request', { p_phone: ph });

      sent = ph; ls.set('loginPhone', $('#l-ph').value.trim());

      const via = [r.tg ? 'Telegramingizga' : '', r.sms ? 'SMS bilan' : ''].filter(Boolean).join(' va ');
      $('#l-code-info').innerHTML = `<b>${esc(r.name || '')}</b>, ` + (via ? `kod ${via} yuborildi.` : 'kodni rahbaringizdan oling — u «Xodimlar» boʻlimida koʻrinadi (15 daqiqa amal qiladi).');

  };

    try {
      await needSession();
      const cb = $('#l-cb') ? +$('#l-cb').value : null;

      await afterLogin();
    } catch (e) { showErr('#l-err', loginErr(e)); $('#l-ok').disabled = false; }
  };
  $('#l-ok').onclick = () => (sent && phoneNow() === sent ? login() : request());
  $('#l-resend').onclick = e => { e.preventDefault(); sent = ''; request(); };

  $$('.login input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#l-ok').click(); } }));
  $('#l-ph').focus();
}

    <label>Pochta (email)</label><input id="c-em" type="email" autocomplete="email" maxlength="120" placeholder="ism@mail.uz">

    <div id="c-err" class="alert bad hide"></div>
    <button class="btn gold big blk" id="c-ok" style="margin-top:14px">${reg ? 'Roʻyxatdan oʻtish' : 'Kirish'}</button>
    ${reg ? '<div class="mut sm" style="margin-top:8px">PIN-kodni eslab qoling — keyingi safar pochta va PIN bilan kirasiz.</div>' : '<div class="mut sm" style="margin-top:8px">PIN-kodni unutgan boʻlsangiz, doʻkonga murojaat qiling.</div>'}
    <div class="c sm" style="margin-top:12px"><a href="#" id="c-staff" class="mut">Doʻkon xodimi sifatida kirish</a></div>${instBtn()}
  </div></div>`;
  $$('[data-cw]').forEach(b => b.onclick = () => { ls.set('clientWay', b.dataset.cw); b.dataset.cw === 'email' ? scrClientEmail(mode) : scrClientLogin(mode); });

    const em = $('#c-em').value.trim().toLowerCase(), pin = $('#c-pin').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)) return showErr('#c-err', 'Pochta manzilini toʻgʻri yozing');

    if (reg && pin !== $('#c-pin2').value.trim()) return showErr('#c-err', 'PIN-kodlar bir xil emas');
    $('#c-ok').disabled = true;
    try {
      if (S.session && S.session.user && S.session.user.email) logoutLocal();
      if (!S.session) await API.anon();
      const r = reg ? await API.rpc('client_register_email', { p_name: $('#c-name').value.trim(), p_email: em, p_pin: pin })
        : await API.rpc('client_login_email', { p_email: em, p_pin: pin });
      if (r === 'wrong') { showErr('#c-err', 'PIN-kod notoʻgʻri'); $('#c-ok').disabled = false; return; }
      ls.set('cfg', Object.assign({}, S.cfg, { mode: 'client' })); S.cfg.mode = 'client';
      await afterLogin();
    } catch (e) {
      showErr('#c-err', e.code === 'NET' ? 'Internet yoʻq' : e.code === 'anonymous_provider_disabled' || /anonymous/i.test(e.message)

      $('#c-ok').disabled = false;
    }
  };
  $('#c-ok').onclick = go;
  $$('.login input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  ($('#c-name') || $('#c-em')).focus();
}

/* ---------- 2a. Mijoz: telefon va PIN bilan kirish / roʻyxatdan oʻtish (SMS kod) / PIN tiklash ---------- */
const PIN_FAILS = {};   // telefon → ketma-ket notoʻgʻri PIN (3 tadan keyin «Tiklash» taklif qilinadi)
function scrClientLogin(mode = 'in', phoneVal = '') {
  if (mode === true) mode = 'reg'; else if (!['in', 'reg', 'reset'].includes(mode)) mode = 'in';
  if (mode === 'reset') return scrClientReset(phoneVal);
  if (ls.get('clientWay') === 'email') return scrClientEmail(mode);
  const reg = mode === 'reg', reset = mode === 'reset';
  APP().innerHTML = `<div class="center"><div class="login">${langTop()}
    <img class="logo" src="${LOGO}" alt="">
    <h2>Yangikent Market</h2><div class="c mut" style="margin-top:-8px">${reset ? 'PIN-kodni tiklash' : 'Onlayn buyurtma'}</div>
    ${reset ? '' : `<div class="seg" style="margin-top:14px"><button data-cw="phone" class="on">Telefon raqam</button><button data-cw="email">Pochta</button></div>
      <div class="seg" style="margin-top:8px"><button data-m="in" class="${reg ? '' : 'on'}">Kirish</button><button data-m="reg" class="${reg ? 'on' : ''}">Roʻyxatdan oʻtish</button></div>`}
    ${reg ? '<label>Ismingiz</label><input id="c-name" autocomplete="name" maxlength="60">' : ''}
    <label>Telefon raqam</label><div class="row"><span class="mut">+998</span><input id="c-ph" inputmode="tel" placeholder="90 123 45 67" autocomplete="tel" maxlength="16" value="${esc(phoneVal)}"></div>
    <label>${reset ? 'Yangi PIN-kod' : 'PIN-kod'} (4–6 raqam)</label><input id="c-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}">
    ${mode === 'in' ? '' : '<label>PIN-kodni takrorlang</label><input id="c-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">'}
    <div id="c-code-box" class="hide">
      <label>Tasdiqlash kodi</label><input id="c-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 ta raqam">
      <div class="mut sm" style="margin-top:4px" id="c-code-info"></div><div class="sm" style="text-align:right;margin-top:2px"><a href="#" id="c-resend">Qayta yuborish</a></div>
    </div>
    <div id="c-err" class="alert bad hide"></div>
    <div id="c-forgot-box" class="forgot hide"><b>PIN-kodni unutdingizmi?</b> Hech qisi yoʻq — yangisini 1 daqiqada oʻzingiz oʻrnatasiz, uni hech kim koʻrmaydi.
      <button class="btn gold blk" id="c-forgot2" type="button" style="margin-top:8px">🔑 PIN-kodni tiklash</button></div>
    <button class="btn gold big blk" id="c-ok" style="margin-top:14px">${reg ? 'Roʻyxatdan oʻtish' : reset ? 'PIN-kodni yangilash' : 'Kirish'}</button>
    ${reg ? '<div class="mut sm" style="margin-top:8px">Raqamni tasdiqlash uchun kod SMS yoki Telegram botimiz orqali keladi (faqat bir marta). PIN-kodni eslab qoling — keyingi safar telefon raqam va PIN bilan kirasiz.</div>' : ''}
    <div class="c sm" style="margin-top:12px">${mode === 'in' ? '<a href="#" id="c-forgot">PIN-kodni unutdingizmi?</a> · ' : ''}${reset ? '<a href="#" id="c-back">Ortga</a> · ' : ''}<a href="#" id="c-staff" class="mut">Doʻkon xodimi sifatida kirish</a></div>${instBtn()}
  </div></div>`;
  const phoneNow = () => { const d = $('#c-ph').value.replace(/\D/g, ''); return d.length === 9 ? '998' + d : d; };
  $$('.seg [data-m]').forEach(b => b.onclick = () => scrClientLogin(b.dataset.m, $('#c-ph').value));
  $$('[data-cw]').forEach(b => b.onclick = () => { ls.set('clientWay', b.dataset.cw); b.dataset.cw === 'email' ? scrClientEmail(mode) : scrClientLogin(mode, $('#c-ph').value); });
  $('#c-staff').onclick = e => { e.preventDefault(); ls.set('loginRole', 'admin'); scrLogin('admin'); };
  if ($('#c-forgot')) $('#c-forgot').onclick = e => { e.preventDefault(); scrClientLogin('reset', $('#c-ph').value); };
  $('#c-forgot2').onclick = () => scrClientLogin('reset', $('#c-ph').value);
  const forgotBox = () => $('#c-forgot-box').classList.remove('hide');
  if ($('#c-back')) $('#c-back').onclick = e => { e.preventDefault(); scrClientLogin('in', $('#c-ph').value); };
  let codeFor = '', timer = null;
  const busy = v => { $('#c-ok').disabled = v; };
  // Raqam oʻzgarsa, yuborilgan kod boshqa raqamniki boʻlib qoladi
  $('#c-ph').addEventListener('input', () => { if (codeFor && phoneNow() !== codeFor) { codeFor = ''; $('#c-code').value = ''; $('#c-code-box').classList.add('hide'); } });
  const countdown = () => {
    clearInterval(timer); let left = 60; const a = $('#c-resend');
    const tick = () => { if (!document.body.contains(a)) return clearInterval(timer); a.textContent = left > 0 ? `Qayta yuborish (${left})` : 'Qayta yuborish'; a.classList.toggle('mut', left > 0); left--; if (left < -1) clearInterval(timer); };
    tick(); timer = setInterval(tick, 1000);
  };
  const sendCode = async phone => {
    const r = await API.rpc('client_sms_request', { p_phone: phone });
    if (r === 'off') throw new Error(reset ? 'PIN-kodni tiklash uchun doʻkonga murojaat qiling yoki Telegram botimizga raqamingizni yuboring' : 'SMS xizmati yoqilmagan');
    codeFor = phone;
    $('#c-code-box').classList.remove('hide');
    // kod SMS yoki raqamga ulangan Telegram chatiga keladi (raqam botda tasdiqlangan)
    $('#c-code-info').textContent = r === 'tg' ? 'Kod Telegram botimizga yuborildi — botni oching'
      : '+' + phone.replace(/^(998)(\d\d)(\d{3})(\d\d)(\d\d)$/, '$1 $2 $3 $4 $5') + ' raqamiga SMS kod yuborildi';
    $('#c-err').classList.add('hide');
    countdown(); $('#c-code').focus();
  };
  $('#c-resend').onclick = async e => {
    e.preventDefault(); if ($('#c-resend').classList.contains('mut')) return;
    try { await sendCode(phoneNow()); toast('Kod qayta yuborildi', 'ok'); } catch (er) { showErr('#c-err', er.code === 'NET' ? 'Internet yoʻq' : er.message); }
  };
  const go = async () => {
    const pin = $('#c-pin').value.trim(), phone = phoneNow(), code = $('#c-code').value.replace(/\D/g, '');
    if (!/^998\d{9}$/.test(phone)) return showErr('#c-err', 'Telefon raqamni toʻliq yozing: 90 123 45 67');
    if (!/^\d{4,6}$/.test(pin)) return showErr('#c-err', 'PIN-kod 4–6 ta raqam boʻlsin');
    if (reg && $('#c-name').value.trim().length < 2) return showErr('#c-err', 'Ismingizni yozing');
    if (mode !== 'in' && pin !== $('#c-pin2').value.trim()) return showErr('#c-err', 'PIN-kodlar bir xil emas');
    if (codeFor && code.length !== 6) return showErr('#c-err', 'Koddagi 6 ta raqamni yozing');
    busy(true);
    try {
      if (S.session && S.session.user && S.session.user.email) logoutLocal(); // xodim seansi boʻlsa, mijoz uchun yangisi
      if (!S.session) await API.anon();
      let r;
      if (reg) {
        const p = { p_name: $('#c-name').value.trim(), p_phone: phone, p_pin: pin };
        if (codeFor) p.p_code = code;
        r = await API.rpc('client_register', p);
      } else if (reset) {
        r = await API.rpc('client_reset_pin', { p_phone: phone, p_code: codeFor ? code : null, p_pin: pin });
      } else {
        r = await API.rpc('client_login', { p_phone: phone, p_pin: pin });
      }
      if (r === 'wrong') {
        PIN_FAILS[phone] = (PIN_FAILS[phone] || 0) + 1;
        showErr('#c-err', 'PIN-kod notoʻgʻri'); if (PIN_FAILS[phone] >= 3) forgotBox();
        $('#c-pin').value = ''; $('#c-pin').focus(); return busy(false);
      }
      if (r === 'need_code') { await sendCode(phone); return busy(false); }
      if (r === 'wrong_code') { showErr('#c-err', 'Kod notoʻgʻri. Qaytadan tekshiring'); $('#c-code').select(); return busy(false); }
      clearInterval(timer); delete PIN_FAILS[phone];
      if (reset) toast('PIN-kod yangilandi', 'ok');
      ls.set('cfg', Object.assign({}, S.cfg, { mode: 'client' })); S.cfg.mode = 'client';
      await afterLogin();
    } catch (e) {
      const m = e.code === 'NET' ? 'Internet yoʻq' : e.code === 'anonymous_provider_disabled' || /anonymous/i.test(e.message)
        ? 'Mijozlar uchun kirish hali yoqilmagan. Doʻkon bilan bogʻlaning.' : e.message;
      showErr('#c-err', m); busy(false);
      if (mode === 'in' && /koʻp marta xato/i.test(e.message)) forgotBox();
    }
  };
  $('#c-ok').onclick = go;
  $$('.login input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  ($('#c-name') || $('#c-ph')).focus();
}
/* ---------- 2c. Mijoz: PIN-kodni tiklash — kod SMS/Telegram orqali yoki doʻkon kassiridan; yangi PIN-ni mijozning oʻzi yozadi ---------- */
function scrClientReset(phoneVal = '') {
  APP().innerHTML = `<div class="center"><div class="login">${langTop()}
    <img class="logo" src="${LOGO}" alt="">
    <h2>PIN-kodni tiklash</h2><div class="c mut" style="margin-top:-8px">Yangi PIN-kodni oʻzingiz oʻrnatasiz — uni hech kim koʻrmaydi</div>
    <label>Telefon raqam</label><div class="row"><span class="mut">+998</span><input id="r-ph" inputmode="tel" placeholder="90 123 45 67" autocomplete="tel" maxlength="16" value="${esc(phoneVal)}"></div>
    <div id="r-step2" class="hide">
      <div id="r-how" style="margin-top:10px"></div>
      <label>Kod (6 raqam)</label><input id="r-code" inputmode="numeric" maxlength="7" autocomplete="one-time-code" placeholder="••••••">
      <div class="sm" style="text-align:right;margin-top:2px"><a href="#" id="r-resend">Kodni qayta yuborish</a></div>
      <label>Yangi PIN-kod (4–6 raqam)</label><input id="r-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
      <label>PIN-kodni takrorlang</label><input id="r-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    </div>
    <div id="r-err" class="alert bad hide"></div>
    <button class="btn gold big blk" id="r-ok" style="margin-top:14px">Kod olish</button>
    <div class="mut sm" id="r-hint" style="margin-top:8px">Kod SMS yoki Telegram botimiz orqali keladi. Ulanmagan boʻlsangiz — doʻkon kassiri bir martalik kod beradi.</div>
    <div class="c sm" style="margin-top:12px"><a href="#" id="r-back">Ortga</a></div>${instBtn()}
  </div></div>`;
  const phoneNow = () => { const d = $('#r-ph').value.replace(/\D/g, ''); return d.length === 9 ? '998' + d : d; };
  const busy = v => { $('#r-ok').disabled = v; };
  let codeFor = '', timer = null;
  $('#r-back').onclick = e => { e.preventDefault(); clearInterval(timer); scrClientLogin('in', $('#r-ph').value); };
  $('#r-ph').addEventListener('input', () => { if (codeFor && phoneNow() !== codeFor) { codeFor = ''; $('#r-step2').classList.add('hide'); $('#r-hint').classList.remove('hide'); $('#r-ok').textContent = 'Kod olish'; } });
  const how = (via, bot) => {
    const tg = `https://t.me/${encodeURIComponent(String(bot || 'yangikentdukonbot').replace(/^@/, ''))}?start=pin`;
    const ph = '+' + codeFor.replace(/^(998)(\d\d)(\d{3})(\d\d)(\d\d)$/, '$1 $2 $3 $4 $5');
    $('#r-how').innerHTML = via === 'sms' ? `<div class="alert ok">${esc(ph)} raqamiga SMS kod yuborildi.</div>`
      : via === 'tg' ? `<div class="alert ok">Kod Telegram botimizga yuborildi. <a class="btn" href="${tg}" target="_blank" rel="noopener">Botni ochish</a></div>`
      : `<div class="card how"><b>Kodni olishning 2 yoʻli:</b>
          <div class="sm" style="margin-top:6px">1) <b>Telegram orqali (1 daqiqa)</b>: botimizni oching → «Telefon raqamni yuborish» tugmasini bosing → shu yerga qaytib «Kodni qayta yuborish»ni bosing.</div>
          <a class="btn" href="${tg}" target="_blank" rel="noopener" style="margin:6px 0">Botni ochish</a>
          <div class="sm">2) <b>Doʻkonda</b>: kassirga telefon raqamingizni ayting — u bir martalik kod beradi (30 daqiqa amal qiladi). PIN-kodingizni kassir koʻrmaydi: uni shu yerda oʻzingiz yozasiz.</div></div>`;
  };
  const countdown = () => {
    clearInterval(timer); let left = 60; const a = $('#r-resend');
    const tick = () => { if (!document.body.contains(a)) return clearInterval(timer); a.textContent = left > 0 ? `Kodni qayta yuborish (${left})` : 'Kodni qayta yuborish'; a.classList.toggle('mut', left > 0); left--; if (left < -1) clearInterval(timer); };
    tick(); timer = setInterval(tick, 1000);
  };
  const start = async () => {
    const ph = phoneNow();
    if (!/^998\d{9}$/.test(ph)) return showErr('#r-err', 'Telefon raqamni toʻliq yozing: 90 123 45 67');
    busy(true);
    try {
      if (S.session && S.session.user && S.session.user.email) logoutLocal();
      if (!S.session) await API.anon();
      let r;
      try { r = await API.rpc('client_reset_start', { p_phone: ph }); }
      catch (e1) {   // 15-SQL hali yoʻq — eski yoʻl (faqat SMS/Telegram)
        if (!/PGRST202|42883|client_reset_start/.test(e1.code + ' ' + e1.message)) throw e1;
        const v = await API.rpc('client_sms_request', { p_phone: ph });
        if (v === 'off') throw new Error('PIN-kodni tiklash uchun doʻkonga murojaat qiling yoki Telegram botimizga raqamingizni yuboring');
        r = { via: v === 'tg' ? 'tg' : 'sms' };
      }
      codeFor = ph; how(r.via, r.bot);
      $('#r-err').classList.add('hide'); $('#r-hint').classList.add('hide'); $('#r-step2').classList.remove('hide');
      $('#r-ok').textContent = 'PIN-kodni yangilash'; $('#r-code').focus();
      if (r.via !== 'store') countdown();
    } catch (e) { showErr('#r-err', e.code === 'NET' ? 'Internet yoʻq' : e.message); }
    busy(false);
  };
  const finish = async () => {
    const code = $('#r-code').value.replace(/\D/g, ''), pin = $('#r-pin').value.trim();
    if (code.length !== 6) return showErr('#r-err', 'Koddagi 6 ta raqamni yozing');
    if (!/^\d{4,6}$/.test(pin)) return showErr('#r-err', 'PIN-kod 4–6 ta raqam boʻlsin');
    if (pin !== $('#r-pin2').value.trim()) return showErr('#r-err', 'PIN-kodlar bir xil emas');
    busy(true);
    try {
      const r = await API.rpc('client_reset_pin', { p_phone: codeFor, p_code: code, p_pin: pin });
      if (r === 'wrong_code') { showErr('#r-err', 'Kod notoʻgʻri. Qaytadan tekshiring'); $('#r-code').select(); return busy(false); }
      if (r !== 'ok') { showErr('#r-err', 'Kodni yozing'); return busy(false); }
      clearInterval(timer); delete PIN_FAILS[codeFor];
      toast('PIN-kod yangilandi', 'ok');
      ls.set('cfg', Object.assign({}, S.cfg, { mode: 'client' })); S.cfg.mode = 'client';
      await afterLogin();
    } catch (e) { showErr('#r-err', e.code === 'NET' ? 'Internet yoʻq' : e.message); busy(false); }
  };
  $('#r-ok').onclick = () => (codeFor && phoneNow() === codeFor ? finish() : start());
  $('#r-resend').onclick = e => { e.preventDefault(); if ($('#r-resend').classList.contains('mut')) return; codeFor = ''; start(); };
  $$('.login input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') $('#r-ok').click(); }));
  $('#r-ph').focus();
}
async function afterLogin() {
  const rows = await API.get('app_users?select=role,cashbox_id,display_name,store_id&user_id=eq.' + S.session.user.id);
  if (!rows.length) {
    if (S.cfg.mode === 'client') return scrClientLogin();
    if (S.session.user && (S.session.user.is_anonymous || !S.session.user.email)) { logoutLocal(); return scrLogin(); }   // xodim qurilmasi chiqarilgan
    return scrNoRole();
  }
  S.me = rows[0]; ls.set('me', S.me);
  syncLang();   // tanlangan til — serverga (mijozga xabarlar shu tilda)
  if (isClient()) { if (typeof tgAttach === 'function') tgAttach(); return scrShop(); }
  APP().innerHTML = `<div class="center"><div class="login c"><img class="logo" src="${LOGO}" alt=""><h2>Maʼlumotlar yuklanmoqda…</h2><div class="mut">Birinchi marta biroz vaqt oladi</div></div></div>`;
  await syncDown(true);
  start();
}
function scrNoRole() {
  APP().innerHTML = `<div class="center"><div class="login">${langTop()}
    <img class="logo" src="${LOGO}" alt="">
    <h2>Rol berilmagan</h2>
    <p class="mut">Bu akkaunt (${esc(S.session.user.email)}) hali doʻkonga ulanmagan.</p>
    <div id="n-claim" class="hide"><p class="sm">Agar siz doʻkon egasi boʻlsangiz va bu birinchi kirish boʻlsa, oʻzingizni admin qiling:</p>
    <label>Ismingiz</label><input id="n-name" value="Obidjon">
    <button class="btn gold big blk" id="n-ok" style="margin-top:12px">Men doʻkon egasiman — admin boʻlish</button></div>
    <div id="n-taken" class="alert hide">Doʻkonda rahbar bor. Kirish uchun rahbar sizga rol berishi kerak — unga murojaat qiling.</div>
    <div id="n-err" class="alert bad hide"></div>
    <button class="btn blk" id="n-out" style="margin-top:8px">Chiqish</button>
  </div></div>`;
  $('#n-ok').onclick = async () => {
    try { await API.rpc('claim_admin', { p_name: $('#n-name').value.trim() || null }); toast('Siz admin boʻldingiz', 'ok'); await afterLogin(); }
    catch (e) { showErr('#n-err', /allaqachon/.test(e.message) ? 'Admin allaqachon bor. Admin sizga rol berishi kerak (Xodimlar → Kassa akkaunti).' : e.message); }
  };
  $('#n-out').onclick = () => { logoutLocal(); scrLogin(); };
  // Admin allaqachon bor boʻlsa — «admin boʻlish» koʻrsatilmaydi (server ham ruxsat bermaydi)

    .catch(() => $('#n-claim')?.classList.remove('hide'));
}

/* ---------- 3. Kassir tanlash va PIN ---------- */
function scrPin(afterLock) {
  const list = D.staff.filter(s => s.active);
  let sel = afterLock ? S.staff : (list.length === 1 ? list[0] : null), pin = '';
  const draw = () => {
    APP().innerHTML = `<div class="center"><div class="login" style="max-width:560px">${langTop()}
      <img class="logo" src="${LOGO}" alt="" style="width:90px;height:90px">
      <h2>${afterLock ? 'Kassa bloklangan' : 'Kassir'}</h2>
      ${afterLock ? '' : `<div class="staff">${list.map(s => `<button data-s="${s.id}" class="${sel && sel.id === s.id ? 'on' : ''}">${esc(s.full_name)}<div class="sm mut">${s.role === 'cashier' ? 'kassir' : s.role === 'manager' ? 'menejer' : 'admin'}</div></button>`).join('') || '<div class="alert">Xodim yoʻq. Admin «Xodimlar» boʻlimida kassir qoʻshishi kerak.</div>'}</div>`}
      ${sel ? `<div class="c" style="margin-top:14px"><b>${esc(sel.full_name)}</b> — PIN-kodni kiriting</div>
      <div class="dots">${'●'.repeat(pin.length) || '&nbsp;'}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-n="c">⌫</button><button data-n="0">0</button><button data-n="ok" class="btn gold">OK</button></div>` : ''}
      <div id="p-err" class="alert bad hide"></div>
      <div class="row" style="justify-content:space-between;margin-top:14px">${isAdmin() && !afterLock ? '<button class="btn" id="p-skip">Admin panel</button>' : '<span></span>'}<button class="btn" id="p-out">Akkauntdan chiqish</button></div>
    </div></div>`;
    $$('[data-s]').forEach(b => b.onclick = () => { sel = list.find(s => s.id === b.dataset.s); pin = ''; draw(); });
    $$('[data-n]').forEach(b => b.onclick = () => press(b.dataset.n));
    $('#p-out').onclick = async () => { if (await confirmBox('Akkauntdan chiqasizmi?')) { logoutLocal(); scrLogin(); } };
    if ($('#p-skip')) $('#p-skip').onclick = async () => {
      if (D.staff.some(s => s.role === 'admin' && s.active)) { const a = await askAdminPin('Admin panelga kirish'); if (!a) return; S.adminStaffId = a.id; }
      S.staff = null; S.tab = 'bugun'; scrMain();
    };
  };
  const press = async n => {
    if (!sel) return;
    if (n === 'c') pin = pin.slice(0, -1);
    else if (n === 'ok') {
      try {
        if (await checkPin(sel.id, pin)) {
          S.staff = sel; ls.set('staffId', sel.id); pin = ''; I18N.staffLogin(sel.id);   // xodimning tili (shu qurilmada tanlagan boʻlsa)
          if (afterLock) { scrMain(); return; }
          const opened = await ensureShift(); if (!opened) logAudit('login', null);  // yangi smena ochilsa — «Smena ochildi» oʻzi yoziladi
          S.tab = 'kassa'; scrMain(); return;
        }
        pin = ''; draw(); showErr('#p-err', 'PIN notoʻgʻri'); return;
      } catch (e) { pin = ''; draw(); showErr('#p-err', e.message); return; }
    } else if (pin.length < 6) pin += n;
    draw();
  };
  document.onkeydown = e => {
    if (MODALS.length || !$('.pad')) return;
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('c'); else if (e.key === 'Enter') press('ok');
  };
  draw();
}

/* ---------- Smena ---------- */
async function ensureShift() {
  const cb = cashboxId();
  if (S.shift && S.shift.cashbox_id === cb && dateTK(S.shift.opened_at) === todayTK()) return false;
  if (S.shift) { await enqueue('shift_close', { shift_id: S.shift.id, counted: null }); S.shift = null; }
  if (S.online) {
    try {
      const open = await API.get(`shifts?select=id,cashbox_id,staff_id,opened_at&status=eq.open&cashbox_id=eq.${cb}`);
      const cur = open.find(s => dateTK(s.opened_at) === todayTK());
      for (const s of open) if (s !== cur) await API.rpc('close_shift', { p_shift: s.id, p_counted: null });
      if (cur) { S.shift = cur; ls.set('shift', cur); return false; }
    } catch (e) { if (e.code !== 'NET') console.warn(e); }
  }

  const sh = { id: uuid(), cashbox_id: cb, staff_id: S.staff ? S.staff.id : null, opened_at: new Date().toISOString() };

  if (oc != null) op.opening_cash = oc;
  await enqueue('shift_open', op);
  return true;
}

function newCart(no) { return { id: uuid(), no: no || freeCartNo(), lines: [], disc: null, client: null, sel: -1 }; }

function lineAmount(l) { return roundSum(l.qty * l.price); }

function totals(c = cart()) {
  const sub = c.lines.reduce((a, l) => a + lineAmount(l), 0);
  let disc = 0;
  if (c.disc) {
    if (c.disc.type === 'pct') disc = roundSum(sub * c.disc.v / 100);
    else if (c.disc.type === 'sum') disc = roundSum(c.disc.v);
    else if (c.disc.type === 'total') disc = roundSum(sub - c.disc.v);
  }
  disc = Math.max(0, Math.min(disc, sub));
  return { sub, disc, total: sub - disc, count: c.lines.length };
}

/* ---------- Tarozi yorligʻi (EAN-13: prefiks 2 + PLU 5 + qiymat 5 + nazorat 1) ---------- */
function parseScale(code) {
  if (!/^\d{13}$/.test(code)) return null;
  const pre = code.slice(0, 2), pw = String(setting('scale_prefix_weight', '20')), pp = String(setting('scale_prefix_piece', '21')), pt = String(setting('scale_prefix_total', '25'));
  if (![pw, pp, pt].includes(pre)) return null;
  const plu = parseInt(code.slice(2, 7), 10), val = parseInt(code.slice(7, 12), 10);
  const p = D.byPlu.get(plu);
  if (!p) return { error: 'Tarozi kodi (PLU) ' + plu + ' boʻyicha tovar topilmadi' };
  if (pre === pw) return { p, qty: round3(val / 1000) };
  if (pre === pp) return { p, qty: val };
  const total = val * (+setting('scale_total_mult', 1) || 1);
  return { p, qty: p.sale_price > 0 ? round3(total / p.sale_price) : 0 };
}

/* ---------- Tovar qidirish ---------- */
function findProducts(q, limit = 30) {
  const t = norm(q); if (!t) return [];
  const exact = D.byBarcode.get(q.trim()); const out = exact ? [exact] : [];
  const words = t.split(' ');
  for (const p of D.products.values()) {
    if (!p.active || p === exact) continue;
    if (p.barcode && String(p.barcode).startsWith(q.trim())) { out.push(p); continue; }
    if (words.every(w => p._n.includes(w))) out.push(p);
    if (out.length >= 200) break;
  }
  const rank = p => (p === exact ? 0 : p._n.startsWith(t) ? 1 : 2);
  return out.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)).slice(0, limit);
}
/* ---------- Aksiyalar: kassir «Aksiyalar»dan tanlab qoʻllaydi (barcha yoki tanlangan tovarlar, hamma yoki tanlangan mijozlar) ---------- */
const promoById = id => (D.promos || []).find(a => a.id === id);
// Tanlangan mijozlar uchun aksiya — savatdagi mijoz roʻyxatda boʻlsagina
const promoClientOk = (a, c) => !a.for_clients || (!!c.client && (a.clients || []).includes(c.client));
const promoCovers = (a, pid) => a.kind === 'discount' && (a.all_products || (a.items || []).some(i => i.product_id === pid));
const pctTxt = v => String(+v).replace('.', ',') + '%';
const promoScope = a => a.kind === 'info' ? 'Eʼlon' : a.kind === 'gift' ? `Sovgʻa · ${(a.items || []).length} ta tovar`
  : (a.all_products ? 'Barcha tovarlar' : `${(a.items || []).length} ta tovar`) + (a.pct ? ' · ' + pctTxt(a.pct) : '');
// Savatda qoʻllangan aksiyalardan shu tovar uchun eng arzon narx
function promoPriceFor(c, p) {
  const base = +p.sale_price; let best = null;
  for (const id of c.promos || []) {
    const a = promoById(id); if (!a || !promoClientOk(a, c) || !promoCovers(a, p.id)) continue;
    const it = (a.items || []).find(i => i.product_id === p.id);
    const price = it && it.promo_price != null ? +it.promo_price : a.pct ? Math.round(base * (1 - a.pct / 100)) : base;
    if (price < base && (!best || price < best.price)) best = { price, id: a.id, title: a.title };
  }
  return best;
}
// Aksiya qoʻshilsa/olinsa yoki mijoz oʻzgarsa — narxlar qayta hisoblanadi (qoʻlda oʻzgartirilgan narx va buyurtma narxi tegilmaydi)
function repriceCart(c) {
  for (const l of c.lines) {
    if (l.gift || l.fixed) continue;
    const p = D.products.get(l.pid); if (!p) continue;
    const pr = promoPriceFor(c, p);
    if (pr) Object.assign(l, { price: pr.price, promo: pr.title, promoId: pr.id });
    else { l.price = l.base; delete l.promo; delete l.promoId; }
  }
}
// «N ta olsa — sovgʻa»: faqat kassir qoʻllagan aksiyalar boʻyicha sovgʻa qatorlari
function applyGifts(c) {
  const want = new Map();
  for (const id of c.promos || []) {
    const a = promoById(id); if (!a || a.kind !== 'gift' || !promoClientOk(a, c)) continue;
    for (const it of a.items || []) {
      if (!(+it.buy_qty > 0) || !it.gift_product_id) continue;
      const have = c.lines.filter(l => !l.gift && l.pid === it.product_id).reduce((t, l) => t + l.qty, 0);
      const n = Math.floor(round3(have / +it.buy_qty)) * (+it.gift_qty || 1);
      if (n > 0) { const k = a.id + '|' + it.gift_product_id, w = want.get(k); want.set(k, { a, gp: it.gift_product_id, n: (w ? w.n : 0) + n }); }
    }
  }
  let changed = false;
  for (let i = c.lines.length - 1; i >= 0; i--) {
    const l = c.lines[i]; if (!l.gift) continue;
    const k = l.gift + '|' + l.pid, w = want.get(k);
    if (!w) { c.lines.splice(i, 1); changed = true; continue; }
    if (l.qty !== w.n) { l.qty = w.n; changed = true; }
    want.delete(k);
  }
  for (const { a, gp, n } of want.values()) {
    const p = D.products.get(gp); if (!p) continue;
    c.lines.push({ pid: p.id, name: p.name + ' — sovgʻa', unit: p.unit, qty: n, price: 0, base: +p.sale_price, gift: a.id, promo: a.title });
    changed = true;
  }
  if (changed) { if (c.sel >= c.lines.length) c.sel = c.lines.length - 1; saveCarts(); }
}
function setCartPromo(c, id, on) {
  c.promos = (c.promos || []).filter(x => x !== id); if (on) c.promos.push(id);
  repriceCart(c); applyGifts(c); saveCarts(); renderKassa();
}
// Mijoz oʻzgarsa: ishlatiladigan ball nolga tushadi, shu mijozga tegishli boʻlmagan «mijozlar uchun» aksiyalar olib tashlanadi
function setCartClient(c, id) {
  c.client = id || null; c.points = 0;
  const drop = (c.promos || []).filter(x => { const a = promoById(x); return !a || !promoClientOk(a, c); });
  if (drop.length) { const t = drop.map(x => promoById(x)?.title).filter(Boolean).join(', '); c.promos = c.promos.filter(x => !drop.includes(x)); if (t) toast('Aksiya olib tashlandi: ' + t); }
  repriceCart(c); applyGifts(c); saveCarts(); renderKassa();
}
// Aksiyadan tejalgan summa (katalog narxidan farqi)
const promoSaved = c => c.lines.reduce((a, l) => a + (l.promoId && !l.gift ? Math.max(0, (l.base - l.price) * l.qty) : 0), 0);
// Ball bilan toʻlanadigan summa (soʻm) — chek summasidan oshmaydi
const pointsSom = (c, t = totals(c)) => Math.min(Math.round((+c.points || 0) * ballValue()), t.total);
function addProduct(p, qty = 1, priceOverride) {
  const c = cart();
  if ((D.stock.get(p.id) || 0) <= 0 && !setting('allow_negative', true)) { toast('Omborda yoʻq: ' + p.name, 'bad'); return; }
  const pr = priceOverride == null ? promoPriceFor(c, p) : null;
  const price = priceOverride ?? (pr ? pr.price : +p.sale_price);
  if (!(price > 0)) { toast('Narxi kiritilmagan: ' + p.name, 'bad'); return; }
  let i = c.lines.findIndex(l => l.pid === p.id && !l.gift && l.price === price && !p.is_weighted && p.unit === 'dona');
  if (i >= 0) c.lines[i].qty = round3(c.lines[i].qty + qty);
  else { c.lines.push(Object.assign({ pid: p.id, name: p.name, unit: p.unit, qty: round3(qty), price, base: +p.sale_price }, pr ? { promo: pr.title, promoId: pr.id } : {}, priceOverride != null ? { fixed: true } : {})); i = c.lines.length - 1; }
  c.sel = i; saveCarts(); renderKassa();
  if ((D.stock.get(p.id) || 0) - c.lines[i].qty < 0) toast('Diqqat: omborda ' + fmtQ(D.stock.get(p.id) || 0) + ' ' + p.unit + ' qolgan', 'bad');
}

// Kamera oʻqigan kod: shtrix-kod yoki tarozi yorligʻi → savatga
async function kassaCode(code) {
  const p = D.byBarcode.get(code);
  if (p) {
    await pickQuick(p);
    const l = cart().lines.find(x => x.pid === p.id && !x.gift);
    return l ? { ok: true, text: `✓ ${p.name} — savatda ${fmtQ(l.qty)} ${l.unit} · jami ${fmt(totals().total)} soʻm` } : { ok: false, text: p.name + ' — qoʻshilmadi' };
  }
  const sc = parseScale(code);
  if (sc) { if (sc.error) return { ok: false, text: sc.error }; addProduct(sc.p, sc.qty); return { ok: true, text: `✓ ${sc.p.name} — ${fmtQ(sc.qty)} ${sc.p.unit}` }; }
  return { ok: false, text: 'Topilmadi: ' + code };
}
// Tezkor tanlov va «koʻp sotiladigan» tugmasi: tortiladigan tovar — ogʻirlik soʻraladi
async function pickQuick(p) {
  if (!p) return;
  if (p.is_weighted) { const n = await askWeight(p); if (n) addProduct(p, n); }
  else addProduct(p);
  focusQ();
}
// Tortiladigan tovar (skaner, qidiruv, roʻyxat yoki plitka orqali): ogʻirlik yoki «/» bilan summa soʻraladi
async function askWeight(p) {
  const v = await askNumber(p.name + ': ogʻirlik (' + p.unit + ')', { hint: 'Masalan 0,75 — yoki summa boʻyicha: /15000', raw: true });
  if (v == null) return null;
  if (typeof v === 'string') {   // «/15000» — shu summaga qancha tortish kerak
    const pr = promoPriceFor(cart(), p), price = pr ? pr.price : +p.sale_price, sum = num(v.replace('/', ''));
    return price > 0 && sum > 0 ? round3(sum / price) : null;
  }
  if (v >= 1000) { toast('Ogʻirlik notoʻgʻri: ' + fmtQ(v) + ' — qaytadan kiriting', 'bad'); return null; }   // skaner kodi tasodifan yozilsa
  return v > 0 ? v : null;
}

  const at = v.week_at !== undefined ? v.week_at : v.last, t = at ? Date.parse(at) : NaN;
  const days = isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 864e5));

    logAudit('price_change', { name: l.name + (v < base ? ' — sabab: ' + why : ''), from: l.price, to: v });
    l.price = v; l.fixed = true; l.reason = v < base ? why : null; delete l.promoId; delete l.promo; saveCarts(); renderKassa();
  };

}

// Ball ishlatish: hammasi taklif qilinadi, kassir kamroq yozishi mumkin (1 ball qiymati — «Sodiqlik» boʻlimida)
async function usePoints(after) {
  const c = cart(), t = totals(c), bv = ballValue(), bal = clientBonus(c.client);
  if (!c.client || !(bal > 0)) return;
  const max = Math.min(bal, Math.floor(t.total / bv));
  if (!(max > 0)) { toast('Chek summasi juda kichik'); return; }
  const n = await askNumber('Necha ball ishlatiladi?', { value: Math.floor(max * 100) / 100, hint: `Mijozda ${fmtBall(bal)} ball bor · 1 ball = ${fmtBall(bv)} soʻm · koʻpi bilan ${fmtBall(max)} ball` });

function markClientQuick(v, after) {
  const t = String(v || '').trim(), d = t.replace(/\D/g, ''), n = norm(t);
  const done = id => { setCartClient(cart(), id); const c = D.clients.find(x => x.id === id); if (c) toast('Mijoz belgilandi: ' + c.name, 'ok'); if (after) after(id); else focusQ(); };
  if (!t) return pickClient(id => id && done(id));
  const act = D.clients.filter(c => c.active !== false);
  let list = d.length >= 4 ? act.filter(c => String(c.phone || '').replace(/\D/g, '').endsWith(d.slice(-9))) : [];
  if (!list.length && !d) list = act.filter(c => norm(c.name).includes(n));
  if (list.length === 1) return done(list[0].id);
  if (list.length > 1) return pickClient(id => id && done(id), t);

}
