    catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
  };
  $('#ai-books-s').onclick = async () => {
    const v = $('#ai-books').value.trim().split(/\n+/).map(x => x.trim()).filter(Boolean).join('; ');
    try { await API.insert('settings', [{ store_id: 1, key: 'ai_books', value: v }], 'store_id,key'); D.settings.ai_books = v; toast('Saqlandi — keyingi tavsiyalarda hisobga olinadi', 'ok'); }
    catch (e) { toast(e.code === 'NET' ? 'Internet yoʻq' : e.message, 'bad'); }
  };
  await load();
}

'use strict';
/* ===================== Telegram ichida ilova (Mini App) =====================
   Botdagi «🛒 Doʻkon» tugmasi shu saytni Telegram ichida ochadi (manzilda ?tg=1 va server sozlamasi ?c=…).
   Telegram mijozni oʻzi taniydi: imzolangan maʼlumot (initData) serverda bot kaliti bilan tekshiriladi (22-SQL).
   Botga raqamini yuborgan mijoz PIN-siz kiradi; hali ulanmagan boʻlsa — bir marta raqam bilan kiradi va Telegram’i bogʻlanadi. */
const TG = { init: '', on: false, wa: null, attached: false };
(function tgCapture() {
  try {
    const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const d = h.get('tgWebAppData');
    if (d) { TG.init = d; sessionStorage.setItem('tgInit', d); }
    else TG.init = sessionStorage.getItem('tgInit') || '';
  } catch (e) { }
  TG.on = !!TG.init || /[?&]tg=1(&|$)/.test(location.search);
  if (!TG.on) return;
  document.documentElement.classList.add('in-tg');
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js'; s.async = true;
  s.onload = () => {
    const wa = window.Telegram && window.Telegram.WebApp; if (!wa) return;
    TG.wa = wa;
    if (!TG.init && wa.initData) { TG.init = wa.initData; try { sessionStorage.setItem('tgInit', wa.initData); } catch (e) { } }
    try { wa.ready(); wa.expand(); } catch (e) { }
    try { wa.setHeaderColor('#131313'); wa.setBackgroundColor('#131313'); } catch (e) { }
    try { if (wa.disableVerticalSwipes) wa.disableVerticalSwipes(); } catch (e) { }   // roʻyxatni aylantirganda ilova yopilib ketmasin
    try { wa.BackButton.onClick(() => { if (typeof topModal === 'function' && topModal()) tryClose(); }); } catch (e) { }
    tgBack();
  };
  document.head.appendChild(s);
})();
// Oyna ochiq boʻlsa — Telegram’ning «Orqaga» tugmasi uni yopadi
function tgBack() {
  if (!TG.wa || !TG.wa.BackButton) return;
  try { document.querySelector('body > .ov') ? TG.wa.BackButton.show() : TG.wa.BackButton.hide(); } catch (e) { }
}
if (TG.on) new MutationObserver(tgBack).observe(document.body || document.documentElement, { childList: true });
// Telegram maʼlumoti kelguncha kutish (skript sekin yuklansa)
async function tgInitWait(ms = 4000) {
  const t = Date.now();
  while (!TG.init && Date.now() - t < ms) await new Promise(r => setTimeout(r, 150));
  return TG.init;
}
// Telegram ichida ochilganda: mijoz sifatida oʻzi kiradi
async function tgStart() {
  if (!S.cfg) {
    APP().innerHTML = `<div class="center"><div class="login c"><img class="logo" src="${LOGO}" alt=""><h2>Yangikent Market</h2>
      <p class="mut">Ilovani botdagi «🛒 Doʻkon» tugmasi orqali qayta oching.</p></div></div>`;
    return;
  }
  if (S.session && S.me && isClient()) { tgAttach(); return scrShop(); }
  if (S.session && S.me && !isClient()) logoutLocal();   // bu oynada xodim seansi boʻlmaydi — mijoz sifatida
  APP().innerHTML = `<div class="center"><div class="login c"><img class="logo" src="${LOGO}" alt=""><h2>Yangikent Market</h2><div class="mut">Kirilmoqda…</div></div></div>`;
  S.cfg.mode = 'client'; ls.set('cfg', S.cfg);
  try {
    if (!S.session) await API.anon();
    const init = await tgInitWait();
    const r = init ? await API.rpc('client_login_tg', { p_init: init }) : 'bad';
    if (r === 'ok') return await afterLogin();
    scrClientLogin();
    const box = document.querySelector('.login');
    if (box) {
      const a = document.createElement('div'); a.className = 'alert'; a.style.marginBottom = '10px';
      a.textContent = r === 'link' ? 'Birinchi marta telefon raqamingiz bilan kiring — keyingi safar Telegram orqali oʻzi kiradi. Yoki botga «📱 Telefon raqamni yuborish» tugmasini bosing.'
        : 'Telegram orqali kirib boʻlmadi — telefon raqamingiz bilan kiring.';
      box.insertBefore(a, box.querySelector('h2') ? box.querySelector('h2').nextSibling : box.firstChild);
    }
  } catch (e) {
    APP().innerHTML = `<div class="center"><div class="login c"><img class="logo" src="${LOGO}" alt=""><h2>Yangikent Market</h2>
      <div class="alert bad">${esc(e.code === 'NET' ? 'Internet yoʻq' : e.message)}</div><button class="btn gold big blk" id="tg-retry">Qayta urinish</button></div></div>`;
    $('#tg-retry').onclick = () => tgStart();
  }
}
// Raqam bilan kirgan mijoz — Telegram’ini bogʻlaymiz (keyingi safar oʻzi kiradi, cheklar shu chatga keladi)
async function tgAttach() {
  if (!TG.on || TG.attached || !isClient()) return;
  const init = await tgInitWait(); if (!init) return;
  TG.attached = true;
  try { await API.rpc('client_tg_attach', { p_init: init }); } catch (e) { TG.attached = false; }
}
// Rahbar ilovaga kirganda: Telegram ichidagi ilova manzili «Sozlamalar»ga yoziladi — bot «🛒 Doʻkon» tugmasini shu manzil bilan qoʻyadi.
// Sayt boshqa joyga koʻchsa (SITE_URL oʻzgarsa) — bot tugmasi ham oʻzi yangilanadi
async function tgSaveUrl() {
  if (!S.cfg || !S.cfg.url || !S.cfg.key || !isAdmin()) return;
  const url = SITE_URL + '?tg=1&c=' + b64u(JSON.stringify({ u: S.cfg.url, k: S.cfg.key }));
  if (setting('mini_app_url', '') === url) return;
  try { await API.insert('settings', [{ store_id: 1, key: 'mini_app_url', value: url }], 'store_id,key'); D.settings.mini_app_url = url; }
  catch (e) { console.warn('mini_app_url', e); }
}
